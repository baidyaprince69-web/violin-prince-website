name: Character Auto-Rig Test
# Final proof: edge-connected backdrop removal, clean pose plates, no duplicate faces, and persist only after a successful render.

on:
  # Run the isolated character proof for changes that affect rig generation,
  # the Motion renderer, pose/expression staging, or the corresponding tests.
  push:
    branches:
      - baidyaprince69-web-patch-1
      - feature/character-articulated-rig-validation
      - feat/autopilot-intelligence-validation-recovery
      - fix/character-expression-face-alignment
    paths:
      - .github/workflows/character-rig-test.yml
      - autopilot/engine/character_autorig.py
      - autopilot/engine/character_rig.py
      - autopilot/engine/character_rig_test.py
      - autopilot/engine/character_visual_validation.py
      - autopilot/engine/character_daily_integration_test.py
      - autopilot/engine/character_presenter.py
      - autopilot/engine/illustration_asset_factory.py
      - autopilot/engine/hyperframes_pipeline.py
      - autopilot/engine/run_daily_plan.py
      - autopilot/engine/animation2d/build.mjs
      - autopilot/engine/animation2d/src/character-layout.mjs
      - autopilot/engine/animation2d/src/contract.mjs
      - autopilot/engine/animation2d/src/motion-build.mjs
      - autopilot/engine/animation2d/src/stagecraft.mjs
      - autopilot/engine/procedural_director_renderer.py
      - autopilot/engine/render_procedural_director_preview.py
      - autopilot/engine/tests/fixtures/master-director-procedural-demo.json
      - autopilot/engine/tests/test_procedural_director_renderer.py
      - autopilot/engine/tests/test_master_creative_director.py
      - autopilot/engine/tests/test_create_master_director_plan.py
      - autopilot/engine/animation2d/test/character-layout.test.mjs
      - autopilot/engine/animation2d/test/articulated-rig.test.mjs
      - autopilot/engine/tests/test_character_autorig.py
      - autopilot/engine/tests/test_character_rig.py
      - autopilot/engine/tests/test_character_daily_integration.py
      - autopilot/engine/tests/test_character_visual_validation.py
      - autopilot/engine/tests/test_daily_plan.py
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/character-rig-test.yml
      - autopilot/engine/character_autorig.py
      - autopilot/engine/character_rig.py
      - autopilot/engine/character_rig_test.py
      - autopilot/engine/character_visual_validation.py
      - autopilot/engine/character_daily_integration_test.py
      - autopilot/engine/character_presenter.py
      - autopilot/engine/illustration_asset_factory.py
      - autopilot/engine/hyperframes_pipeline.py
      - autopilot/engine/run_daily_plan.py
      - autopilot/engine/animation2d/build.mjs
      - autopilot/engine/animation2d/src/character-layout.mjs
      - autopilot/engine/animation2d/src/contract.mjs
      - autopilot/engine/animation2d/src/motion-build.mjs
      - autopilot/engine/animation2d/src/stagecraft.mjs
      - autopilot/engine/procedural_director_renderer.py
      - autopilot/engine/render_procedural_director_preview.py
      - autopilot/engine/tests/fixtures/master-director-procedural-demo.json
      - autopilot/engine/tests/test_procedural_director_renderer.py
      - autopilot/engine/tests/test_master_creative_director.py
      - autopilot/engine/tests/test_create_master_director_plan.py
      - autopilot/engine/animation2d/test/character-layout.test.mjs
      - autopilot/engine/animation2d/test/articulated-rig.test.mjs
      - autopilot/engine/tests/test_character_autorig.py
      - autopilot/engine/tests/test_character_rig.py
      - autopilot/engine/tests/test_character_daily_integration.py
      - autopilot/engine/tests/test_character_visual_validation.py
      - autopilot/engine/tests/test_daily_plan.py
  workflow_dispatch:
    inputs:
      source_image:
        description: Master character image path inside this repository
        required: true
        type: string
        default: autopilot/engine/assets/characters/violin-prince-reference/master-character.jpg
      reference_directory:
        description: Directory containing face and pose reference images
        required: true
        type: string
        default: autopilot/engine/assets/characters/violin-prince-reference
      use_lama:
        description: Install optional LaMa inpainting for larger hidden torso areas
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  character-rig-test:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PUBLISH_ENABLED: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU character parsing dependencies
        run: |
          python -m pip install --upgrade pip
          # The Hugging Face SCHP image processor's remote implementation imports torch and torchvision.
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install Pillow numpy
          pip install -r autopilot/engine/requirements-character.txt

      - name: Install optional LaMa reconstruction backend
        if: inputs.use_lama
        run: pip install -r autopilot/engine/requirements-character-lama.txt

      - name: Test raster-space layer, joint and occlusion diagnostics
        env:
          PYTHONPATH: autopilot/engine
        run: python -m unittest autopilot.engine.tests.test_character_visual_validation -v

      - name: Run offline character separation and rig contract tests
        working-directory: autopilot/engine
        run: |
          python -m unittest discover -s tests -p 'test_character_autorig.py'
          python -m unittest discover -s tests -p 'test_character_rig.py'
          python -m unittest discover -s tests -p 'test_character_daily_integration.py'

      - name: Separate the master character and build transparent layers
        run: |
          python autopilot/engine/character_autorig.py \
            --source "${{ inputs.source_image || 'autopilot/engine/assets/characters/violin-prince-reference/master-character.jpg' }}" \
            --reference-dir "${{ inputs.reference_directory || 'autopilot/engine/assets/characters/violin-prince-reference' }}" \
            --output work/character-autorig/violin-prince \
            --id violin-prince

      - name: Build isolated character-rig preview project
        run: |
          python autopilot/engine/character_rig_test.py \
            --bundle work/character-autorig/violin-prince \
            --output work/character-rig-test
          python autopilot/engine/character_daily_integration_test.py \
            work/character-autorig/violin-prince \
            work/character-rig-test/daily-integration

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Motion and HyperFrames
        working-directory: autopilot/engine/animation2d
        run: npm install --no-audit --no-fund

      - name: Run animation and articulated-rig regression tests
        working-directory: autopilot/engine/animation2d
        run: VP_RIG_PROJECT=../../../work/character-rig-test/project.json npm test

      - name: Build and lint the character composition
        working-directory: autopilot/engine/animation2d
        run: |
          node build.mjs --project ../../../work/character-rig-test/project.json \
            --out-dir ../../../work/character-rig-test/composition
          # build.mjs writes the composition into a subfolder; copy its referenced media beside index.html.
          mkdir -p ../../../work/character-rig-test/composition/assets/characters
          cp -R ../../../work/character-rig-test/assets/characters/violin-prince \
            ../../../work/character-rig-test/composition/assets/characters/

      - name: Lint the composition
        working-directory: work/character-rig-test/composition
        run: $GITHUB_WORKSPACE/autopilot/engine/animation2d/node_modules/.bin/hyperframes lint

      - name: Install FFmpeg and FFprobe for MP4 rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          python -m pip install --disable-pip-version-check "fonttools[woff]>=4.50,<5" "cryptography>=43,<48"

      - name: Render isolated rig preview (not production)
        working-directory: work/character-rig-test/composition
        run: $GITHUB_WORKSPACE/autopilot/engine/animation2d/node_modules/.bin/hyperframes render --output ../character-rig-preview.mp4 --fps 25 --quality standard

      - name: Build the real daily-pipeline portrait composition
        working-directory: autopilot/engine/animation2d
        run: |
          node build.mjs --project ../../../work/character-rig-test/daily-integration/project.json \
            --out-dir ../../../work/character-rig-test/daily-integration/composition
          mkdir -p ../../../work/character-rig-test/daily-integration/composition/assets/characters
          cp -R ../../../work/character-rig-test/daily-integration/assets/characters/violin-prince \
            ../../../work/character-rig-test/daily-integration/composition/assets/characters/

      - name: Verify daily presenter pose assets reach the composition
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report_path = Path("work/character-rig-test/daily-integration/composition/motion-report.json")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          expected = [
              ["resting_hands"],
              ["one_arm_raised"],
              ["explaining_two_hands"],
              ["point_left"],
              ["point_right"],
              ["open_palms"],
              ["resting_hands"],
          ]
          scene_reports = report.get("scenes", [])
          actual = [scene.get("presenter_pose_assets", []) for scene in scene_reports[:len(expected)]]
          if report.get("presenter_pose_asset_count") != len(expected) or actual != expected:
              raise SystemExit(
                  "Daily portrait composition did not select every requested presenter pose asset: "
                  + json.dumps(actual)
              )

          performance = next(
              (scene for scene in scene_reports if scene.get("scene_id") == "scene-procedural-performance"),
              None,
          )
          if not performance:
              raise SystemExit("The procedural performance scene is missing from the Motion report.")
          if performance.get("stagecraft_environment") != "concert_stage":
              raise SystemExit("The procedural stage environment did not reach the Motion composition.")
          if performance.get("animated_stagecraft_environment_nodes", 0) < 9:
              raise SystemExit("The concert environment lacks independently animated stagecraft nodes.")
          if performance.get("animated_stagecraft_objects", 0) != 4:
              raise SystemExit("Not all four story-specific stage objects were animated.")
          if performance.get("animated_stagecraft_nodes", 0) < 13:
              raise SystemExit("The procedural stage is missing one or more motion tracks.")
          if performance.get("animated_presenter_count", 0) < 1:
              raise SystemExit("The stage scene did not animate the articulated Violin Prince rig.")
          if performance.get("presenter_gesture_keyframes", 0) < 4:
              raise SystemExit("The articulated dance gesture did not generate joint keyframes.")
          print("Verified 7 authored poses plus a live procedural stage, 4 moving props and an articulated presenter.")
          PY

      - name: Lint the daily-pipeline portrait composition
        working-directory: work/character-rig-test/daily-integration/composition
        run: $GITHUB_WORKSPACE/autopilot/engine/animation2d/node_modules/.bin/hyperframes lint

      - name: Render daily-pipeline portrait integration proof (not production)
        working-directory: work/character-rig-test/daily-integration/composition
        run: $GITHUB_WORKSPACE/autopilot/engine/animation2d/node_modules/.bin/hyperframes render --output ../character-rig-portrait-preview.mp4 --fps 25 --quality standard

      - name: Render complete procedural Master Director short (preview only)
        env:
          PYTHONPATH: autopilot/engine
        run: |
          python autopilot/engine/render_procedural_director_preview.py \
            --plan autopilot/engine/tests/fixtures/master-director-procedural-demo.json \
            --output-dir work/character-rig-test/master-director-procedural \
            --rig-bundle-dir work/character-autorig/violin-prince

      - name: Verify procedural Master Director MP4 and motion coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("work/character-rig-test/master-director-procedural")
          report = json.loads((root / "procedural-preview-report.json").read_text(encoding="utf-8"))
          motion = report["motion_report"]
          if report.get("status") != "passed" or report.get("publishable") is not False:
              raise SystemExit("Procedural Master Director preview must pass and remain non-publishable.")
          if report.get("shot_count") != 8 or abs(float(report.get("duration_seconds", 0)) - 32.0) > 0.5:
              raise SystemExit("Rendered preview does not match the eight-shot, 32-second storyboard.")
          if motion.get("animated_stagecraft_scene_count") != 8:
              raise SystemExit("All eight Director scenes must have their own animated environment.")
          if motion.get("animated_stagecraft_object_count", 0) < 16:
              raise SystemExit("Procedural preview is missing story-authored moving objects.")
          if motion.get("animated_presenter_count", 0) < 3:
              raise SystemExit("Procedural preview must include multiple articulated presenter scenes.")
          if motion.get("rendered_layer_count") != 0:
              raise SystemExit("Procedural preview unexpectedly used legacy picture layers.")
          for name in ("master-director-preview.mp4", "master-director-contact-sheet.jpg"):
              file = root / name
              if not file.is_file() or file.stat().st_size < 10000:
                  raise SystemExit(f"Missing or invalid rendered proof: {file}")
          print("Verified the complete procedural short, scene motion, presenter articulation, MP4 and contact sheet.")
          PY

      - name: Save the tested rig bundle for the main animation pipeline
        if: success() && (github.ref_name == 'baidyaprince69-web-patch-1' || github.ref_name == 'feature/character-articulated-rig-validation' || github.ref_name == 'feat/procedural-2d-animation-engine')
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          LOCAL_SHA="$(git rev-parse HEAD)"
          REMOTE_SHA="$(git rev-parse "origin/$GITHUB_REF_NAME")"
          if [[ "$LOCAL_SHA" != "$REMOTE_SHA" ]]; then
            echo "Source branch advanced during this render; skip saving this older rig bundle."
            exit 0
          fi
          DEST="autopilot/engine/assets/characters/violin-prince-rig"
          mkdir -p "$DEST"
          cp -R work/character-autorig/violin-prince/. "$DEST/"
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path("autopilot/engine").resolve()))
          from character_rig import validate_character_spec

          bundle = Path("autopilot/engine/assets/characters/violin-prince-rig").resolve()
          spec = json.loads((bundle / "character.json").read_text(encoding="utf-8"))
          report = json.loads((bundle / "separation-report.json").read_text(encoding="utf-8"))
          if report.get("status") != "candidate_ready_for_visual_review":
              raise SystemExit("Refusing to save a rig bundle without candidate-ready status.")
          validate_character_spec(spec)
          for section in ("layers",):
              for item in spec.get(section, []):
                  candidate = (bundle / item["src"]).resolve()
                  if bundle not in candidate.parents or not candidate.is_file():
                      raise SystemExit(f"Missing or unsafe character asset: {item['src']}")
          for section in ("expressions", "pose_assets"):
              for item in spec.get(section, {}).values():
                  candidate = (bundle / item["src"]).resolve()
                  if bundle not in candidate.parents or not candidate.is_file():
                      raise SystemExit(f"Missing or unsafe character asset: {item['src']}")
          print("Saved bundle passed character-spec and asset-file validation.")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          if git diff --cached --quiet; then
            echo "The saved character rig bundle is already up to date."
          else
            git commit -m "Save tested Violin Prince rig bundle for daily animation"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Preserve rig evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: violin-prince-character-rig-test-${{ github.run_id }}
          path: |
            work/character-autorig/violin-prince/
            work/character-rig-test/
            work/character-rig-test/master-director-procedural/
          if-no-files-found: error
          retention-days: 14
