name: Cancel redundant Violin Prince production runs

on:
  push:
    branches:
      - feature/blender-3d-overlays
    paths:
      - ".github/workflows/cancel-redundant-runs.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel-superseded-pr-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel only verified redundant runs and preserve the selected production
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_RUN_ID: "43698607527"
          KEEP_HEAD_SHA: "a616fc58c6b00c49e5c98e3a6567c78e2da11dd7"
        shell: bash
        run: |
          set -Eeuo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs"
          summary="$RUNNER_TEMP/cancel-summary.txt"
          : > "$summary"

          runs_json="$RUNNER_TEMP/branch-runs.json"
          curl -fsS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api?branch=feature/blender-3d-overlays&per_page=100" > "$runs_json"

          mapfile -t obsolete_runs < <(jq -r --arg keep "$KEEP_RUN_ID" --arg sha "$KEEP_HEAD_SHA" '
            .workflow_runs[]
            | select(.head_branch == "feature/blender-3d-overlays")
            | select(.status == "queued" or .status == "in_progress")
            | select(
                (
                  .name == "Autopilot code checks"
                  and (.event == "push" or .event == "pull_request")
                  and ((.id | tostring) != $keep)
                  and .head_sha != $sha
                )
                or
                (
                  .name == "Blender full-scene 3D production preview"
                  and .event == "pull_request"
                )
              )
            | .id
          ' "$runs_json")

          echo "Preserving selected production run $KEEP_RUN_ID on commit $KEEP_HEAD_SHA."
          echo "Found ${#obsolete_runs[@]} redundant queued/running workflow run(s)."

          for run_id in "${obsolete_runs[@]}"; do
            if [[ "$run_id" == "$KEEP_RUN_ID" ]]; then
              echo "Safety guard: refusing to cancel protected run $run_id" >&2
              exit 1
            fi

            response="$RUNNER_TEMP/run-$run_id.json"
            http_code="$(curl -sS -o "$response" -w "%{http_code}" \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api/$run_id")"
            if [[ "$http_code" != "200" ]]; then
              echo "Could not verify run $run_id (HTTP $http_code); left untouched." | tee -a "$summary"
              continue
            fi

            branch="$(jq -r '.head_branch // ""' "$response")"
            name="$(jq -r '.name // ""' "$response")"
            event="$(jq -r '.event // ""' "$response")"
            status="$(jq -r '.status // ""' "$response")"
            head_sha="$(jq -r '.head_sha // ""' "$response")"

            if [[ "$branch" != "feature/blender-3d-overlays" || \
                  "$head_sha" == "$KEEP_HEAD_SHA" || \
                  "$name" == "Cancel redundant Violin Prince production runs" ]]; then
              echo "Safety guard: run $run_id did not match cancellation criteria; left untouched." | tee -a "$summary"
              continue
            fi

            if [[ "$name" == "Autopilot code checks" && \
                  ( "$event" != "push" && "$event" != "pull_request" ) ]]; then
              echo "Run $run_id had an unexpected event type; left untouched." | tee -a "$summary"
              continue
            fi
            if [[ "$name" == "Blender full-scene 3D production preview" && "$event" != "pull_request" ]]; then
              echo "Run $run_id was not a PR preview; left untouched." | tee -a "$summary"
              continue
            fi
            if [[ "$status" != "queued" && "$status" != "in_progress" ]]; then
              echo "Run $run_id is already $status; no cancellation needed." | tee -a "$summary"
              continue
            fi

            cancel_code="$(curl -sS -o "$RUNNER_TEMP/cancel-$run_id.json" -w "%{http_code}" \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api/$run_id/cancel")"

            if [[ "$cancel_code" == "202" ]]; then
              echo "Cancellation accepted: $run_id ($name, $event, previous status $status)." | tee -a "$summary"
            else
              echo "Cancellation for run $run_id returned HTTP $cancel_code; final status must be checked." | tee -a "$summary"
            fi
          done

          {
            echo "## Redundant Violin Prince runs"
            echo
            echo "- Protected 600-frame production run: $KEEP_RUN_ID"
            echo "- Protected commit: $KEEP_HEAD_SHA"
            cat "$summary"
          } >> "$GITHUB_STEP_SUMMARY"
