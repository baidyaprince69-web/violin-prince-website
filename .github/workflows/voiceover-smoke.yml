name: Autopilot own-voice lock smoke test

on:
  push:
    branches: [main]
    paths:
      - "autopilot/engine/voiceover.py"
      - "autopilot/engine/tests/test_voiceover.py"
      - ".github/workflows/voiceover-smoke.yml"
  pull_request:
    paths:
      - "autopilot/engine/voiceover.py"
      - "autopilot/engine/tests/test_voiceover.py"
      - ".github/workflows/voiceover-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-own-voice-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Verify own-voice gate and caption helpers without synthesis
        run: python -m unittest discover -s autopilot/engine/tests -p "test_voiceover.py" -v
