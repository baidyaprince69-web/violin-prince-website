name: Violin Prince Blender Benchmark

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Completed production run whose saved package should be benchmarked (Run #63 by default)."
        required: true
        default: "43735549545"
        type: string
      benchmark_suite:
        description: "Choose a bounded benchmark comparison."
        required: true
        default: baseline_and_contention
        type: choice
        options:
          - baseline_and_contention
          - full_matrix
          - ablation_only
      sample_frames:
        description: "Maximum initial animation frames rendered per Blender process."
        required: true
        default: "3"
        type: choice
        options:
          - "2"
          - "3"
          - "4"
      egl_mode:
        description: "EGL/X display configuration for Blender's headless process."
        required: true
        default: surfaceless
        type: choice
        options:
          - surfaceless
          - unset
          - xvfb

permissions:
  contents: read
  actions: read

concurrency:
  group: violin-prince-blender-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Controlled Blender benchmark
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.benchmark_suite == 'baseline_and_contention' && 90 || 240 }}
    env:
      # Hard safety boundary: this workflow has no publishing steps or credentials.
      PUBLISH_ENABLED: "false"
      AUTOPILOT_API_URL: ""
      AUTOPILOT_JOB_TOKEN: ""
      BLENDER_BENCHMARK_DIAGNOSTICS: "1"
      BLENDER_RENDER_DIAGNOSTICS: "1"
      BLENDER_RENDER_ENABLED: "true"
      BLENDER_RENDER_WORKERS: "3"
      BLENDER_THREADS_PER_WORKER: "1"
      BLENDER_RENDER_WIDTH: "720"
      BLENDER_RENDER_HEIGHT: "1280"
      BLENDER_RENDER_FPS: "25"
      BLENDER_RENDER_SAMPLES: "16"
      BLENDER_MODEL_FACE_LIMIT: "60000"
      BLENDER_RENDER_TIMEOUT_SECONDS: "900"
      BENCH_RENDER_TIMEOUT_SECONDS: "2400"
      BENCH_MAX_FRAMES: ${{ inputs.sample_frames }}
      BENCH_EGL_MODE: ${{ inputs.egl_mode }}
      LIBGL_ALWAYS_SOFTWARE: "1"
      MESA_LOADER_DRIVER_OVERRIDE: "llvmpipe"
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      SKETCHFAB_ACCESS_TOKEN: ${{ secrets.SKETCHFAB_ACCESS_TOKEN }}

    steps:
      - name: Check out benchmark code
        uses: actions/checkout@v4

      - name: Validate inputs and hard publishing boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$PUBLISH_ENABLED" == "false" ]] || {
            echo "::error::Publishing must remain disabled."
            exit 1
          }
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "::error::source_run_id must be numeric."
            exit 1
          }
          [[ "$BENCH_MAX_FRAMES" =~ ^[234]$ ]] || {
            echo "::error::sample_frames must be 2, 3, or 4."
            exit 1
          }
          case "$BENCH_EGL_MODE" in
            surfaceless|unset|xvfb) ;;
            *) echo "::error::Unsupported EGL mode."; exit 1 ;;
          esac
          [[ -n "$SKETCHFAB_ACCESS_TOKEN" ]] || {
            echo "::error::SKETCHFAB_ACCESS_TOKEN is required because the Run #63 artifact does not include the downloaded GLTF model."
            exit 1
          }
          echo "Publishing is hard-disabled. No YouTube or publisher credentials are configured."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: autopilot/engine/requirements.txt

      - name: Restore the selected production run artifact
        uses: actions/download-artifact@v4
        with:
          name: violin-prince-run-${{ inputs.source_run_id }}
          path: work
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}

      - name: Install benchmark-only Python dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install "requests>=2.32,<3"

      - name: Install Xvfb for the optional display-mode comparison
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install pinned Blender 5.2.4 and Frame By Plane 8.0.1
        uses: ./.github/actions/setup-blender-frame-by-plane

      - name: Compile diagnostic code and run focused unit tests
        env:
          # Keep the existing renderer tests in normal mode; the benchmark-only
          # child environment is enabled only by the actual benchmark step.
          BLENDER_BENCHMARK_DIAGNOSTICS: "0"
          BLENDER_RENDER_DIAGNOSTICS: "0"
          BENCH_MAX_FRAMES: ""
        run: |
          python -m py_compile \
            autopilot/engine/benchmark_telemetry.py \
            autopilot/engine/blender_renderer.py \
            autopilot/engine/blender_scene.py \
            autopilot/engine/run_benchmark_suite.py
          python -m unittest \
            autopilot/engine/tests/test_blender_renderer.py \
            autopilot/engine/tests/test_benchmark_telemetry.py

      - name: Run bounded benchmark suite
        run: |
          python autopilot/engine/run_benchmark_suite.py \
            --suite "${{ inputs.benchmark_suite }}" \
            --sample-frames "$BENCH_MAX_FRAMES" \
            --egl-mode "$BENCH_EGL_MODE"

      - name: Upload diagnostic reports and short benchmark clips
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blender-benchmark-${{ github.run_id }}
          path: |
            work/output/blender-diagnostics/
            work/output/benchmark-*.mp4
            work/story-assets/asset-resolution-diagnostic.json
          if-no-files-found: warn
          retention-days: 7

      - name: Write benchmark summary to the job page
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          summary = Path("work/output/blender-diagnostics/benchmark-summary.json")
          if not summary.is_file():
              print("No benchmark-summary.json was produced.")
              raise SystemExit(0)
          data = json.loads(summary.read_text(encoding="utf-8"))
          counts = {
              "completed": sum(item.get("status") == "completed" for item in data.get("results", [])),
              "failed": sum(item.get("status") == "failed" for item in data.get("results", [])),
          }
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("# Blender benchmark summary\n\n")
              output.write(f"- Suite: `{data.get('suite')}`\n")
              output.write(f"- Sample frames per process: {data.get('sample_frames')}\n")
              output.write(f"- Completed cases: {counts['completed']}\n")
              output.write(f"- Failed cases: {counts['failed']}\n")
              ratio = data.get("scene_1_contention_slowdown_ratio")
              output.write(f"- Scene 1 contention slowdown ratio: {ratio if ratio is not None else 'not available'}\n")
              output.write("- Publishing: disabled\n")
          PY
