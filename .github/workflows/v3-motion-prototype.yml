name: Violin Prince V3 motion prototype

on:
  push:
    branches:
      - v3-motion-prototype
    paths:
      - "autopilot/engine/voiceover.py"
      - "autopilot/engine/run.py"
      - "autopilot/engine/motion_prototype.py"
      - "autopilot/engine/tests/**"
      - "autopilot/motion-prototype/**"
      - ".github/workflows/v3-motion-prototype.yml"
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful V2 run whose prepared package should be used"
        required: true
        default: "43345195703"
        type: string
      fresh_visual_test:
        description: "Regenerate fresh AI artwork and the deterministic violin macro"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: violin-prince-v3-motion-prototype
  cancel-in-progress: false

jobs:
  prototype:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      PUBLISH_ENABLED: "false"
      RUN_ID: ${{ github.run_id }}
      FRESH_VISUAL_TEST: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[fresh-visual-test]')) || (github.event_name == 'workflow_dispatch' && inputs.fresh_visual_test) }}
      SOURCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || '43345195703' }}
    steps:
      - name: Validate source run ID
        shell: bash
        run: |
          if [[ ! "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::source_run_id must contain only digits."
            exit 1
          fi

      - name: Check out V3 prototype branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: autopilot/engine/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install FFmpeg and font fallback
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Cache Kokoro model files
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-v1-cache

      - name: Install CPU narration dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r autopilot/engine/requirements.txt

      - name: Install pinned Playwright and Chromium
        run: |
          npm --prefix autopilot/motion-prototype install --no-audit --no-fund --no-package-lock
          autopilot/motion-prototype/node_modules/.bin/playwright install --with-deps chromium

      - name: Compile Python and JavaScript
        run: |
          python -m py_compile autopilot/engine/*.py
          node --check autopilot/motion-prototype/render.mjs

      - name: Run Python regression tests, including native word timing
        run: python -m unittest discover -s autopilot/engine/tests -v

      - name: Smoke-test HTML rendering with synthetic inputs
        shell: bash
        run: |
          python - <<'PY'
          import base64, json
          from pathlib import Path
          from PIL import Image

          root = Path("work/v3-renderer-smoke")
          root.mkdir(parents=True, exist_ok=True)
          colours = [(32, 52, 78), (72, 48, 42), (34, 72, 62)]
          scenes = []
          for index, colour in enumerate(colours):
              path = root / f"scene-{index + 1}.jpg"
              Image.new("RGB", (360, 640), colour).save(path, "JPEG", quality=82)
              scenes.append({
                  "start": float(index),
                  "duration": 1.0,
                  "caption": ["The opening image", "A key detail", "The final reveal"][index],
                  "graphic_label": ["OPENING", "DETAIL", "PAYOFF"][index],
                  "graphic_detail": "A synthetic renderer smoke test.",
                  "image_b64": base64.b64encode(path.read_bytes()).decode("ascii")
              })
          words = ["A", "small", "test", "checks", "word", "motion", "timing", "and", "graphics", "render", "cleanly", "today"]
          cues = [
              {"start": 0.08 + i * 0.22, "end": 0.26 + i * 0.22, "text": word}
              for i, word in enumerate(words)
          ]
          payload = {
              "title": "V3 Renderer Smoke Test",
              "width": 720, "height": 1280, "fps": 12,
              "duration_seconds": 3,
              "visual_motif": "rapid violin performance with bow and strings",
              "scenes": scenes, "word_cues": cues
          }
          (root / "input.json").write_text(json.dumps(payload), encoding="utf-8")
          PY
          node autopilot/motion-prototype/render.mjs work/v3-renderer-smoke/input.json work/v3-renderer-smoke/smoke.mp4
          duration=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 work/v3-renderer-smoke/smoke.mp4)
          python -c "value=float('$duration'); assert 2.8 <= value <= 3.2, value; print('HTML renderer smoke video duration:', value)"

      - name: Download successful V2 prepared package
        uses: actions/download-artifact@v4
        with:
          name: violin-prince-run-${{ env.SOURCE_RUN_ID }}
          path: work
          run-id: ${{ env.SOURCE_RUN_ID }}
          repository: baidyaprince69-web/violin-prince-website
          github-token: ${{ github.token }}

      - name: Verify restored prepared package
        run: |
          set -euo pipefail
          for file in creative_plan.json stage.json soundtrack.wav narration.wav scene-1.jpg scene-2.jpg scene-3.jpg; do
            test -s "work/package/$file" || {
              echo "::error::Prepared package is missing or empty: $file"
              exit 1
            }
          done
          python - <<'PY'
          import json, wave
          from pathlib import Path
          package = Path("work/package")
          plan = json.loads((package / "creative_plan.json").read_text(encoding="utf-8"))
          stage = json.loads((package / "stage.json").read_text(encoding="utf-8"))
          if not isinstance(plan, dict) or not isinstance(plan.get("scenes"), list) or len(plan["scenes"]) != 3:
              raise SystemExit("Prepared creative plan must contain exactly three scenes.")
          if any(not isinstance(scene, dict) or not str(scene.get("caption", "")).strip() for scene in plan["scenes"]):
              raise SystemExit("Prepared creative plan contains an invalid or captionless scene.")
          narration = stage.get("narration_info")
          if not isinstance(narration, dict) or not isinstance(narration.get("subtitle_cues"), list) or not narration["subtitle_cues"]:
              raise SystemExit("Prepared stage metadata is missing narration subtitle timings.")
          for name in ("soundtrack.wav", "narration.wav"):
              try:
                  with wave.open(str(package / name), "rb") as audio:
                      if audio.getnchannels() not in (1, 2) or audio.getnframes() <= 0 or audio.getframerate() <= 0:
                          raise SystemExit(f"{name} is not a valid non-empty PCM WAV.")
              except (wave.Error, EOFError, OSError) as exc:
                  raise SystemExit(f"{name} is not a readable PCM WAV: {exc}") from exc
          print("Prepared story, native narration timings, soundtrack and narration assets passed preflight.")
          PY

      - name: Prepare a dedicated violin-performance visual test story
        if: env.FRESH_VISUAL_TEST == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          plan_path = Path("work/package/creative_plan.json")
          plan = json.loads(plan_path.read_text(encoding="utf-8"))
          plan.update({
              "title": "How a Violinist Shapes a Phrase",
              "topic": "How a violinist uses controlled bow changes, string contact and resonance to shape an expressive musical phrase",
              "visual_motif": "one consistent amber-varnished violin, dark tailpiece, four strings, active bowing performance",
              "narration_script": (
                  "A violinist shapes a phrase through controlled bow changes. "
                  "The bow hair meets the strings between the bridge and fingerboard, "
                  "where tiny changes in speed and pressure shape the tone. "
                  "As the bow alternates direction, the bridge carries the vibration "
                  "into the wooden body, turning motion into sound."
              ),
              "scenes": [
                  {
                      "image_prompt": "The same expressive violinist beginning a flowing musical phrase on an amber-varnished violin, upper body and instrument readable in an active playing posture, bow in motion, intimate warm concert room",
                      "caption": "Every phrase begins with controlled motion",
                      "graphic_label": "THE PERFORMANCE",
                      "graphic_detail": "Bow speed and pressure shape the sound"
                  },
                  {
                      "image_prompt": "Single frozen side-three-quarter macro keyframe at string height: one upright maple bridge supports four separate parallel strings, and the ebony fingerboard is clearly visible behind it. One dark wooden violin bow crosses the strings from left to right at about 90 degrees. Show its thin pale horsehair ribbon visibly touching exactly one string at one clear point between bridge and fingerboard; the bow stick and horsehair must be distinct and connected parts of the same bow. Center the contact point. No hand is needed.",
                      "caption": "The bow catches each string",
                      "graphic_label": "BOW–STRING CONTACT",
                      "graphic_detail": "Tiny changes in speed and pressure shape tone"
                  },
                  {
                      "image_prompt": "A wider cinematic view of the same violinist completing the phrase on the same amber-varnished violin, active playing posture and smooth finishing bow stroke, warm concert room with restrained copper and antique-gold atmosphere",
                      "caption": "The wooden body carries the vibration",
                      "graphic_label": "MOTION BECOMES SOUND",
                      "graphic_detail": "The bridge passes vibration into the body"
                  }
              ]
          })
          plan_path.write_text(json.dumps(plan, ensure_ascii=False, indent=2), encoding="utf-8")
          PY
          rm -f work/package/scene-1.jpg work/package/scene-2.jpg work/package/scene-3.jpg
          rm -f work/package/storyboard-preview.png

      - name: Generate fresh scene artwork using AI and precision macro rendering
        if: env.FRESH_VISUAL_TEST == 'true'
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$CF_ACCOUNT_ID" || -z "$CF_AI_TOKEN" ]]; then
            echo "::error::CF_ACCOUNT_ID and CF_AI_TOKEN repository secrets are required for this fresh visual test."
            exit 1
          fi
          python autopilot/engine/run.py --stage visuals
          test -s work/package/scene-1.jpg
          test -s work/package/scene-2.jpg
          test -s work/package/scene-3.jpg
          test -s work/package/storyboard-preview.png

      - name: Verify fresh portrait assets and record visual proof
        if: env.FRESH_VISUAL_TEST == 'true'
        run: |
          python - <<'PY'
          import hashlib, json, os, shutil, sys
          from pathlib import Path
          from PIL import Image

          sys.path.insert(0, str(Path("autopilot/engine").resolve()))
          import run as engine

          package = Path("work/package")
          output = Path("work/output/motion-prototype")
          output.mkdir(parents=True, exist_ok=True)
          plan = json.loads((package / "creative_plan.json").read_text(encoding="utf-8"))
          metadata = json.loads((package / "stage.json").read_text(encoding="utf-8"))
          # Validate the unused macro brief as an offline contract only. The
          # precision illustration is procedural and is deliberately not sent to FLUX.
          macro_brief = engine._scene_visual_prompt(plan["scenes"][1], index=1, plan=plan)
          prompt_char_count = len(macro_brief)
          if not macro_brief or prompt_char_count > engine.MAX_IMAGE_PROMPT_CHARS:
              raise SystemExit(f"Macro fallback brief is empty or over the prompt limit: {prompt_char_count}")

          run_id = os.environ["RUN_ID"]
          if metadata.get("stage") != "visuals_ready":
              raise SystemExit("Fresh visual stage did not complete successfully.")
          if str(metadata.get("visuals_run_id")) != str(run_id):
              raise SystemExit("Visual package run ID does not match this fresh-test run.")
          expected_modes = [
              "cloudflare_flux_portrait_extended",
              "deterministic_violin_contact_illustration",
              "cloudflare_flux_portrait_extended",
          ]
          if metadata.get("visual_modes") != expected_modes:
              raise SystemExit(f"Unexpected fresh visual render modes: {metadata.get('visual_modes')}")
          if metadata.get("portrait_dimensions") != [engine.W, engine.H]:
              raise SystemExit(f"Portrait dimension metadata is invalid: {metadata.get('portrait_dimensions')}")
          visual_assets = metadata.get("visual_assets", [])
          if len(visual_assets) != 3 or visual_assets[1].get("string_count") != 4:
              raise SystemExit("Precision macro metadata did not confirm four distinct strings.")
          if visual_assets[1].get("highlighted_contact_points") != 1:
              raise SystemExit("Precision macro metadata must confirm exactly one highlighted contact point.")
          if visual_assets[1].get("contact_alignment_error_px", 999) > 5:
              raise SystemExit("Precision macro contact marker is not aligned with its selected string.")
          images = []
          for index in range(1, 4):
              path = package / f"scene-{index}.jpg"
              if not path.is_file() or path.stat().st_size < 10000:
                  raise SystemExit(f"Fresh scene image {index} is missing or unexpectedly small.")
              with Image.open(path) as image:
                  width, height = image.size
                  image.verify()
              if (width, height) != (engine.W, engine.H):
                  raise SystemExit(
                      f"Scene image {index} is not the required {engine.W}x{engine.H} portrait frame: {width}x{height}"
                  )
              images.append({
                  "file": path.name,
                  "width": width,
                  "height": height,
                  "size_bytes": path.stat().st_size,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
              })
          storyboard = package / "storyboard-preview.png"
          shutil.copy2(storyboard, output / "fresh-storyboard-preview.png")
          manifest = {
              "status": "fresh_images_generated_prompt_verified_visual_review_required",
              "run_id": run_id,
              "source_prepared_run_id": os.environ["SOURCE_RUN_ID"],
              "branch": os.environ.get("GITHUB_REF_NAME", "v3-motion-prototype"),
              "title": plan.get("title"),
              "image_model": engine.IMAGE_MODEL,
              "fresh_ai_image_generation": True,
              "fresh_ai_images_generated": 2,
              "fresh_visual_assets_generated": 3,
              "scene_render_modes": metadata.get("visual_modes", []),
              "portrait_dimensions": metadata.get("portrait_dimensions"),
              "prompt_validation": "fallback_brief_validated_offline_only",
              "macro_prompt_sent_to_model": False,
              "macro_prompt_contract": "procedural_violin_contact_illustration_selected_by_design",
              "macro_brief_char_count": prompt_char_count,
              "prompt_character_limit": engine.MAX_IMAGE_PROMPT_CHARS,
              "visual_content_review": "pending_human_review",
              "visual_review_checklist": [
                  "The pale horsehair ribbon itself visibly contacts one string; the bow stick is a separate connected part.",
                  "The bridge and fingerboard are distinct, and four separate strings run in parallel.",
                  "The contact point is clear, physically plausible and between bridge and fingerboard.",
                  "Only one bow is visible; no detached rod, screw or floating object is mistaken for the bow.",
                  "The palette remains warm walnut, charcoal, oxblood, copper and antique gold.",
              ],
              "scene_images": images,
              "scene_2_macro_brief": macro_brief,
              "publishing_enabled": False,
              "production_renderer_changed": False,
          }
          (output / "fresh-visual-test-manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps({
              "status": manifest["status"],
              "run_id": run_id,
              "generated_scene_images": len(images),
              "macro_prompt_checks": "fallback_brief_validated_offline_only",
              "scene_2_render_mode": "deterministic_precision_macro_illustration",
              "visual_content_review": "pending_human_review",
              "publishing_enabled": False,
          }, indent=2))
          PY

      - name: Render V2 baseline and isolated V3 HTML prototype
        run: |
          python autopilot/engine/motion_prototype.py \
            --package work/package \
            --output work/output/motion-prototype \
            --fps 25

      - name: Upload side-by-side review package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-motion-prototype-${{ github.run_id }}
          path: |
            work/output/motion-prototype/
            work/package/scene-1.jpg
            work/package/scene-2.jpg
            work/package/scene-3.jpg
            work/package/storyboard-preview.png
            work/package/creative_plan.json
            work/package/stage.json
          if-no-files-found: ignore
          retention-days: 14
