name: Violin Prince Autopilot

on:
  # GitHub scheduled workflows use UTC; 00:30 UTC is 06:00 in India.
  schedule:
    - cron: "30 0 * * *"
  push:
    branches:
      - main
      - prototype/motion-hyperframes-2026-11-15
    paths:
      - ".autopilot/prepare-request.json"
  workflow_dispatch:
    inputs:
      stage:
        description: "Run the complete Prepare → Visuals → Render pipeline, or choose one stage for recovery."
        required: true
        type: choice
        default: full
        options:
          - full
          - prepare
          - visuals
          - render
      renderer:
        description: "Main renderer is Motion + HyperFrames. Choose Blender only for an optional 3D render."
        required: true
        type: choice
        default: motion_hyperframes
        options:
          - motion_hyperframes
          - blender
      source_run_id:
        description: "Optional for Prepare/Full research recovery; required for Visuals/Render to identify the previous stage run."
        required: false
        type: string
      visual_feedback:
        description: "Optional visual changes; used only when stage is Visuals."
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: violin-prince-autopilot-staged
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUN_ID: ${{ github.run_id }}
      RUN_MODE: ${{ github.event_name == 'schedule' && 'daily_scheduled' || github.event_name == 'push' && 'triggered' || 'manual' }}
      PIPELINE_STAGE: ${{ inputs.stage || 'full' }}
      VISUAL_FEEDBACK: ${{ inputs.visual_feedback }}
      AUTOPILOT_API_URL: ${{ secrets.AUTOPILOT_API_URL }}
      AUTOPILOT_JOB_TOKEN: ${{ secrets.AUTOPILOT_JOB_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
      SKETCHFAB_ACCESS_TOKEN: ${{ secrets.SKETCHFAB_ACCESS_TOKEN }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_STATE_ENCRYPTION_KEY: ${{ secrets.YOUTUBE_STATE_ENCRYPTION_KEY }}
      SEO_LEARNING_REPORT_PATH: work/seo-learning-data/seo-learning/latest.enc.json
      PUBLISH_ENABLED: "false"
      BLENDER_RENDER_ENABLED: ${{ (inputs.renderer || 'motion_hyperframes') == 'blender' && 'true' || 'false' }}
      MOTION_HYPERFRAMES_RENDER_ENABLED: ${{ (inputs.renderer || 'motion_hyperframes') == 'motion_hyperframes' && 'true' || 'false' }}
      BLENDER_RENDER_WORKERS: "3"
      BLENDER_THREADS_PER_WORKER: "1"
      BLENDER_RENDER_WIDTH: "400"
      BLENDER_RENDER_HEIGHT: "712"
      BLENDER_RENDER_FPS: "16"
      BLENDER_RENDER_SAMPLES: "4"
      BLENDER_MODEL_FACE_LIMIT: "60000"
      BLENDER_RENDER_TIMEOUT_SECONDS: "900"
      BLENDER_RENDER_DIAGNOSTICS: "1"
      BLENDER_RENDER_PREFLIGHT_ENABLED: "true"
      BLENDER_RENDER_PREFLIGHT_RESERVE_SECONDS: "30"
      EGL_PLATFORM: surfaceless
      LIBGL_ALWAYS_SOFTWARE: "1"
      MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
    steps:
      - name: Validate stage inputs
        if: github.event_name != 'push'
        shell: bash
        env:
          SELECTED_STAGE: ${{ inputs.stage || 'full' }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          AUTOPILOT_API_URL: ${{ secrets.AUTOPILOT_API_URL }}
          AUTOPILOT_JOB_TOKEN: ${{ secrets.AUTOPILOT_JOB_TOKEN }}
        run: |
          if [[ -n "$AUTOPILOT_API_URL" && -z "$AUTOPILOT_JOB_TOKEN" ]]; then
            echo "::error::AUTOPILOT_API_URL is set but AUTOPILOT_JOB_TOKEN is missing."
            exit 1
          fi
          if [[ -n "$AUTOPILOT_API_URL" && ! "$AUTOPILOT_API_URL" =~ ^https:// ]]; then
            echo "::error::AUTOPILOT_API_URL must use HTTPS."
            exit 1
          fi
          if [[ "$SELECTED_STAGE" != "full" && "$SELECTED_STAGE" != "prepare" && "$SELECTED_STAGE" != "visuals" && "$SELECTED_STAGE" != "render" ]]; then
            echo "::error::Unknown production stage."
            exit 1
          fi
          if [[ -n "$SOURCE_RUN_ID" && ! "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::source_run_id must contain only the numeric GitHub Actions run ID."
            exit 1
          fi
          if [[ "$SELECTED_STAGE" == "visuals" || "$SELECTED_STAGE" == "render" ]]; then
            if [[ -z "$SOURCE_RUN_ID" ]]; then
              echo "::error::Enter the earlier workflow Run ID in source_run_id."
              exit 1
            fi
          fi

      - name: Verify existing private creator recording before expensive production
        if: env.MOTION_HYPERFRAMES_RENDER_ENABLED == 'true' && (env.PIPELINE_STAGE == 'render' || env.PIPELINE_STAGE == 'full')
        shell: bash
        env:
          AUTOPILOT_API_URL: ${{ secrets.AUTOPILOT_API_URL }}
          AUTOPILOT_JOB_TOKEN: ${{ secrets.AUTOPILOT_JOB_TOKEN }}
        run: |
          set -Eeuo pipefail
          if [[ -z "$AUTOPILOT_API_URL" ]]; then
            echo "::error::AUTOPILOT_API_URL is missing. Configure the deployed Autopilot Worker URL before running the real-track Motion renderer."
            exit 1
          fi
          if [[ -z "$AUTOPILOT_JOB_TOKEN" ]]; then
            echo "::error::AUTOPILOT_JOB_TOKEN is missing. The private recording library cannot be read."
            exit 1
          fi
          if [[ ! "$AUTOPILOT_API_URL" =~ ^https:// ]]; then
            echo "::error::AUTOPILOT_API_URL must use HTTPS."
            exit 1
          fi
          assets_json="$(curl --fail --silent --show-error --max-time 30 \
            -H "Authorization: Bearer $AUTOPILOT_JOB_TOKEN" \
            "${AUTOPILOT_API_URL%/}/internal/assets?kind=audio")"
          printf '%s' "$assets_json" | python -c '
          import json, sys
          data = json.load(sys.stdin)
          assets = data.get("assets") or []
          if not assets:
              raise SystemExit("No rights-confirmed creator recording exists in the private Autopilot audio library.")
          asset = assets[0]
          name = str(asset.get("filename") or "")
          size = int(asset.get("size_bytes") or 0)
          if not name.lower().endswith((".wav", ".mp3", ".m4a", ".aac", ".flac", ".ogg")) or size < 4096:
              raise SystemExit("The newest private audio asset is not a supported, non-empty recording.")
          print("Private creator recording verified: " + name + " (" + str(size) + " bytes).")
          '
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Check image-generation credentials for the Motion production pipeline
        if: env.PIPELINE_STAGE != 'render' && env.MOTION_HYPERFRAMES_RENDER_ENABLED == 'true'
        shell: bash
        run: |
          missing=0
          for name in CF_ACCOUNT_ID CF_AI_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required repository secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Restore the latest encrypted SEO learning snapshot
        if: env.PIPELINE_STAGE == 'prepare'
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: seo-learning-data
          path: work/seo-learning-data
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: autopilot/engine/requirements.txt

      - name: Reuse research from an earlier failed run when requested
        if: (env.PIPELINE_STAGE == 'prepare' || env.PIPELINE_STAGE == 'full') && inputs.source_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: violin-prince-run-${{ inputs.source_run_id || steps.prepare_request.outputs.source_run_id }}
          path: work/reuse
          run-id: ${{ inputs.source_run_id || steps.prepare_request.outputs.source_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}


      - name: Cache Kokoro model weights
        if: env.PIPELINE_STAGE == 'prepare' || env.PIPELINE_STAGE == 'full'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-v1-cache

      - name: Cache CC0 violin sample zones
        if: env.PIPELINE_STAGE == 'prepare' || env.PIPELINE_STAGE == 'full'
        uses: actions/cache@v4
        with:
          path: ~/.cache/violin-prince/cc0-solo-violin-v1
          key: violin-prince-cc0-solo-violin-v1

      - name: Restore production package, including any completed scene images
        if: env.PIPELINE_STAGE == 'visuals' || env.PIPELINE_STAGE == 'render'
        uses: actions/download-artifact@v4
        with:
          # The diagnostic artifact retains the complete work/package directory.
          # This lets a later Visuals run resume images from a partial prior attempt.
          name: violin-prince-run-${{ inputs.source_run_id }}
          path: work
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}

      - name: Install preparation dependencies
        if: env.PIPELINE_STAGE == 'prepare' || env.PIPELINE_STAGE == 'full'
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r autopilot/engine/requirements.txt

      - name: Install visual generation dependencies
        if: env.PIPELINE_STAGE == 'visuals' || env.PIPELINE_STAGE == 'full'
        run: |
          python -m pip install --upgrade pip
          pip install "requests>=2.32,<3" "Pillow>=10.4,<12" "fonttools[woff]>=4.50,<5"

      - name: Install rendering dependencies
        if: env.PIPELINE_STAGE == 'render' || env.PIPELINE_STAGE == 'full'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install "requests>=2.32,<3" "Pillow>=10.4,<12"

      - name: Set up Node.js 22 for Motion + HyperFrames
        if: env.MOTION_HYPERFRAMES_RENDER_ENABLED == 'true' && (env.PIPELINE_STAGE == 'render' || env.PIPELINE_STAGE == 'full')
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned Motion + HyperFrames dependencies
        if: env.MOTION_HYPERFRAMES_RENDER_ENABLED == 'true' && (env.PIPELINE_STAGE == 'render' || env.PIPELINE_STAGE == 'full')
        working-directory: prototypes/hyperframes-motion
        run: npm install --no-audit --no-fund

      - name: Install pinned Blender 5.2.4 and Frame By Plane 8.0.1
        if: env.BLENDER_RENDER_ENABLED == 'true' && (env.PIPELINE_STAGE == 'render' || env.PIPELINE_STAGE == 'full')
        timeout-minutes: 30
        uses: ./.github/actions/setup-blender-frame-by-plane

      - name: Prepare research, story, narration and soundtrack
        if: env.PIPELINE_STAGE == 'prepare'
        run: python autopilot/engine/run.py --stage prepare

      - name: Upload prepared story package
        if: success() && (env.PIPELINE_STAGE == 'prepare')
        uses: actions/upload-artifact@v4
        with:
          name: prepared-package
          path: work/package/
          if-no-files-found: error
          retention-days: 14

      - name: Generate visual scenes and storyboard
        if: env.PIPELINE_STAGE == 'visuals'
        run: python autopilot/engine/run.py --stage visuals

      - name: Upload visual review package
        if: success() && (env.PIPELINE_STAGE == 'visuals')
        uses: actions/upload-artifact@v4
        with:
          name: visual-package
          path: work/package/
          if-no-files-found: error
          retention-days: 14

      - name: Render final MP4 from saved package (no AI calls)
        if: env.PIPELINE_STAGE == 'render'
        run: python autopilot/engine/run.py --stage render

      - name: Run full Prepare → Visuals → Motion + HyperFrames production
        if: env.PIPELINE_STAGE == 'full'
        run: python autopilot/engine/run.py --stage full

      - name: Upload finished video
        if: success() && (env.PIPELINE_STAGE == 'render' || env.PIPELINE_STAGE == 'full')
        uses: actions/upload-artifact@v4
        with:
          name: cloud-video-preview-${{ github.run_id }}
          path: |
            work/output/violin-prince-short.mp4
            work/output/violin-prince-full-track.mp4
          if-no-files-found: error
          retention-days: 14

      - name: Preserve stage diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: violin-prince-run-${{ github.run_id }}
          path: |
            work/package/
            work/output/
            work/story-assets/asset-resolution-diagnostic.json
            !work/output/scene-3.mp4
            !work/output/violin-prince-short.mp4
            !work/output/violin-prince-full-track.mp4
            work/research.json
            work/story_candidates.json
            work/story_research.json
            work/creative_plan.json
            work/creative_plan_debug.json
            work/analytics.json
            work/story-assets/asset-resolution-diagnostic.json
          if-no-files-found: ignore
          retention-days: 14
