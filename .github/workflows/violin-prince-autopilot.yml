name: Violin Prince Autopilot

on:
  push:
    branches:
      - main
    paths:
      - ".autopilot/prepare-request.json"
      - ".autopilot/daily-production-plan.json"
  schedule:
    # Four six-hour slots in India time. Minute 30 avoids GitHub's busy top-of-hour window.
    - cron: "30 5 * * *"
      timezone: "Asia/Kolkata"
    - cron: "30 11 * * *"
      timezone: "Asia/Kolkata"
    - cron: "30 17 * * *"
      timezone: "Asia/Kolkata"
    - cron: "30 23 * * *"
      timezone: "Asia/Kolkata"
  workflow_dispatch:
    inputs:
      stage:
        description: "Run one complete production pass. Approved scheduled slots publish publicly to YouTube."
        required: true
        type: choice
        default: full
        options:
          - full

permissions:
  contents: write
  actions: read

concurrency:
  # One active queue consumer prevents two six-hour triggers claiming the same story.
  group: violin-prince-public-youtube-queue
  cancel-in-progress: false

jobs:
  fast_preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install fast Python static checker
        run: python -m pip install --disable-pip-version-check "ruff>=0.14,<0.16"

      - name: Detect undefined and possibly unbound Python names
        run: ruff check --select F821,F822,F823 autopilot/engine

      - name: Run offline HyperFrames production-path smoke test
        env:
          PYTHONPATH: autopilot/engine
        run: python -m unittest discover -s autopilot/engine/tests -p "test_hyperframes_pipeline.py" -v

      - name: Run scheduled slot date and exact-batch regression tests
        env:
          PYTHONPATH: autopilot/engine
        run: |
          python -m unittest discover -s autopilot/engine/tests -p "test_scheduled_slot_date.py" -v
          python -m unittest discover -s autopilot/engine/tests -p "test_select_public_queue.py" -v

      - name: Verify public YouTube, private voice and Master Director credentials
        env:
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
          YOUTUBE_EXPECTED_CHANNEL_ID: ${{ vars.YOUTUBE_EXPECTED_CHANNEL_ID }}
          PRIVATE_VOICE_REPO_TOKEN: ${{ secrets.PRIVATE_VOICE_REPO_TOKEN }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          required = [
              "UPLOAD_POST_API_KEY",
              "YOUTUBE_EXPECTED_CHANNEL_ID",
              "PRIVATE_VOICE_REPO_TOKEN",
          ]
          if os.environ.get("GITHUB_EVENT_NAME") == "schedule":
              required.append("COPILOT_GITHUB_TOKEN")
          missing = [name for name in required if not os.environ.get(name, "").strip()]
          if missing:
              raise SystemExit("Required production configuration is missing: " + ", ".join(missing))
          print("Public YouTube, voice and scheduled Master Director credentials are configured.")
          PY

  daily_readiness:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.readiness.outputs.ready }}
      slot_id: ${{ steps.batch.outputs.slot_id }}
      production_date: ${{ steps.batch.outputs.production_date }}
      workspace_root: ${{ steps.batch.outputs.workspace_root }}
      batch_path: ${{ steps.batch.outputs.batch_path }}
      batch_sha256: ${{ steps.batch.outputs.batch_sha256 }}
      slot_status: ${{ steps.batch.outputs.slot_status }}
      blocked_reason: ${{ steps.batch.outputs.blocked_reason }}
      ready: ${{ steps.readiness.outputs.ready }}
    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve scheduled IST batch date from the triggering cron slot
        id: schedule_context
        env:
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: python autopilot/engine/scheduled_slot_date.py --cron "$SCHEDULE_CRON"

      - name: Select the next unused public-ready story from the scheduled date's batch
        id: batch
        env:
          PYTHONPATH: autopilot/engine
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
          SCHEDULED_PRODUCTION_DATE: ${{ steps.schedule_context.outputs.production_date }}
        run: python autopilot/engine/select_public_queue.py --root . --production-date "$SCHEDULED_PRODUCTION_DATE"

      - name: Check production and public-publishing gates for the selected batch
        id: readiness
        if: steps.batch.outputs.slot_status == 'ready'
        run: |
          python autopilot/engine/daily_readiness.py \
            --batch "${{ steps.batch.outputs.batch_path }}" \
            --today "${{ steps.batch.outputs.production_date }}"

  report_blocked_slot:
    needs: [daily_readiness]
    if: ${{ always() && github.event_name == 'schedule' && needs.daily_readiness.result == 'success' && needs.daily_readiness.outputs.slot_status == 'blocked' }}
    runs-on: ubuntu-latest
    steps:
      - name: Report safely skipped slot
        env:
          SLOT_ID: ${{ needs.daily_readiness.outputs.slot_id }}
          BLOCKED_REASON: ${{ needs.daily_readiness.outputs.blocked_reason }}
        run: |
          {
            echo "## Rolling public queue has no eligible video"
            echo ""
            echo "- Reason: $BLOCKED_REASON"
            echo "- The scheduler checked today's and all later prepared batches."
            echo "- No narration, MP4 render or YouTube upload was attempted."
          } >> "$GITHUB_STEP_SUMMARY"

  report_readiness_blocked:
    needs: [daily_readiness]
    if: ${{ always() && github.event_name == 'schedule' && needs.daily_readiness.result == 'success' && needs.daily_readiness.outputs.ready != 'true' && needs.daily_readiness.outputs.slot_status != 'blocked' }}
    runs-on: ubuntu-latest
    steps:
      - name: Report failed production preflight
        env:
          SLOT_ID: ${{ needs.daily_readiness.outputs.slot_id }}
          PRODUCTION_DATE: ${{ needs.daily_readiness.outputs.production_date }}
        run: |
          {
            echo "## Selected queue item blocked by production preflight"
            echo ""
            echo "- Batch date: `$PRODUCTION_DATE`"
            echo "- Slot: `$SLOT_ID`"
            echo "- A required voice, illustration or production approval gate did not pass."
            echo "- No video was rendered or uploaded."
          } >> "$GITHUB_STEP_SUMMARY"

  produce:
    needs: [daily_readiness, fast_preflight]
    if: ${{ always() && needs.fast_preflight.result == 'success' && (github.event_name != 'schedule' || (needs.daily_readiness.result == 'success' && needs.daily_readiness.outputs.ready == 'true' && needs.daily_readiness.outputs.slot_status == 'ready')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUN_ID: ${{ github.run_id }}
      RUN_MODE: ${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }}
      PIPELINE_STAGE: ${{ inputs.stage || 'full' }}
      SEO_LEARNING_REPORT_PATH: work/seo-learning-data/seo-learning/latest.enc.json
      VIOLIN_PRINCE_PRESENTER_ENABLED: "true"
    steps:
      - name: Validate stage inputs
        if: github.event_name != 'push'
        shell: bash
        env:
          SELECTED_STAGE: ${{ inputs.stage || 'full' }}
        run: |
          if [[ "$SELECTED_STAGE" != "full" ]]; then
            echo "::error::Only the complete production path is enabled. Intermediate partial-stage runs are paused until their package continuity and validation contract is complete."
            exit 1
          fi

      - name: Check out the project
        uses: actions/checkout@v4

      - name: Read ChatGPT daily production request
        id: daily_request
        if: github.event_name == 'push'
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          request_path = Path(".autopilot/prepare-request.json")
          if not request_path.is_file():
              raise SystemExit("The ChatGPT production trigger file is missing.")
          request = json.loads(request_path.read_text(encoding="utf-8"))
          if request.get("mode") != "chatgpt_daily_production":
              raise SystemExit("Push-triggered production must use mode=chatgpt_daily_production.")
          publish_to_youtube = request.get("publish_to_youtube", False)
          if not isinstance(publish_to_youtube, bool):
              raise SystemExit("publish_to_youtube must be an explicit boolean.")
          if publish_to_youtube:
              raise SystemExit(
                  "Direct public publishing from this one-off handoff route is disabled. "
                  "The approved scheduled four-slot route handles public YouTube uploads; set publish_to_youtube=false for this handoff."
              )
          from datetime import datetime
          from zoneinfo import ZoneInfo

          plan_path = str(request.get("plan_path") or ".autopilot/daily-production-plan.json")
          if not plan_path.startswith(".autopilot/") or ".." in Path(plan_path).parts:
              raise SystemExit("The daily plan must be inside the .autopilot directory.")
          plan_file = Path(plan_path)
          if not plan_file.is_file():
              raise SystemExit("The ChatGPT daily production plan does not exist.")
          plan_bytes = plan_file.read_bytes()
          plan = json.loads(plan_bytes.decode("utf-8"))
          narration_script = re.sub(r"\s+", " ", str(plan.get("narration_script") or "")).strip()
          if not narration_script:
              raise SystemExit("The daily production plan has no narration script.")
          slot_id = str(plan.get("slot_id") or "").strip()
          if slot_id not in {"music-secrets", "production-tech", "melody-stories", "real-performance"}:
              raise SystemExit("A canonical four-slot ID is required for the scheduled YouTube upload.")
          plan_sha256 = hashlib.sha256(plan_bytes).hexdigest()
          narration_sha256 = hashlib.sha256(narration_script.encode("utf-8")).hexdigest()
          today = datetime.now(ZoneInfo("Asia/Kolkata")).date().isoformat()
          if plan.get("production_date") != today:
              raise SystemExit(f"The daily plan must be refreshed for {today} Asia/Kolkata before production.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("plan_path=" + plan_path + "\n")
              output.write("slot_id=" + slot_id + "\n")
              output.write("plan_sha256=" + plan_sha256 + "\n")
              output.write("narration_sha256=" + narration_sha256 + "\n")
              output.write("publish_to_youtube=" + ("true" if publish_to_youtube else "false") + "\n")
          print("Validated ChatGPT daily production request: " + plan_path)
          print("Direct YouTube publish requested: " + str(publish_to_youtube))
          print("Production plan SHA-256: " + plan_sha256)
          print("Narration script SHA-256: " + narration_sha256)
          PY

      - name: Restore the latest encrypted SEO learning snapshot
        if: env.PIPELINE_STAGE == 'prepare'
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: seo-learning-data
          path: work/seo-learning-data
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: autopilot/engine/requirements.txt


      - name: Cache CC0 violin sample zones
        if: env.PIPELINE_STAGE == 'prepare' || env.PIPELINE_STAGE == 'full'
        uses: actions/cache@v4
        with:
          path: ~/.cache/violin-prince/cc0-solo-violin-v1
          key: violin-prince-cc0-solo-violin-v1

      - name: Install preparation dependencies
        if: (env.PIPELINE_STAGE == 'prepare' || env.PIPELINE_STAGE == 'full') && github.event_name != 'schedule'
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r autopilot/engine/requirements.txt

      - name: Install scheduled daily-plan dependencies
        if: github.event_name == 'schedule'
        run: |
          python -m pip install --upgrade pip
          pip install -r autopilot/engine/requirements.txt

      - name: Install visual generation dependencies
        if: env.PIPELINE_STAGE == 'visuals' || env.PIPELINE_STAGE == 'full'
        run: |
          python -m pip install --upgrade pip
          pip install "requests>=2.32,<3" "Pillow>=10.4,<12" "fonttools[woff]>=4.50,<5"

      - name: Install rendering dependencies
        if: env.PIPELINE_STAGE == 'render' || env.PIPELINE_STAGE == 'full'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install "requests>=2.32,<3" "Pillow>=10.4,<12"

      - name: Set up Node.js 22 for Motion + HyperFrames
        if: github.event_name == 'push' || github.event_name == 'schedule'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Motion + HyperFrames dependencies
        if: github.event_name == 'push' || github.event_name == 'schedule'
        working-directory: autopilot/engine/animation2d
        run: npm install --no-audit --no-fund

      - name: Install GitHub Copilot CLI for scheduled Master Director
        if: github.event_name == 'schedule'
        run: npm install --global @github/copilot

      - name: Prepare research, story, narration and soundtrack
        if: env.PIPELINE_STAGE == 'prepare'
        run: python autopilot/engine/run.py --stage prepare

      - name: Generate visual scenes and storyboard
        if: env.PIPELINE_STAGE == 'visuals'
        run: python autopilot/engine/run.py --stage visuals

      - name: Render final MP4 from saved package (no AI calls)
        if: env.PIPELINE_STAGE == 'render'
        run: python autopilot/engine/run.py --stage render

      - name: Run the selected ChatGPT-directed slot through Motion + HyperFrames
        if: env.PIPELINE_STAGE == 'full' && (steps.daily_request.outputs.plan_path != '' || github.event_name == 'schedule') && (github.event_name != 'schedule' || needs.daily_readiness.outputs.slot_status != 'blocked')
        env:
          RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          EXPECTED_PLAN_SHA256: ${{ steps.daily_request.outputs.plan_sha256 }}
          EXPECTED_NARRATION_SHA256: ${{ steps.daily_request.outputs.narration_sha256 }}
          EXPECTED_BATCH_SHA256: ${{ needs.daily_readiness.outputs.batch_sha256 }}
          SLOT_ID: ${{ needs.daily_readiness.outputs.slot_id }}
          SLOT_WORKSPACE_ROOT: ${{ needs.daily_readiness.outputs.workspace_root }}
          SLOT_BATCH_PATH: ${{ needs.daily_readiness.outputs.batch_path }}
          PRODUCTION_EVENT_SHA: ${{ github.sha }}
          PUBLISH_ENABLED: "false"
          PRIVATE_VOICE_REPO_TOKEN: ${{ secrets.PRIVATE_VOICE_REPO_TOKEN }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            python autopilot/engine/run_daily_plan.py \
              --batch "$SLOT_BATCH_PATH" \
              --slot-id "$SLOT_ID" \
              --workspace-root "$SLOT_WORKSPACE_ROOT"
          else
            python autopilot/engine/run_daily_plan.py --plan "${{ steps.daily_request.outputs.plan_path }}"
          fi

      - name: Retain creator-requested MP4 for YouTube upload handoff
        if: success() && github.event_name == 'push' && steps.daily_request.outputs.plan_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: violin-prince-private-preview-${{ github.run_number }}
          path: |
            work/output/violin-prince-short.mp4
            work/output/publish-manifest.json
            work/output/asset-provenance.json
            work/output/slot-receipt.json
          if-no-files-found: error
          retention-days: 3

      - name: Run complete Prepare → Visuals → Render sequence
        if: env.PIPELINE_STAGE == 'full' && steps.daily_request.outputs.plan_path == '' && github.event_name != 'schedule'
        env:
          PRIVATE_VOICE_REPO_TOKEN: ${{ secrets.PRIVATE_VOICE_REPO_TOKEN }}
        run: python autopilot/engine/run.py --stage full

      - name: Retain scheduled YouTube upload artifact for recovery
        if: success() && github.event_name == 'schedule' && env.PIPELINE_STAGE == 'full' && needs.daily_readiness.outputs.slot_status == 'ready'
        uses: actions/upload-artifact@v4
        with:
          name: violin-prince-youtube-upload-${{ github.run_number }}
          path: |
            ${{ format('{0}/output/violin-prince-short.mp4', needs.daily_readiness.outputs.workspace_root) }}
            ${{ format('{0}/output/publish-manifest.json', needs.daily_readiness.outputs.workspace_root) }}
            ${{ format('{0}/output/asset-provenance.json', needs.daily_readiness.outputs.workspace_root) }}
            ${{ format('{0}/output/slot-receipt.json', needs.daily_readiness.outputs.workspace_root) }}
            ${{ format('{0}/package/creative_plan.json', needs.daily_readiness.outputs.workspace_root) }}
            ${{ format('{0}/package/master-director/master-director-plan.json', needs.daily_readiness.outputs.workspace_root) }}
            ${{ format('{0}/output/master-director-render-report.json', needs.daily_readiness.outputs.workspace_root) }}
          if-no-files-found: error
          retention-days: 3

      - name: Publish approved daily slot PUBLICLY to YouTube via Upload-Post
        if: success() && github.event_name == 'schedule' && env.PIPELINE_STAGE == 'full' && needs.daily_readiness.outputs.slot_status == 'ready'
        env:
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
          UPLOAD_POST_USER: "default"
          YOUTUBE_EXPECTED_CHANNEL_ID: ${{ vars.YOUTUBE_EXPECTED_CHANNEL_ID }}
          YOUTUBE_PRIVACY_STATUS: "public"
          PUBLISH_ENABLED: "false"
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          OUTPUT_DIR: ${{ format('{0}/output', needs.daily_readiness.outputs.workspace_root) }}
          PLAN_PATH: ${{ format('{0}/package/creative_plan.json', needs.daily_readiness.outputs.workspace_root) }}
          SLOT_ID: ${{ needs.daily_readiness.outputs.slot_id }}
          PRODUCTION_DATE: ${{ needs.daily_readiness.outputs.production_date }}
        shell: bash
        run: |
          set -euo pipefail
          python autopilot/engine/upload_public_short_uploadpost.py \
            --output-dir "$OUTPUT_DIR" \
            --plan "$PLAN_PATH" \
            --run-id "$GITHUB_RUN_ID" \
            --slot-id "$SLOT_ID" \
            --production-date "$PRODUCTION_DATE"
