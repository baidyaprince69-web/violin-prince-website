name: Violin Prince Autopilot

on:
  # Daily local-time start: 00:30 UTC = 06:00 Asia/Kolkata.
  schedule:
    - cron: "30 0 * * *"
  push:
    branches:
      - main
      - prototype/motion-hyperframes-2026-11-15
    paths:
      - ".autopilot/prepare-request.json"
      - ".autopilot/manual-motion-production-request.json"
  workflow_dispatch:
    inputs:
      stage:
        description: "Run the complete Prepare → Visuals → Render pipeline, or choose one stage for recovery."
        required: true
        type: choice
        default: full
        options:
          - full
          - prepare
          - visuals
          - render
      source_run_id:
        description: "Optional for Prepare/Full research recovery; required for Visuals/Render to identify the previous stage run."
        required: false
        type: string
      visual_feedback:
        description: "Optional visual changes; used only when stage is Visuals."
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: violin-prince-autopilot-staged
  cancel-in-progress: true

jobs:
  produce:
    # A manual request committed on the prototype branch must not replay when
    # that request file is later merged into main.
    if: ${{ !(github.event_name == 'push' && github.ref_name == 'main' && (contains(toJSON(github.event.commits.*.added), '.autopilot/manual-motion-production-request.json') || contains(toJSON(github.event.commits.*.modified), '.autopilot/manual-motion-production-request.json'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUN_ID: ${{ github.run_id }}
      RUN_MODE: manual
      PIPELINE_STAGE: ${{ inputs.stage || 'full' }}
      VISUAL_FEEDBACK: ${{ inputs.visual_feedback }}
      AUTOPILOT_API_URL: ${{ secrets.AUTOPILOT_API_URL }}
      AUTOPILOT_JOB_TOKEN: ${{ secrets.AUTOPILOT_JOB_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_STATE_ENCRYPTION_KEY: ${{ secrets.YOUTUBE_STATE_ENCRYPTION_KEY }}
      SEO_LEARNING_REPORT_PATH: work/seo-learning-data/seo-learning/latest.enc.json
      SKETCHFAB_ACCESS_TOKEN: ${{ secrets.SKETCHFAB_ACCESS_TOKEN }}
      PUBLISH_ENABLED: "true"
      YOUTUBE_PUBLISH_ENABLED: "true"
      PUBLISH_DESTINATIONS: "youtube"
      YOUTUBE_PRIVACY_STATUS: "public"
      # The production renderer is Blender Eevee + official Frame By Plane.
      # Motion + HyperFrames remains a separate, opt-in 2D workflow.
      BLENDER_RENDER_ENABLED: "true"
      MOTION_HYPERFRAMES_RENDER_ENABLED: "false"
      BLENDER_RENDER_WIDTH: "540"
      BLENDER_RENDER_HEIGHT: "960"
      BLENDER_RENDER_FPS: "18"
      BLENDER_RENDER_WORKERS: "2"
      BLENDER_THREADS_PER_WORKER: "1"
      BLENDER_RENDER_SAMPLES: "4"
    steps:
      - name: Validate stage inputs
        if: github.event_name != 'push'
        shell: bash
        env:
          SELECTED_STAGE: ${{ inputs.stage || 'full' }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          AUTOPILOT_API_URL: ${{ secrets.AUTOPILOT_API_URL }}
          AUTOPILOT_JOB_TOKEN: ${{ secrets.AUTOPILOT_JOB_TOKEN }}
        run: |
          if [[ -n "$AUTOPILOT_API_URL" && -z "$AUTOPILOT_JOB_TOKEN" ]]; then
            echo "::error::AUTOPILOT_API_URL is set but AUTOPILOT_JOB_TOKEN is missing."
            exit 1
          fi
          if [[ -n "$AUTOPILOT_API_URL" && ! "$AUTOPILOT_API_URL" =~ ^https:// ]]; then
            echo "::error::AUTOPILOT_API_URL must use HTTPS."
            exit 1
          fi
          if [[ "$SELECTED_STAGE" != "full" && "$SELECTED_STAGE" != "prepare" && "$SELECTED_STAGE" != "visuals" && "$SELECTED_STAGE" != "render" ]]; then
            echo "::error::Unknown production stage."
            exit 1
          fi
          if [[ -n "$SOURCE_RUN_ID" && ! "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::source_run_id must contain only the numeric GitHub Actions run ID."
            exit 1
          fi
          if [[ "$SELECTED_STAGE" == "visuals" || "$SELECTED_STAGE" == "render" ]]; then
            if [[ -z "$SOURCE_RUN_ID" ]]; then
              echo "::error::Enter the earlier workflow Run ID in source_run_id."
              exit 1
            fi
          fi

      - name: Check out the project
        uses: actions/checkout@v4

      - name: Verify required Blender model and YouTube credentials
        if: env.PIPELINE_STAGE == 'full' && env.BLENDER_RENDER_ENABLED == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "$SKETCHFAB_ACCESS_TOKEN" ]] || {
            echo "::error::Add the licensed-model credential as the repository Actions secret SKETCHFAB_ACCESS_TOKEN."
            exit 1
          }
          for name in YOUTUBE_CLIENT_ID YOUTUBE_CLIENT_SECRET YOUTUBE_REFRESH_TOKEN; do
            [[ -n "${!name:-}" ]] || {
              echo "::error::Missing required YouTube secret: $name"
              exit 1
            }
          done
          [[ "$PUBLISH_ENABLED" == "true" && "$YOUTUBE_PUBLISH_ENABLED" == "true" ]] || {
            echo "::error::Release and YouTube publishing must both be explicitly enabled for this production build."
            exit 1
          }
          [[ "$YOUTUBE_PRIVACY_STATUS" == "public" ]] || {
            echo "::error::The authorized YouTube privacy state must match the saved public-upload metadata."
            exit 1
          }

      - name: Read ChatGPT daily production request
        id: daily_request
        if: github.event_name == 'schedule' || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[manual-motion-production]')) || (github.event_name == 'workflow_dispatch' && inputs.stage == 'full')
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          request_path = Path(".autopilot/prepare-request.json")
          if not request_path.is_file():
              raise SystemExit("The ChatGPT production trigger file is missing.")
          request = json.loads(request_path.read_text(encoding="utf-8"))
          if request.get("mode") != "chatgpt_daily_production":
              raise SystemExit("Push-triggered production must use mode=chatgpt_daily_production.")
          plan_path = str(request.get("plan_path") or ".autopilot/daily-production-plan.json")
          if not plan_path.startswith(".autopilot/") or ".." in Path(plan_path).parts:
              raise SystemExit("The daily plan must be inside the .autopilot directory.")
          if not Path(plan_path).is_file():
              raise SystemExit("The ChatGPT daily production plan does not exist.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("plan_path=" + plan_path + "\n")
          print("Validated ChatGPT daily production request: " + plan_path)
          PY

      - name: Validate manual narrated-explainer request
        id: manual_motion_request
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[manual-motion-production]')
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          request_path = Path(".autopilot/manual-motion-production-request.json")
          if not request_path.is_file():
              raise SystemExit("Manual narrated-explainer request is missing.")
          request = json.loads(request_path.read_text(encoding="utf-8"))
          if request.get("mode") != "manual_narrated_explainer":
              raise SystemExit("Manual request mode must be manual_narrated_explainer.")
          plan_path = str(request.get("plan_path") or ".autopilot/daily-production-plan.json")
          if not plan_path.startswith(".autopilot/") or ".." in Path(plan_path).parts:
              raise SystemExit("The explainer plan must remain inside the .autopilot directory.")
          if not Path(plan_path).is_file():
              raise SystemExit("The ChatGPT-authored research and explanation plan is missing.")
          duration = float(request.get("music_duration_seconds", 24))
          if not 1 <= duration <= 120:
              raise SystemExit("Optional violin background-bed source duration must be between 1 and 120 seconds.")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"MOTION_HYPERFRAMES_MUSIC_DURATION_SECONDS={duration:g}\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("plan_path=" + plan_path + "\n")
          print("Validated ChatGPT-authored explainer plan: " + plan_path)
          print("Selected evidence validation, Kokoro-82M af_heart narration and Motion + HyperFrames.")
          print("CC0 violin is an optional quiet background bed, not the primary audio.")
          print("Cloudflare and Blender are skipped; publishing remains disabled.")
          PY

      - name: Check legacy image-route credentials only when Motion is not selected
        if: github.event_name == 'workflow_dispatch' && env.PIPELINE_STAGE != 'render' && env.BLENDER_RENDER_ENABLED != 'true' && env.MOTION_HYPERFRAMES_RENDER_ENABLED != 'true'
        shell: bash
        run: |
          missing=0
          for name in CF_ACCOUNT_ID CF_AI_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required repository secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Install pinned Blender 5.2.4 and Frame By Plane 8.0.1
        id: setup_blender
        if: env.BLENDER_RENDER_ENABLED == 'true' && (env.PIPELINE_STAGE == 'full' || env.PIPELINE_STAGE == 'render')
        uses: ./.github/actions/setup-blender-frame-by-plane

      - name: Export the verified Blender executable path
        if: env.BLENDER_RENDER_ENABLED == 'true' && (env.PIPELINE_STAGE == 'full' || env.PIPELINE_STAGE == 'render')
        shell: bash
        run: echo "BLENDER_BIN=${{ steps.setup_blender.outputs.blender-path }}" >> "$GITHUB_ENV"

      - name: Restore the latest encrypted SEO learning snapshot
        if: env.PIPELINE_STAGE == 'prepare'
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: seo-learning-data
          path: work/seo-learning-data
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: autopilot/engine/requirements.txt

      - name: Reuse research from an earlier failed run when requested
        if: (env.PIPELINE_STAGE == 'prepare' || env.PIPELINE_STAGE == 'full') && (inputs.source_run_id != '' || steps.prepare_request.outputs.source_run_id != '')
        uses: actions/download-artifact@v4
        with:
          name: violin-prince-run-${{ inputs.source_run_id || steps.prepare_request.outputs.source_run_id }}
          path: work/reuse
          run-id: ${{ inputs.source_run_id || steps.prepare_request.outputs.source_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}


      - name: Cache Kokoro model weights
        if: env.PIPELINE_STAGE == 'prepare' || env.PIPELINE_STAGE == 'full'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-v1-cache

      - name: Cache CC0 violin sample zones
        if: env.PIPELINE_STAGE == 'prepare' || env.PIPELINE_STAGE == 'full'
        uses: actions/cache@v4
        with:
          path: ~/.cache/violin-prince/cc0-solo-violin-v1
          key: violin-prince-cc0-solo-violin-v1

      - name: Restore production package, including any completed scene images
        if: env.PIPELINE_STAGE == 'visuals' || env.PIPELINE_STAGE == 'render'
        uses: actions/download-artifact@v4
        with:
          # The diagnostic artifact retains the complete work/package directory.
          # This lets a later Visuals run resume images from a partial prior attempt.
          name: violin-prince-run-${{ inputs.source_run_id }}
          path: work
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}

      - name: Install preparation dependencies
        if: env.PIPELINE_STAGE == 'prepare' || env.PIPELINE_STAGE == 'full'
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r autopilot/engine/requirements.txt

      - name: Install visual generation dependencies
        if: env.PIPELINE_STAGE == 'visuals' || env.PIPELINE_STAGE == 'full'
        run: |
          python -m pip install --upgrade pip
          pip install "requests>=2.32,<3" "Pillow>=10.4,<12" "fonttools[woff]>=4.50,<5"

      - name: Install rendering dependencies
        if: env.PIPELINE_STAGE == 'render' || env.PIPELINE_STAGE == 'full'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install "requests>=2.32,<3" "Pillow>=10.4,<12"

      - name: Set up Node.js for Motion + HyperFrames
        if: env.MOTION_HYPERFRAMES_RENDER_ENABLED == 'true' && (env.PIPELINE_STAGE == 'render' || env.PIPELINE_STAGE == 'full')
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned Motion + HyperFrames dependencies
        if: env.MOTION_HYPERFRAMES_RENDER_ENABLED == 'true' && (env.PIPELINE_STAGE == 'render' || env.PIPELINE_STAGE == 'full')
        working-directory: prototypes/hyperframes-motion
        run: npm install --no-audit --no-fund

      - name: Prepare research, story, narration and soundtrack
        if: env.PIPELINE_STAGE == 'prepare'
        run: python autopilot/engine/run.py --stage prepare

      - name: Upload prepared story package
        if: success() && (env.PIPELINE_STAGE == 'prepare')
        uses: actions/upload-artifact@v4
        with:
          name: prepared-package
          path: work/package/
          if-no-files-found: error
          retention-days: 14

      - name: Generate visual scenes and storyboard
        if: env.PIPELINE_STAGE == 'visuals'
        run: python autopilot/engine/run.py --stage visuals

      - name: Upload visual review package
        if: success() && (env.PIPELINE_STAGE == 'visuals')
        uses: actions/upload-artifact@v4
        with:
          name: visual-package
          path: work/package/
          if-no-files-found: error
          retention-days: 14

      - name: Render final MP4 from saved package (no AI calls)
        if: env.PIPELINE_STAGE == 'render'
        run: python autopilot/engine/run.py --stage render

      - name: Run ChatGPT-prepared explainer with Blender Eevee + Frame By Plane
        if: env.PIPELINE_STAGE == 'full' && steps.manual_motion_request.outputs.plan_path != ''
        env:
          RUN_ID: ${{ github.run_id }}
          AUTOPILOT_API_URL: ""
          AUTOPILOT_JOB_TOKEN: ""
          PUBLISH_ENABLED: "false"
          BLENDER_RENDER_ENABLED: "true"
          MOTION_HYPERFRAMES_RENDER_ENABLED: "false"
        run: python autopilot/engine/run_daily_plan.py --plan "${{ steps.manual_motion_request.outputs.plan_path }}"

      - name: Run ChatGPT-prepared full 3D explainer with Blender Eevee + Frame By Plane
        if: env.PIPELINE_STAGE == 'full' && steps.daily_request.outputs.plan_path != ''
        env:
          RUN_ID: ${{ github.run_id }}
          AUTOPILOT_API_URL: ""
          AUTOPILOT_JOB_TOKEN: ""
          PUBLISH_ENABLED: "false"
          BLENDER_RENDER_ENABLED: "true"
          MOTION_HYPERFRAMES_RENDER_ENABLED: "false"
        run: python autopilot/engine/run_daily_plan.py --plan "${{ steps.daily_request.outputs.plan_path }}"

      - name: Run complete Prepare → Visuals → Render sequence
        if: env.PIPELINE_STAGE == 'full' && steps.daily_request.outputs.plan_path == '' && steps.manual_motion_request.outputs.plan_path == ''
        run: python autopilot/engine/run.py --stage full

      - name: Publish finished MP4 and publisher handoff as release assets
        id: publish_asset
        if: success() && env.PUBLISH_ENABLED == 'true' && env.PIPELINE_STAGE == 'full' && (steps.daily_request.outputs.plan_path != '' || steps.manual_motion_request.outputs.plan_path != '')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          ASSET_URL: https://github.com/${{ github.repository }}/releases/download/violin-prince-short-${{ github.run_id }}/violin-prince-short.mp4
          MANIFEST_URL: https://github.com/${{ github.repository }}/releases/download/violin-prince-short-${{ github.run_id }}/publish-manifest.json
          PROVENANCE_URL: https://github.com/${{ github.repository }}/releases/download/violin-prince-short-${{ github.run_id }}/asset-provenance.json
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          output = Path("work/output")
          video_path = output / "violin-prince-short.mp4"
          manifest_path = output / "publish-manifest.json"
          provenance_path = output / "asset-provenance.json"
          if not video_path.is_file() or video_path.stat().st_size < 4096:
              raise SystemExit("Final MP4 is missing or unexpectedly small; refusing a release.")
          if not manifest_path.is_file() or not provenance_path.is_file():
              raise SystemExit("Publisher handoff files are missing; refusing a release.")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          provenance = json.loads(provenance_path.read_text(encoding="utf-8"))
          preflight = manifest.get("publisher_preflight") or {}
          if manifest.get("status") != "rendered":
              raise SystemExit("Release blocked: manifest status is not rendered.")
          if manifest.get("publish_ready") is not True or preflight.get("status") != "ready":
              blockers = preflight.get("blockers") or []
              raise SystemExit("Release blocked by publisher preflight: " + json.dumps(blockers, ensure_ascii=False))
          if preflight.get("blockers"):
              raise SystemExit("Release blocked: publisher preflight contains unresolved blockers.")
          factual = provenance.get("factual_provenance") or {}
          if factual.get("status") != "passed" or int(factual.get("independent_publisher_count") or 0) < 2:
              raise SystemExit("Release blocked: factual provenance is incomplete.")
          assets = provenance.get("assets") or {}
          final_video_record = assets.get("final_video") or {}
          digest = hashlib.sha256(video_path.read_bytes()).hexdigest()
          if final_video_record.get("sha256") != digest:
              raise SystemExit("Release blocked: final MP4 SHA-256 does not match the provenance record.")
          if not 20 <= float(manifest.get("duration_seconds") or 0) <= 25:
              raise SystemExit("Release blocked: MP4 duration is outside the YouTube Shorts production contract.")
          plan = json.loads(Path("work/package/creative_plan.json").read_text(encoding="utf-8"))
          title = str(plan.get("title") or "Violin Prince")[:90]
          notes = [
              "Automatically rendered by the Violin Prince daily production engine.",
              "",
              "This release contains the finished vertical MP4 for the connected publishing workflow.",
              "",
              "Research sources:",
          ]
          for source in plan.get("sources", [])[:8]:
              if isinstance(source, dict) and source.get("url"):
                  notes.append("- " + str(source.get("title") or source.get("publisher_domain") or "Publisher") + ": " + str(source["url"]))
          (output / "release-notes.md").write_text("\n".join(notes) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write("release_title=" + title.replace("\n", " ") + "\n")
          PY
          TAG="violin-prince-short-${RELEASE_RUN_ID}"
          gh release create "$TAG" work/output/violin-prince-short.mp4 \
            --title "Violin Prince — Daily Short ${RELEASE_RUN_ID}" \
            --notes-file work/output/release-notes.md
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path("work/output")
          manifest_path = output / "publish-manifest.json"
          provenance_path = output / "asset-provenance.json"
          if not manifest_path.is_file() or not provenance_path.is_file():
              raise SystemExit("Publisher handoff files are missing; refusing to publish an incomplete release.")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["run_id"] = os.environ["RELEASE_RUN_ID"]
          manifest["public_video_url"] = os.environ["ASSET_URL"]
          manifest["publish_manifest_url"] = os.environ["MANIFEST_URL"]
          manifest["asset_provenance_url"] = os.environ["PROVENANCE_URL"]
          manifest["release_tag"] = "violin-prince-short-" + os.environ["RELEASE_RUN_ID"]
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding="utf-8")
          print("Publisher handoff ready: " + str(manifest.get("publisher_preflight", {}).get("status", "unknown")))
          print("Publish ready: " + str(bool(manifest.get("publish_ready"))))
          PY
          gh release upload "$TAG" work/output/publish-manifest.json work/output/asset-provenance.json --clobber

      - name: Publish final MP4 to YouTube
        id: youtube_publish
        if: success() && env.PIPELINE_STAGE == 'full' && env.PUBLISH_ENABLED == 'true' && env.YOUTUBE_PUBLISH_ENABLED == 'true' && (steps.daily_request.outputs.plan_path != '' || steps.manual_motion_request.outputs.plan_path != '') && steps.publish_asset.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          PYTHONPATH: autopilot/engine
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          from publisher import publish_all

          output = Path("work/output")
          video = output / "violin-prince-short.mp4"
          manifest_path = output / "publish-manifest.json"
          provenance_path = output / "asset-provenance.json"
          quality_path = output / "quality_report.json"
          plan_path = Path("work/package/creative_plan.json")
          required = (video, manifest_path, provenance_path, quality_path, plan_path)
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit("YouTube upload blocked; required final build files are missing: " + ", ".join(missing))
          if video.stat().st_size < 4096:
              raise SystemExit("YouTube upload blocked; final MP4 is unexpectedly small.")

          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          provenance = json.loads(provenance_path.read_text(encoding="utf-8"))
          quality = json.loads(quality_path.read_text(encoding="utf-8"))
          plan = json.loads(plan_path.read_text(encoding="utf-8"))
          metadata = plan.get("publish_metadata") or {}
          preflight = manifest.get("publisher_preflight") or {}
          if manifest.get("status") != "rendered" or manifest.get("publish_ready") is not True:
              raise SystemExit("YouTube upload blocked; publisher manifest is not ready.")
          if preflight.get("status") != "ready" or preflight.get("blockers"):
              raise SystemExit("YouTube upload blocked by publisher preflight: " + json.dumps(preflight.get("blockers") or []))
          if metadata.get("privacy_status") != "public" or os.environ.get("YOUTUBE_PRIVACY_STATUS") != "public":
              raise SystemExit("YouTube upload blocked; the validated metadata and authorized privacy state are not both public.")
          if not isinstance(metadata.get("made_for_kids"), bool):
              raise SystemExit("YouTube upload blocked; made_for_kids must be confirmed.")
          blender_report = quality.get("blender_rendering") or {}
          if blender_report.get("enabled") is not True or len(blender_report.get("scenes") or []) != 3:
              raise SystemExit("YouTube upload blocked; the final MP4 was not verified as a three-scene Blender render.")
          factual = provenance.get("factual_provenance") or {}
          if factual.get("status") != "passed" or int(factual.get("independent_publisher_count") or 0) < 2:
              raise SystemExit("YouTube upload blocked; two independent publisher sources are not verified.")
          final_video = (provenance.get("assets") or {}).get("final_video") or {}
          digest = hashlib.sha256(video.read_bytes()).hexdigest()
          if final_video.get("sha256") != digest:
              raise SystemExit("YouTube upload blocked; final MP4 SHA-256 does not match its provenance.")
          if not 20 <= float(manifest.get("duration_seconds") or 0) <= 25:
              raise SystemExit("YouTube upload blocked; final MP4 duration is outside the 20–25 second contract.")

          result = publish_all(video, "", plan)
          if result.get("all_succeeded") is not True or not result.get("results"):
              raise SystemExit("YouTube upload failed: " + json.dumps(result, ensure_ascii=False))
          youtube = next((item for item in result["results"] if item.get("platform") == "youtube" and item.get("ok")), None)
          if not youtube:
              raise SystemExit("YouTube did not confirm a video ID.")
          manifest["publisher"] = "GitHub Actions direct YouTube upload"
          manifest["publishing_enabled_in_github"] = True
          manifest["youtube_upload"] = {
              "status": "published",
              "video_id": youtube["id"],
              "url": youtube["url"],
              "privacy_status": "public",
              "uploaded_at_utc": __import__("datetime").datetime.now(__import__("datetime").timezone.utc).isoformat(),
          }
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding="utf-8")
          Path("work/output/youtube-publish-result.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## YouTube publication confirmed\n\n")
              summary.write("- URL: " + youtube["url"] + "\n")
              summary.write("- Privacy: public\n")
              summary.write("- Final Blender MP4 SHA-256: " + digest + "\n")
          print("YOUTUBE_PUBLISHED_URL=" + youtube["url"])
          PY
          TAG="violin-prince-short-${RELEASE_RUN_ID}"
          gh release upload "$TAG" work/output/publish-manifest.json --clobber

      - name: Upload final MP4, Blender storyboard and publisher results
        if: always() && (env.PIPELINE_STAGE == 'render' || env.PIPELINE_STAGE == 'full')
        uses: actions/upload-artifact@v4
        with:
          name: violin-prince-final-production-${{ github.run_id }}
          path: |
            work/output/violin-prince-short.mp4
            work/output/quality_report.json
            work/output/visual-contact-sheet.png
            work/output/blender-storyboard-review.png
            work/output/blender-scene-1-poster.png
            work/output/blender-scene-2-poster.png
            work/output/blender-scene-3-poster.png
            work/output/publish-manifest.json
            work/output/asset-provenance.json
            work/output/youtube-publish-result.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Preserve stage diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: violin-prince-run-${{ github.run_id }}
          path: |
            work/package/
            work/output/
            work/story-assets/asset-resolution-diagnostic.json
            !work/output/scene-3.mp4
            !work/output/violin-prince-short.mp4
            work/research.json
            work/story_candidates.json
            work/story_research.json
            work/creative_plan.json
            work/creative_plan_debug.json
            work/analytics.json
            work/story-assets/asset-resolution-diagnostic.json
          if-no-files-found: ignore
          retention-days: 14
