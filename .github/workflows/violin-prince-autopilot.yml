name: Violin Prince 2D Explainer

on:
  push:
    branches:
      - main
      - prototype/motion-hyperframes-2026-11-15
    paths:
      - ".autopilot/daily-production-plan.json"
      - ".github/workflows/violin-prince-autopilot.yml"
  workflow_dispatch:
    inputs:
      plan_path:
        description: "ChatGPT-authored plan JSON inside .autopilot/"
        required: false
        default: ".autopilot/daily-production-plan.json"
        type: string

permissions:
  contents: read

concurrency:
  group: violin-prince-2d-explainer
  cancel-in-progress: true

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      RUN_ID: ${{ github.run_id }}
      MOTION_HYPERFRAMES_RENDER_ENABLED: "true"
      MOTION_HYPERFRAMES_OUTRO_HOLD_SECONDS: "3.0"
      MOTION_HYPERFRAMES_MUSIC_BED_ENABLED: "true"
      MOTION_HYPERFRAMES_MAX_TRACK_SECONDS: "600"
      MOTION_HYPERFRAMES_COMMAND_TIMEOUT_SECONDS: "3600"
      PUBLISH_ENABLED: "false"
      YOUTUBE_PUBLISH_ENABLED: "false"
    steps:
      - name: Check out the production plan
        uses: actions/checkout@v4

      - name: Validate the plan path
        id: plan
        shell: bash
        env:
          REQUESTED_PLAN: ${{ inputs.plan_path || '.autopilot/daily-production-plan.json' }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          value = os.environ["REQUESTED_PLAN"].strip()
          path = Path(value)
          if not value.startswith(".autopilot/") or ".." in path.parts:
              raise SystemExit("The plan must be a file inside .autopilot/.")
          if not path.is_file():
              raise SystemExit("The ChatGPT-authored production plan does not exist: " + value)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("path=" + value + "\n")
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: autopilot/engine/requirements.txt

      - name: Cache Kokoro model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-violin-prince-v2

      - name: Install Python production dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r autopilot/engine/requirements.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned Motion and HyperFrames
        working-directory: prototypes/hyperframes-motion
        run: npm install --no-audit --no-fund

      - name: Render the ChatGPT plan with Kokoro and 2D Motion
        run: python autopilot/engine/run_daily_plan.py --plan "${{ steps.plan.outputs.path }}"

      - name: Upload the rendered explainer and review files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: violin-prince-2d-explainer-${{ github.run_id }}
          path: |
            work/output/
            work/package/
          if-no-files-found: ignore
          retention-days: 14
