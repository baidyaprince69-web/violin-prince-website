name: Violin Prince Autopilot

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Optional run identifier supplied by Cloudflare Cron
        required: false
        type: string
      mode:
        description: scheduled or manual test
        required: false
        default: manual
        type: string

permissions:
  contents: read

concurrency:
  group: violin-prince-autopilot-production
  cancel-in-progress: false

jobs:
  produce:
    # This repository is public. Standard GitHub-hosted runners are free for public repositories.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUN_ID: ${{ inputs.run_id || github.run_id }}
      RUN_MODE: ${{ inputs.mode || 'scheduled' }}
      AUTOPILOT_API_URL: ${{ secrets.AUTOPILOT_API_URL }}
      AUTOPILOT_JOB_TOKEN: ${{ secrets.AUTOPILOT_JOB_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
      PUBLISH_ENABLED: ${{ inputs.mode == 'manual' && 'false' || vars.PUBLISH_ENABLED || 'false' }}
      PUBLISH_DESTINATIONS: ${{ vars.PUBLISH_DESTINATIONS || 'youtube,instagram,facebook' }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_PRIVACY_STATUS: ${{ vars.YOUTUBE_PRIVACY_STATUS || 'private' }}
      YOUTUBE_PUBLISH_AT: ${{ vars.YOUTUBE_PUBLISH_AT }}
      META_API_VERSION: ${{ vars.META_API_VERSION }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
    steps:
      - name: Check required cloud secrets
        shell: bash
        run: |
          missing=0
          for name in AUTOPILOT_API_URL AUTOPILOT_JOB_TOKEN CF_ACCOUNT_ID CF_AI_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required repository secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Check out the project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: autopilot/engine/requirements.txt

      - name: Cache Kokoro model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-v1-cache

      - name: Install rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core espeak-ng
          python -m pip install --upgrade pip
          # CPU-only PyTorch keeps inference on the hosted runner without GPU billing.
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r autopilot/engine/requirements.txt

      - name: Run research, creative planning and cloud video assembly
        run: python autopilot/engine/run.py

      - name: Upload finished cloud video for viewing
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-video-preview-${{ inputs.run_id || github.run_id }}
          path: work/output/violin-prince-short.mp4
          if-no-files-found: error
          retention-days: 14

      - name: Preserve diagnostic metadata on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: violin-prince-run-${{ inputs.run_id || github.run_id }}
          path: |
            work/output/
            work/research.json
            work/creative_plan.json
            work/analytics.json
          if-no-files-found: ignore
          retention-days: 14
