name: Violin Prince Autopilot

on:
  push:
    branches:
      - main
    paths:
      - ".autopilot/prepare-request.json"
      - ".autopilot/daily-production-plan.json"
  schedule:
    # 15:00 Asia/Kolkata (09:30 UTC), leaving time for rendering before the 19:00 queue slot.
    - cron: "30 9 * * *"
  workflow_dispatch:
    inputs:
      stage:
        description: "Run one complete preview-only production pass. Staged package handoffs are paused while narration remains private."
        required: true
        type: choice
        default: full
        options:
          - full

permissions:
  contents: write
  actions: read

concurrency:
  group: violin-prince-autopilot-premium-v2
  cancel-in-progress: true

jobs:
  fast_preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install fast Python static checker
        run: python -m pip install --disable-pip-version-check "ruff>=0.14,<0.16"

      - name: Detect undefined and possibly unbound Python names
        run: ruff check --select F821,F822,F823 autopilot/engine

      - name: Run offline HyperFrames production-path smoke test
        env:
          PYTHONPATH: autopilot/engine
        run: python -m unittest discover -s autopilot/engine/tests -p "test_hyperframes_pipeline.py" -v

      # Test the exact private-repository operation required for preview transfer
      # before Qwen3 or the full renderer consumes time.
      - name: Verify private Voice Vault draft-release write access
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_VOICE_REPO_TOKEN }}
          PRIVATE_REPO: baidyaprince69-web/violin-prince-private-voice
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::PRIVATE_VOICE_REPO_TOKEN is missing; private preview transfer cannot proceed."
            exit 1
          fi
          release_tag="private-handoff-preflight-$GITHUB_RUN_ID"
          created=false
          cleanup() {
            if [[ "$created" == "true" ]]; then
              gh release delete "$release_tag" --repo "$PRIVATE_REPO" --yes >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT
          gh release create "$release_tag" \
            --repo "$PRIVATE_REPO" \
            --draft \
            --title "Temporary private handoff permission check $GITHUB_RUN_ID" \
            --notes "Temporary permission check; automatically deleted immediately." \
            --target main
          created=true
          gh release delete "$release_tag" --repo "$PRIVATE_REPO" --yes
          created=false
          trap - EXIT
          echo "Private Voice Vault release-write permission verified; temporary draft release removed."

  daily_readiness:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.readiness.outputs.ready }}
    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check today's production and publishing gates
        id: readiness
        env:
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
        run: python autopilot/engine/daily_readiness.py

  produce:
    needs: [daily_readiness, fast_preflight]
    if: ${{ always() && needs.fast_preflight.result == 'success' && (github.event_name != 'schedule' || (needs.daily_readiness.result == 'success' && needs.daily_readiness.outputs.ready == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUN_ID: ${{ github.run_id }}
      RUN_MODE: ${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }}
      PIPELINE_STAGE: ${{ inputs.stage || 'full' }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_STATE_ENCRYPTION_KEY: ${{ secrets.YOUTUBE_STATE_ENCRYPTION_KEY }}
      SEO_LEARNING_REPORT_PATH: work/seo-learning-data/seo-learning/latest.enc.json
      # Publishing is intentionally disabled during the production-integration and test cycle.
      PUBLISH_ENABLED: "false"
      VIOLIN_PRINCE_PRESENTER_ENABLED: "true"
    steps:
      - name: Validate stage inputs
        if: github.event_name != 'push'
        shell: bash
        env:
          SELECTED_STAGE: ${{ inputs.stage || 'full' }}
        run: |
          if [[ "$SELECTED_STAGE" != "full" ]]; then
            echo "::error::Only the complete preview-only run is enabled. Staged package artifacts are disabled until a private stage handoff is implemented."
            exit 1
          fi

      - name: Check out the project
        uses: actions/checkout@v4

      - name: Read ChatGPT daily production request
        id: daily_request
        if: github.event_name == 'push' || github.event_name == 'schedule'
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          request_path = Path(".autopilot/prepare-request.json")
          if not request_path.is_file():
              raise SystemExit("The ChatGPT production trigger file is missing.")
          request = json.loads(request_path.read_text(encoding="utf-8"))
          if request.get("mode") != "chatgpt_daily_production":
              raise SystemExit("Push-triggered production must use mode=chatgpt_daily_production.")
          from datetime import datetime
          from zoneinfo import ZoneInfo

          plan_path = str(request.get("plan_path") or ".autopilot/daily-production-plan.json")
          if not plan_path.startswith(".autopilot/") or ".." in Path(plan_path).parts:
              raise SystemExit("The daily plan must be inside the .autopilot directory.")
          plan_file = Path(plan_path)
          if not plan_file.is_file():
              raise SystemExit("The ChatGPT daily production plan does not exist.")
          plan_bytes = plan_file.read_bytes()
          plan = json.loads(plan_bytes.decode("utf-8"))
          narration_script = re.sub(r"\s+", " ", str(plan.get("narration_script") or "")).strip()
          if not narration_script:
              raise SystemExit("The daily production plan has no narration script.")
          plan_sha256 = hashlib.sha256(plan_bytes).hexdigest()
          narration_sha256 = hashlib.sha256(narration_script.encode("utf-8")).hexdigest()
          today = datetime.now(ZoneInfo("Asia/Kolkata")).date().isoformat()
          if plan.get("production_date") != today:
              raise SystemExit(f"The daily plan must be refreshed for {today} Asia/Kolkata before production.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("plan_path=" + plan_path + "\n")
              output.write("plan_sha256=" + plan_sha256 + "\n")
              output.write("narration_sha256=" + narration_sha256 + "\n")
          print("Validated ChatGPT daily production request: " + plan_path)
          print("Production plan SHA-256: " + plan_sha256)
          print("Narration script SHA-256: " + narration_sha256)
          PY

      - name: Restore the latest encrypted SEO learning snapshot
        if: env.PIPELINE_STAGE == 'prepare'
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: seo-learning-data
          path: work/seo-learning-data
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: autopilot/engine/requirements.txt


      - name: Cache CC0 violin sample zones
        if: env.PIPELINE_STAGE == 'prepare' || env.PIPELINE_STAGE == 'full'
        uses: actions/cache@v4
        with:
          path: ~/.cache/violin-prince/cc0-solo-violin-v1
          key: violin-prince-cc0-solo-violin-v1

      - name: Install preparation dependencies
        if: (env.PIPELINE_STAGE == 'prepare' || env.PIPELINE_STAGE == 'full') && github.event_name != 'schedule'
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r autopilot/engine/requirements.txt

      - name: Install scheduled daily-plan dependencies
        if: github.event_name == 'schedule' && steps.daily_request.outputs.plan_path != ''
        run: |
          python -m pip install --upgrade pip
          pip install -r autopilot/engine/requirements.txt

      - name: Install visual generation dependencies
        if: env.PIPELINE_STAGE == 'visuals' || env.PIPELINE_STAGE == 'full'
        run: |
          python -m pip install --upgrade pip
          pip install "requests>=2.32,<3" "Pillow>=10.4,<12" "fonttools[woff]>=4.50,<5"

      - name: Install rendering dependencies
        if: env.PIPELINE_STAGE == 'render' || env.PIPELINE_STAGE == 'full'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install "requests>=2.32,<3" "Pillow>=10.4,<12"

      - name: Set up Node.js 22 for Motion + HyperFrames
        if: github.event_name == 'push' || github.event_name == 'schedule'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Motion + HyperFrames dependencies
        if: github.event_name == 'push' || github.event_name == 'schedule'
        working-directory: autopilot/engine/animation2d
        run: npm install --no-audit --no-fund

      - name: Prepare research, story, narration and soundtrack
        if: env.PIPELINE_STAGE == 'prepare'
        run: python autopilot/engine/run.py --stage prepare

      - name: Generate visual scenes and storyboard
        if: env.PIPELINE_STAGE == 'visuals'
        run: python autopilot/engine/run.py --stage visuals

      - name: Render final MP4 from saved package (no AI calls)
        if: env.PIPELINE_STAGE == 'render'
        run: python autopilot/engine/run.py --stage render

      - name: Run ChatGPT-prepared daily plan through Motion + HyperFrames 2D production
        if: env.PIPELINE_STAGE == 'full' && steps.daily_request.outputs.plan_path != ''
        env:
          RUN_ID: ${{ github.run_id }}
          EXPECTED_PLAN_SHA256: ${{ steps.daily_request.outputs.plan_sha256 }}
          EXPECTED_NARRATION_SHA256: ${{ steps.daily_request.outputs.narration_sha256 }}
          PRODUCTION_EVENT_SHA: ${{ github.sha }}
          PUBLISH_ENABLED: "false"
          PRIVATE_VOICE_REPO_TOKEN: ${{ secrets.PRIVATE_VOICE_REPO_TOKEN }}
        run: python autopilot/engine/run_daily_plan.py --plan "${{ steps.daily_request.outputs.plan_path }}"

      - name: Run complete Prepare → Visuals → Render sequence
        if: env.PIPELINE_STAGE == 'full' && steps.daily_request.outputs.plan_path == ''
        env:
          PRIVATE_VOICE_REPO_TOKEN: ${{ secrets.PRIVATE_VOICE_REPO_TOKEN }}
        run: python autopilot/engine/run.py --stage full

      - name: Publish finished MP4 and publisher handoff as release assets
        id: publish_asset
        if: success() && env.PUBLISH_ENABLED == 'true' && env.PIPELINE_STAGE == 'full' && steps.daily_request.outputs.plan_path != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          ASSET_URL: https://github.com/${{ github.repository }}/releases/download/violin-prince-short-${{ github.run_id }}/violin-prince-short.mp4
          MANIFEST_URL: https://github.com/${{ github.repository }}/releases/download/violin-prince-short-${{ github.run_id }}/publish-manifest.json
          PROVENANCE_URL: https://github.com/${{ github.repository }}/releases/download/violin-prince-short-${{ github.run_id }}/asset-provenance.json
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          output = Path("work/output")
          video_path = output / "violin-prince-short.mp4"
          manifest_path = output / "publish-manifest.json"
          provenance_path = output / "asset-provenance.json"
          if not video_path.is_file() or video_path.stat().st_size < 4096:
              raise SystemExit("Final MP4 is missing or unexpectedly small; refusing a release.")
          if not manifest_path.is_file() or not provenance_path.is_file():
              raise SystemExit("Publisher handoff files are missing; refusing a release.")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          provenance = json.loads(provenance_path.read_text(encoding="utf-8"))
          preflight = manifest.get("publisher_preflight") or {}
          if manifest.get("status") != "rendered":
              raise SystemExit("Release blocked: manifest status is not rendered.")
          if manifest.get("publish_ready") is not True or preflight.get("status") != "ready":
              blockers = preflight.get("blockers") or []
              raise SystemExit("Release blocked by publisher preflight: " + json.dumps(blockers, ensure_ascii=False))
          if preflight.get("blockers"):
              raise SystemExit("Release blocked: publisher preflight contains unresolved blockers.")
          factual = provenance.get("factual_provenance") or {}
          if factual.get("status") != "passed" or int(factual.get("independent_publisher_count") or 0) < 2:
              raise SystemExit("Release blocked: factual provenance is incomplete.")
          assets = provenance.get("assets") or {}
          final_video_record = assets.get("final_video") or {}
          digest = hashlib.sha256(video_path.read_bytes()).hexdigest()
          if final_video_record.get("sha256") != digest:
              raise SystemExit("Release blocked: final MP4 SHA-256 does not match the provenance record.")
          if not 20 <= float(manifest.get("duration_seconds") or 0) <= 25:
              raise SystemExit("Release blocked: MP4 duration is outside the YouTube Shorts production contract.")
          plan = json.loads(Path("work/package/creative_plan.json").read_text(encoding="utf-8"))
          title = str(plan.get("title") or "Violin Prince")[:90]
          notes = [
              "Automatically rendered by the Violin Prince daily production engine.",
              "",
              "This release contains the finished vertical MP4 for the connected publishing workflow.",
              "",
              "Research sources:",
          ]
          for source in plan.get("sources", [])[:8]:
              if isinstance(source, dict) and source.get("url"):
                  notes.append("- " + str(source.get("title") or source.get("publisher_domain") or "Publisher") + ": " + str(source["url"]))
          (output / "release-notes.md").write_text("\n".join(notes) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write("release_title=" + title.replace("\n", " ") + "\n")
          PY
          TAG="violin-prince-short-${RELEASE_RUN_ID}"
          gh release create "$TAG" work/output/violin-prince-short.mp4 \
            --title "Violin Prince — Daily Short ${RELEASE_RUN_ID}" \
            --notes-file work/output/release-notes.md
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path("work/output")
          manifest_path = output / "publish-manifest.json"
          provenance_path = output / "asset-provenance.json"
          if not manifest_path.is_file() or not provenance_path.is_file():
              raise SystemExit("Publisher handoff files are missing; refusing to publish an incomplete release.")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["run_id"] = os.environ["RELEASE_RUN_ID"]
          manifest["public_video_url"] = os.environ["ASSET_URL"]
          manifest["publish_manifest_url"] = os.environ["MANIFEST_URL"]
          manifest["asset_provenance_url"] = os.environ["PROVENANCE_URL"]
          manifest["release_tag"] = "violin-prince-short-" + os.environ["RELEASE_RUN_ID"]
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding="utf-8")
          print("Publisher handoff ready: " + str(manifest.get("publisher_preflight", {}).get("status", "unknown")))
          print("Publish ready: " + str(bool(manifest.get("publish_ready"))))
          PY
          gh release upload "$TAG" work/output/publish-manifest.json work/output/asset-provenance.json --clobber

      - name: Queue validated Short in the Upload-Post publishing queue
        id: upload_post
        if: success() && steps.publish_asset.outcome == 'success' && env.PIPELINE_STAGE == 'full' && steps.daily_request.outputs.plan_path != ''
        env:
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
          UPLOAD_POST_PROFILE: default
        run: |
          python autopilot/engine/upload_post_handoff.py \
            --plan "${{ steps.daily_request.outputs.plan_path }}"

      - name: Transfer finished preview to the private Voice Vault
        id: private_preview
        if: success() && env.PIPELINE_STAGE == 'full'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_VOICE_REPO_TOKEN }}
          PRIVATE_REPO: baidyaprince69-web/violin-prince-private-voice
          SOURCE_RUN_ID: ${{ github.run_id }}
          VIDEO_PATH: work/output/violin-prince-short.mp4
        shell: bash
        run: |
          set -euo pipefail
          video="$VIDEO_PATH"
          if [[ ! -s "$video" ]]; then
            echo "::error::The finished MP4 is missing or empty; private handoff cancelled."
            exit 1
          fi

          size_bytes="$(stat -c '%s' "$video")"
          if [[ ! "$size_bytes" =~ ^[0-9]+$ ]] || (( size_bytes < 4096 || size_bytes > 100 * 1024 * 1024 )); then
            echo "::error::The preview MP4 size is outside the private transfer limit."
            exit 1
          fi
          sha256="$(sha256sum "$video" | awk '{print $1}')"
          release_tag="private-preview-video-$SOURCE_RUN_ID"
          transfer_branch="private-preview-$SOURCE_RUN_ID"
          temporary_dir="$(mktemp -d)"
          cleanup_on_failure() {
            status="$?"
            if (( status != 0 )); then
              gh release delete "$release_tag" --repo "$PRIVATE_REPO" --yes || true
              if [[ -d "$temporary_dir/private-repo/.git" ]]; then
                git -C "$temporary_dir/private-repo" push origin --delete "$transfer_branch" || true
              fi
            fi
            rm -rf "$temporary_dir"
            exit "$status"
          }
          trap cleanup_on_failure EXIT

          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::PRIVATE_VOICE_REPO_TOKEN is not configured."
            exit 1
          fi
          gh auth setup-git
          gh release create "$release_tag" "$video" \
            --repo "$PRIVATE_REPO" \
            --draft \
            --title "Private Violin Prince preview run $SOURCE_RUN_ID" \
            --notes "Temporary private preview transfer. Automatically removed after a verified private one-day artifact is saved." \
            --target main

          git clone --depth 1 --branch main "https://github.com/$PRIVATE_REPO.git" "$temporary_dir/private-repo"
          git -C "$temporary_dir/private-repo" config user.name "github-actions[bot]"
          git -C "$temporary_dir/private-repo" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$temporary_dir/private-repo" switch --create "$transfer_branch"
          mkdir -p "$temporary_dir/private-repo/.private-preview"
          python - "$temporary_dir/private-repo/.private-preview/request.json" "$SOURCE_RUN_ID" "$release_tag" "$sha256" "$size_bytes" <<'PY'
          import json
          import sys
          from pathlib import Path

          path, run_id, tag, digest, size = sys.argv[1:]
          value = {
              "source_run_id": run_id,
              "release_tag": tag,
              "sha256": digest,
              "size_bytes": int(size),
          }
          Path(path).write_text(json.dumps(value, indent=2) + "\n", encoding="utf-8")
          PY
          git -C "$temporary_dir/private-repo" add .private-preview/request.json
          git -C "$temporary_dir/private-repo" commit -m "Private preview handoff request $SOURCE_RUN_ID"
          git -C "$temporary_dir/private-repo" push origin "$transfer_branch"

          # Wait for the private workflow to verify the MP4. Prefer a one-day
          # Actions artifact; fall back to a private draft release if artifact
          # storage refuses the upload.
          private_run_id=""
          private_artifact_id=""
          private_release_url=""
          private_delivery=""
          for attempt in $(seq 1 40); do
            runs_json="$(gh api "repos/$PRIVATE_REPO/actions/workflows/private-video-preview-intake.yml/runs?branch=$transfer_branch&event=push&per_page=10")"
            run_state="$(python -c '
          import json, sys
          data = json.load(sys.stdin)
          matches = [
              item for item in data.get("workflow_runs", [])
              if item.get("head_branch") == sys.argv[1]
              and item.get("name") == "Private Violin Prince video preview intake"
          ]
          if not matches:
              print("not_found")
          else:
              item = sorted(matches, key=lambda value: value.get("created_at", ""), reverse=True)[0]
              print(str(item.get("id", "")) + "|" + str(item.get("status", "")) + "|" + str(item.get("conclusion") or ""))
          ' "$transfer_branch" <<< "$runs_json")"

            if [[ "$run_state" == "not_found" ]]; then
              sleep 15
              continue
            fi

            IFS='|' read -r private_run_id private_status private_conclusion <<< "$run_state"
            if [[ "$private_status" == "completed" ]]; then
              if [[ "$private_conclusion" != "success" ]]; then
                echo "::error::The private preview intake workflow completed with conclusion: $private_conclusion"
                exit 1
              fi
              artifacts_json="$(gh api "repos/$PRIVATE_REPO/actions/runs/$private_run_id/artifacts?per_page=100")"
              private_artifact_id="$(python -c '
          import json, sys
          data = json.load(sys.stdin)
          expected = "violin-prince-private-preview-" + sys.argv[1]
          artifacts = [
              item for item in data.get("artifacts", [])
              if item.get("name") == expected and not item.get("expired")
              and int(item.get("size_in_bytes") or 0) > 4096
          ]
          print(artifacts[0]["id"] if artifacts else "")
          ' "$SOURCE_RUN_ID" <<< "$artifacts_json")"
              if [[ -n "$private_artifact_id" ]]; then
                private_delivery="one_day_actions_artifact"
                break
              fi

              releases_json="$(gh api "repos/$PRIVATE_REPO/releases?per_page=100")"
              private_release_url="$(python -c '
          import json, sys
          data = json.load(sys.stdin)
          expected_title = "Private Violin Prince preview run " + sys.argv[1]
          expected_size = int(sys.argv[2])
          matches = [
              item for item in data
              if item.get("draft") is True and item.get("name") == expected_title
              and any(
                  asset.get("name") == "violin-prince-short.mp4"
                  and int(asset.get("size") or 0) == expected_size
                  for asset in item.get("assets", [])
              )
          ]
          print(matches[0].get("html_url", "") if matches else "")
          ' "$SOURCE_RUN_ID" "$size_bytes" <<< "$releases_json")"
              if [[ -n "$private_release_url" ]]; then
                private_delivery="private_draft_release_fallback"
                break
              fi
              echo "::error::The private intake passed but neither a verified artifact nor a verified private-release fallback was found."
              exit 1
            fi
            sleep 15
          done

          if [[ -z "$private_run_id" || -z "$private_delivery" ]]; then
            echo "::error::Timed out waiting for the private preview to be confirmed."
            exit 1
          fi

          # The transfer branch is temporary in both delivery modes.
          if gh api "repos/$PRIVATE_REPO/git/ref/heads/$transfer_branch" >/dev/null 2>&1; then
            echo "::error::The private intake finished but its temporary transfer branch remains."
            exit 1
          fi

          releases_json="$(gh api "repos/$PRIVATE_REPO/releases?per_page=100")"
          remaining_release_url="$(python -c '
          import json, sys
          data = json.load(sys.stdin)
          expected_title = "Private Violin Prince preview run " + sys.argv[1]
          expected_size = int(sys.argv[2])
          matches = [
              item for item in data
              if item.get("draft") is True and item.get("name") == expected_title
              and any(
                  asset.get("name") == "violin-prince-short.mp4"
                  and int(asset.get("size") or 0) == expected_size
                  for asset in item.get("assets", [])
              )
          ]
          print(matches[0].get("html_url", "") if matches else "")
          ' "$SOURCE_RUN_ID" "$size_bytes" <<< "$releases_json")"

          if [[ "$private_delivery" == "one_day_actions_artifact" && -n "$remaining_release_url" ]]; then
            echo "::error::Private intake artifact exists, but its temporary draft release remains."
            exit 1
          fi
          if [[ "$private_delivery" == "private_draft_release_fallback" && "$remaining_release_url" != "$private_release_url" ]]; then
            echo "::error::The verified private-release fallback is no longer available."
            exit 1
          fi

          echo "The MP4 is verified and stored in the private Voice Vault."
          echo "Private workflow run ID: $private_run_id"
          echo "Private delivery method: $private_delivery"
          echo "MP4 SHA-256: $sha256"
          {
            echo "## Private preview stored and verified"
            echo ""
            echo "- [Private intake run](https://github.com/$PRIVATE_REPO/actions/runs/$private_run_id)"
            echo "- MP4 SHA-256: \`$sha256\`"
            if [[ "$private_delivery" == "one_day_actions_artifact" ]]; then
              echo "- Private artifact ID: $private_artifact_id (one-day retention)"
              echo "- Temporary draft release and transfer branch were deleted."
            else
              echo "- [Private preview fallback release]($private_release_url)"
              echo "- Draft release remains private and is automatically removed after it is 24 hours old."
              echo "- Temporary transfer branch was deleted."
            fi
            echo "- No MP4 or raw narration file was uploaded as a public artifact."
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "## Private preview handoff"
            echo ""
            echo "- The completed MP4 passed size and SHA-256 verification in the private Voice Vault."
            if [[ "$private_delivery" == "one_day_actions_artifact" ]]; then
              echo "- Delivery: private one-day Actions artifact."
            else
              echo "- Delivery: private draft-release fallback, automatically removed after 24 hours."
              echo "- [Open private fallback release]($private_release_url)"
            fi
            echo "- Public Actions artifacts containing the MP4, raw narration or narration text are disabled."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Private release tag: $release_tag"
          echo "Private transfer branch: $transfer_branch"
          echo "MP4 SHA-256: $sha256"
          trap - EXIT
          rm -rf "$temporary_dir"

      - name: Verify the preview remains in the ephemeral runner after private transfer
        if: success() && env.PIPELINE_STAGE == 'full'
        shell: bash
        run: |
          set -euo pipefail
          test -s work/output/violin-prince-short.mp4
          test -s work/output/narration.wav
          echo "MP4 and narration remain on the temporary runner; no public upload step is configured."
