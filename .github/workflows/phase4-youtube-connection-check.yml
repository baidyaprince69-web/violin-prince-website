name: Phase 4 YouTube OAuth connection check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: youtube-oauth-connection-check
  cancel-in-progress: false

jobs:
  read-only-connection:
    name: Verify channel OAuth and Analytics access (no upload)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_EXPECTED_CHANNEL_ID: ${{ vars.YOUTUBE_EXPECTED_CHANNEL_ID }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal read-only connection dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "requests>=2.32,<3" "cryptography>=43,<48"

      - name: Compile the read-only connection check
        run: python -m py_compile autopilot/engine/youtube_native/*.py autopilot/engine/analytics.py autopilot/engine/seo_intelligence/*.py

      - name: Refresh OAuth, verify the target channel and test Analytics
        run: python -m autopilot.engine.youtube_native.connection_check
