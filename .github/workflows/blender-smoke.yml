name: Legacy Blender adapter checks (offline only)

on:
  push:
    branches:
      - main
      - feature/blender-3d-overlays
    paths:
      - "autopilot/engine/asset_resolver.py"
      - "autopilot/engine/story_asset_resolver.py"
      - "autopilot/engine/blender_reference.py"
      - "autopilot/engine/blender_renderer.py"
      - "autopilot/engine/blender_scene.py"
      - "autopilot/engine/frame_by_plane_backgrounds.py"
      - "autopilot/engine/frame_by_plane_adapter.py"
      - "autopilot/engine/blender_frame_by_plane_smoke.py"
      - "autopilot/engine/tests/blender_fbp_smoke_scene.py"
      - ".github/actions/setup-blender-frame-by-plane/action.yml"
      - "autopilot/engine/first_production_blender.py"
      - "autopilot/engine/voiceover.py"
      - "autopilot/engine/tests/**"
      - ".github/workflows/blender-smoke.yml"
  pull_request:
    paths:
      - "autopilot/engine/asset_resolver.py"
      - "autopilot/engine/story_asset_resolver.py"
      - "autopilot/engine/blender_reference.py"
      - "autopilot/engine/blender_renderer.py"
      - "autopilot/engine/blender_scene.py"
      - "autopilot/engine/frame_by_plane_backgrounds.py"
      - "autopilot/engine/frame_by_plane_adapter.py"
      - "autopilot/engine/blender_frame_by_plane_smoke.py"
      - ".github/actions/setup-blender-frame-by-plane/action.yml"
      - "autopilot/engine/first_production_blender.py"
      - "autopilot/engine/voiceover.py"
      - "autopilot/engine/tests/**"
      - ".github/workflows/blender-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-legacy-adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install code-test dependencies only
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests Pillow
      - name: Compile Blender adapters and run offline tests
        run: |
          python -m py_compile autopilot/engine/asset_resolver.py autopilot/engine/story_asset_resolver.py autopilot/engine/blender_reference.py autopilot/engine/blender_renderer.py autopilot/engine/blender_scene.py autopilot/engine/first_production_blender.py autopilot/engine/voiceover.py
          python -m unittest autopilot.engine.tests.test_asset_resolver autopilot.engine.tests.test_story_asset_resolver autopilot.engine.tests.test_blender_renderer autopilot.engine.tests.test_voiceover -v
      - name: Confirm the 3D production route is retired
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/violin-prince-autopilot.yml").read_text(encoding="utf-8")
          assert 'BLENDER_RENDER_ENABLED: "false"' in workflow
          assert 'MOTION_HYPERFRAMES_RENDER_ENABLED: "true"' in workflow
          print("Production is 2D-only. No Blender runtime or 3D smoke render is installed.")
          PY
