name: Blender code and integration checks

on:
  push:
    branches:
      - main
      - feature/blender-3d-overlays
    paths:
      - "autopilot/engine/asset_resolver.py"
      - "autopilot/engine/story_asset_resolver.py"
      - "autopilot/engine/blender_reference.py"
      - "autopilot/engine/blender_renderer.py"
      - "autopilot/engine/blender_scene.py"
      - "autopilot/engine/blender_renderer.py"
      - "autopilot/engine/frame_by_plane_backgrounds.py"
      - "autopilot/engine/frame_by_plane_adapter.py"
      - "autopilot/engine/blender_frame_by_plane_smoke.py"
      - "autopilot/engine/tests/blender_fbp_smoke_scene.py"
      - ".github/actions/setup-blender-frame-by-plane/action.yml"
      - "autopilot/engine/first_production_blender.py"
      - "autopilot/engine/voiceover.py"
      - "autopilot/engine/tests/**"
      - ".github/workflows/blender-smoke.yml"
  pull_request:
    paths:
      - "autopilot/engine/asset_resolver.py"
      - "autopilot/engine/story_asset_resolver.py"
      - "autopilot/engine/blender_reference.py"
      - "autopilot/engine/blender_renderer.py"
      - "autopilot/engine/blender_scene.py"
      - "autopilot/engine/first_production_blender.py"
      - "autopilot/engine/voiceover.py"
      - "autopilot/engine/tests/**"
      - ".github/workflows/blender-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-blender-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install code-test dependencies only
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests Pillow
      - name: Compile Blender adapters and run offline tests
        run: |
          python -m py_compile autopilot/engine/asset_resolver.py autopilot/engine/story_asset_resolver.py autopilot/engine/blender_reference.py autopilot/engine/blender_renderer.py autopilot/engine/blender_scene.py autopilot/engine/first_production_blender.py autopilot/engine/voiceover.py
          python -m unittest autopilot.engine.tests.test_asset_resolver autopilot.engine.tests.test_story_asset_resolver autopilot.engine.tests.test_blender_renderer autopilot.engine.tests.test_voiceover -v
      - name: Install pinned Blender 5.2.4 and Frame By Plane 8.0.1
        uses: ./.github/actions/setup-blender-frame-by-plane

      - name: Render one isolated Blender + Frame By Plane scene
        run: python autopilot/engine/blender_frame_by_plane_smoke.py --output-dir work/blender-fbp-smoke

      - name: Upload the single-scene integration proof
        if: always() && hashFiles('work/blender-fbp-smoke/single-scene-frame-by-plane-smoke.mp4') != ''
        uses: actions/upload-artifact@v4
        with:
          name: blender-frame-by-plane-smoke
          path: work/blender-fbp-smoke/
          if-no-files-found: error
          retention-days: 7

      - name: Confirm no full-render matrix is part of the smoke workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          content = Path(".github/workflows/blender-smoke.yml").read_text(encoding="utf-8")
          checked = "\\n".join(
              line for line in content.splitlines()
              if "forbidden_tokens =" not in line and "checked = " not in line
          )
          forbidden_tokens = ("matrix:", "total-samples 600", "sample-count 30")
          matches = [token for token in forbidden_tokens if token in checked]
          assert not matches, f"The smoke workflow must not contain full-render controls: {matches}"
          print("Offline smoke workflow has no full-render matrix or frame-partition settings.")
          PY
