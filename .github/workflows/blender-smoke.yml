name: Blender full-scene 3D production preview

on:
  push:
    branches:
      - feature/blender-3d-overlays
    paths:
      - "autopilot/engine/blender_renderer.py"
      - "autopilot/engine/blender_scene.py"
      - "autopilot/engine/tests/test_blender_renderer.py"
      - ".github/workflows/blender-smoke.yml"
  pull_request:
    paths:
      - "autopilot/engine/blender_renderer.py"
      - "autopilot/engine/blender_scene.py"
      - "autopilot/engine/tests/test_blender_renderer.py"
      - ".github/workflows/blender-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blender-production-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Blender Eevee needs an EGL context. Use Mesa's software renderer on runners
      # that do not expose a hardware GPU/display server.
      EGL_PLATFORM: surfaceless
      LIBGL_ALWAYS_SOFTWARE: "1"
      MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Blender and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libgbm1 libxkbcommon0
          blender --version
          ffmpeg -version | head -n 1

      - name: Install preview contact-sheet dependency
        run: python -m pip install --upgrade pip Pillow

      - name: Render three complete animated 3D scenes
        run: |
          python autopilot/engine/blender_renderer.py \
            --production-preview \
            --output-dir "$RUNNER_TEMP/violin-prince-blender-preview" \
            --resolution 360x640 \
            --fps 24

      - name: Verify that the preview is a real encoded video
        run: |
          ffprobe -v error \
            -show_entries format=duration:stream=codec_name,width,height,r_frame_rate \
            -of json \
            "$RUNNER_TEMP/violin-prince-blender-preview/blender-full-3d-production-preview.mp4"
          test -s "$RUNNER_TEMP/violin-prince-blender-preview/blender-production-contact-sheet.jpg"
          test -s "$RUNNER_TEMP/violin-prince-blender-preview/blender-production-report.json"

      - name: Upload production preview and verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: violin-prince-full-3d-blender-preview
          path: |
            \${{ runner.temp }}/violin-prince-blender-preview/blender-full-3d-production-preview.mp4
            \${{ runner.temp }}/violin-prince-blender-preview/blender-production-contact-sheet.jpg
            \${{ runner.temp }}/violin-prince-blender-preview/blender-production-report.json
            \${{ runner.temp }}/violin-prince-blender-preview/blender-scene-*.mp4
            \${{ runner.temp }}/violin-prince-blender-preview/blender-scene-*-poster.jpg
          if-no-files-found: error
          retention-days: 14
