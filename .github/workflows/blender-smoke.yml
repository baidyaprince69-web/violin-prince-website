name: Blender code and integration checks

on:
  push:
    branches:
      - feature/blender-3d-overlays
    paths:
      - "autopilot/engine/asset_resolver.py"
      - "autopilot/engine/story_asset_resolver.py"
      - "autopilot/engine/blender_reference.py"
      - "autopilot/engine/blender_renderer.py"
      - "autopilot/engine/blender_scene.py"
      - "autopilot/engine/first_production_blender.py"
      - "autopilot/engine/voiceover.py"
      - "autopilot/engine/tests/**"
      - ".github/workflows/blender-smoke.yml"
  pull_request:
    paths:
      - "autopilot/engine/asset_resolver.py"
      - "autopilot/engine/story_asset_resolver.py"
      - "autopilot/engine/blender_reference.py"
      - "autopilot/engine/blender_renderer.py"
      - "autopilot/engine/blender_scene.py"
      - "autopilot/engine/first_production_blender.py"
      - "autopilot/engine/voiceover.py"
      - "autopilot/engine/tests/**"
      - ".github/workflows/blender-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-blender-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install code-test dependencies only
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests Pillow
      - name: Compile Blender adapters and run offline tests
        run: |
          python -m py_compile autopilot/engine/asset_resolver.py autopilot/engine/story_asset_resolver.py autopilot/engine/blender_reference.py autopilot/engine/blender_renderer.py autopilot/engine/blender_scene.py autopilot/engine/first_production_blender.py autopilot/engine/voiceover.py
          python -m unittest autopilot.engine.tests.test_asset_resolver autopilot.engine.tests.test_story_asset_resolver autopilot.engine.tests.test_blender_renderer autopilot.engine.tests.test_voiceover -v
      - name: Confirm no full-render matrix is part of the smoke workflow
        run: |
          ! grep -Eq 'matrix:|total-samples 600|sample-count 30' .github/workflows/blender-smoke.yml
