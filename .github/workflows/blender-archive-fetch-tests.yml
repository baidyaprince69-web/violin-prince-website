name: Blender archive downloader tests

on:
  pull_request:
    paths:
      - ".github/actions/setup-blender-frame-by-plane/**"
      - ".github/workflows/blender-archive-fetch-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-fetch-verified:
    name: ShellCheck and downloader regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ensure ShellCheck is installed
        shell: bash
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi

      - name: ShellCheck downloader and regression suite
        shell: bash
        run: |
          shellcheck \
            .github/actions/setup-blender-frame-by-plane/fetch-verified.sh \
            .github/actions/setup-blender-frame-by-plane/test-fetch-verified.sh

      - name: Run downloader regression suite
        shell: bash
        run: |
          bash .github/actions/setup-blender-frame-by-plane/test-fetch-verified.sh \
            .github/actions/setup-blender-frame-by-plane/fetch-verified.sh
