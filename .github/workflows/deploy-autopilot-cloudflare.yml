name: Deploy Violin Prince Autopilot to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provision-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CF_DEPLOY_TOKEN: ${{ secrets.CF_DEPLOY_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DEPLOY_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
      AUTOPILOT_JOB_TOKEN: ${{ secrets.AUTOPILOT_JOB_TOKEN }}
      GITHUB_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
    steps:
      - name: Check required secrets
        shell: bash
        run: |
          missing=0
          for name in CF_DEPLOY_TOKEN CF_ACCOUNT_ID DASHBOARD_TOKEN AUTOPILOT_JOB_TOKEN GITHUB_DISPATCH_TOKEN GH_SECRETS_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Provision D1 and R2
        run: node autopilot/scripts/provision-cloudflare.mjs

      - name: Apply D1 schema
        run: >
          npx --yes wrangler@4 d1 execute violin-prince-autopilot
          --remote
          --file=autopilot/cloudflare/schema.sql
          --config=autopilot/cloudflare/wrangler.generated.toml

      - name: Deploy Worker
        shell: bash
        run: |
          set -o pipefail
          npx --yes wrangler@4 deploy --config=autopilot/cloudflare/wrangler.generated.toml 2>&1 | tee /tmp/worker-deploy.log
          echo "## Cloudflare Worker deployment" >> "$GITHUB_STEP_SUMMARY"
          WORKER_URL="$(grep -Eo 'https://[^[:space:]]+workers\.dev' /tmp/worker-deploy.log | tail -1)"
          if [ -z "$WORKER_URL" ]; then
            echo "::error::Wrangler did not report a workers.dev URL."
            exit 1
          fi
          echo "WORKER_URL=$WORKER_URL" >> "$GITHUB_ENV"
          echo "$WORKER_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The deploy workflow will save this URL as the AUTOPILOT_API_URL GitHub Actions secret." >> "$GITHUB_STEP_SUMMARY"

      - name: Configure Worker secrets
        shell: bash
        run: |
          printf '%s' "$DASHBOARD_TOKEN" | npx --yes wrangler@4 secret put DASHBOARD_TOKEN --config=autopilot/cloudflare/wrangler.generated.toml
          printf '%s' "$AUTOPILOT_JOB_TOKEN" | npx --yes wrangler@4 secret put JOB_TOKEN --config=autopilot/cloudflare/wrangler.generated.toml
          printf '%s' "$GITHUB_DISPATCH_TOKEN" | npx --yes wrangler@4 secret put GITHUB_DISPATCH_TOKEN --config=autopilot/cloudflare/wrangler.generated.toml
          openssl rand -hex 32 | npx --yes wrangler@4 secret put MEDIA_SIGNING_SECRET --config=autopilot/cloudflare/wrangler.generated.toml

      - name: Save Worker URL as GitHub Actions secret
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        shell: bash
        run: |
          if [ -z "$WORKER_URL" ]; then
            echo "::error::WORKER_URL was not captured from Wrangler output."
            exit 1
          fi
          printf '%s' "$WORKER_URL" | gh secret set AUTOPILOT_API_URL --repo "$GITHUB_REPOSITORY"
          echo "AUTOPILOT_API_URL was saved in repository Actions secrets." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Worker health
        shell: bash
        run: |
          if [ -z "$WORKER_URL" ]; then
            echo "::error::WORKER_URL is missing."
            exit 1
          fi
          curl --fail --silent --show-error "$WORKER_URL/api/health"
          echo ""
