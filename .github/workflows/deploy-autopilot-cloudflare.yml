name: Deploy Violin Prince Autopilot to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provision-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CF_API_TOKEN: \${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: \${{ secrets.CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: \${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: \${{ secrets.CF_ACCOUNT_ID }}
      DASHBOARD_TOKEN: \${{ secrets.DASHBOARD_TOKEN }}
      AUTOPILOT_JOB_TOKEN: \${{ secrets.AUTOPILOT_JOB_TOKEN }}
    steps:
      - name: Check required secrets
        shell: bash
        run: |
          missing=0
          for name in CF_DEPLOY_TOKEN CF_ACCOUNT_ID DASHBOARD_TOKEN AUTOPILOT_JOB_TOKEN; do
            if [ -z "\${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Provision D1 and R2
        run: node autopilot/scripts/provision-cloudflare.mjs

      - name: Install Wrangler
        run: npm install --no-save wrangler@4

      - name: Apply D1 schema
        run: >
          npx wrangler d1 execute violin-prince-autopilot
          --remote
          --file=autopilot/cloudflare/schema.sql
          --config=autopilot/cloudflare/wrangler.generated.toml

      - name: Deploy Worker
        shell: bash
        run: |
          set -o pipefail
          npx wrangler deploy --config=autopilot/cloudflare/wrangler.generated.toml 2>&1 | tee /tmp/worker-deploy.log
          echo "## Cloudflare Worker deployment" >> "$GITHUB_STEP_SUMMARY"
          WORKER_URL="$(grep -Eo 'https://[^[:space:]]+workers\.dev' /tmp/worker-deploy.log | tail -1)"
          if [ -n "$WORKER_URL" ]; then
            echo "$WORKER_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Find the workers.dev URL in the Deploy Worker logs." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Copy the Worker URL into the AUTOPILOT_API_URL GitHub Actions secret." >> "$GITHUB_STEP_SUMMARY"

      - name: Configure Worker secrets
        shell: bash
        run: |
          printf '%s' "$DASHBOARD_TOKEN" | npx wrangler secret put DASHBOARD_TOKEN --config=autopilot/cloudflare/wrangler.generated.toml
          printf '%s' "$AUTOPILOT_JOB_TOKEN" | npx wrangler secret put JOB_TOKEN --config=autopilot/cloudflare/wrangler.generated.toml
          openssl rand -hex 32 | npx wrangler secret put MEDIA_SIGNING_SECRET --config=autopilot/cloudflare/wrangler.generated.toml

      - name: Verify Worker health
        shell: bash
        run: |
          URL="$(grep -Eo 'https://[^[:space:]]+workers\.dev' /tmp/worker-deploy.log | tail -1)"
          if [ -z "$URL" ]; then
            echo "::warning::Could not parse the workers.dev URL from Wrangler output. Check the deploy logs."
            exit 0
          fi
          curl --fail --silent --show-error "$URL/api/health"
          echo ""
