name: Assemble existing Violin Prince first production

run-name: Assemble existing 600-frame production (source ${{ inputs.source_run_id || '43698607527' }})

on:
  push:
    branches:
      - feature/blender-3d-overlays
    paths:
      - ".github/workflows/assemble-existing-first-production.yml"
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Existing completed render run to assemble (no Blender rerender)"
        required: true
        default: "43698607527"
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: assemble-existing-first-production-${{ inputs.source_run_id || '43698607527' }}
  cancel-in-progress: false

jobs:
  assemble-existing-render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOURCE_RUN_ID: ${{ inputs.source_run_id || '43698607527' }}
    steps:
      - name: Check out the assembly source
        uses: actions/checkout@v4

      - name: Install final assembly tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core zip
          python -m pip install --upgrade pip
          python -m pip install "Pillow>=10.4,<12"

      - name: Download the 20 existing Blender frame artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: violin-prince-blender-frames-*
          merge-multiple: true
          path: work/render-data
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Download the existing editable Blender project
        uses: actions/download-artifact@v4
        with:
          name: violin-prince-blender-project
          path: work/render-data
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Download the existing licensed model and provenance
        uses: actions/download-artifact@v4
        with:
          name: violin-prince-first-production-assets
          path: work/first-production
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Download the already generated narration, music and SFX
        uses: actions/download-artifact@v4
        with:
          name: violin-prince-first-production-audio
          path: work/first-production
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Validate existing artifacts and assemble the native 25 FPS picture
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p work/first-production/assets work/first-production/frames
          # upload-artifact preserves the common-root folders: PNGs are under frames/.
          cp work/render-data/frames/frame_*.png work/first-production/frames/
          cp work/render-data/blender-visual.blend work/first-production/

          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("work/first-production")
          frame_dir = root / "frames"
          frames = sorted(frame_dir.glob("frame_*.png"))
          reports = sorted(Path("work/render-data/segment-reports").glob("segment-*.json"))

          expected_names = [f"frame_{index:04d}.png" for index in range(600)]
          actual_names = [path.name for path in frames]
          assert actual_names == expected_names, (
              f"Expected every one of 600 frame PNGs in order; found {len(frames)}"
          )
          assert len(reports) == 20, f"Expected 20 worker reports, found {len(reports)}"

          sample_indices = []
          timeline_frames = []
          for report_path in reports:
              report = json.loads(report_path.read_text(encoding="utf-8"))
              assert report["sample_count"] == 30, report_path.name
              assert report["total_samples"] == 600, report_path.name
              assert report["actual_imported_mesh_count"] >= 1, report_path.name
              sample_indices.extend(sample["sample_index"] for sample in report["samples"])
              timeline_frames.extend(sample["timeline_frame"] for sample in report["samples"])

          assert sorted(sample_indices) == list(range(600)), "Missing or duplicate sample indices"
          assert sorted(timeline_frames) == list(range(1, 601)), "Timeline frames are not exactly 1–600"

          required = [
              root / "blender-visual.blend",
              root / "assets" / "violin.glb",
              root / "assets" / "asset-provenance.json",
              root / "final-audio-mix.wav",
              root / "captions.srt",
              root / "audio-report.json",
          ]
          for item in required:
              assert item.is_file() and item.stat().st_size > 0, f"Missing required artifact: {item}"

          asset = json.loads((root / "assets" / "asset-provenance.json").read_text(encoding="utf-8"))
          assert str(asset.get("license", "")).upper().startswith("CC0")
          print(json.dumps({
              "source_run_id": "${{ env.SOURCE_RUN_ID }}",
              "verified_blender_frames": len(frames),
              "render_workers": len(reports),
              "timeline_frames": [1, 600],
              "render_fps": 25,
              "audio_and_model_artifacts": "present",
              "rendering_repeated": False,
          }, indent=2))
          PY

          ffmpeg -y -hide_banner -loglevel error \
            -framerate 25 -start_number 0 \
            -i work/first-production/frames/frame_%04d.png \
            -frames:v 600 \
            -vf "scale=720:1280:flags=lanczos,format=yuv420p" \
            -an -c:v libx264 -preset medium -crf 18 \
            -r 25 -fps_mode cfr -movflags +faststart \
            work/first-production/blender-visual.mp4
          test -s work/first-production/blender-visual.mp4

      - name: Assemble narration, violin music, effects and captions
        run: |
          ffmpeg -y -hide_banner -loglevel error \
            -i work/first-production/blender-visual.mp4 \
            -i work/first-production/final-audio-mix.wav \
            -vf "subtitles=work/first-production/captions.srt:force_style='FontName=DejaVu Sans,FontSize=22,PrimaryColour=&H00F4F2EA,OutlineColour=&H00101925,BorderStyle=1,Outline=2,Shadow=0,Alignment=2,MarginV=94'" \
            -map 0:v:0 -map 1:a:0 \
            -frames:v 600 -t 24 \
            -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p \
            -r 25 -fps_mode cfr \
            -c:a aac -b:a 192k -ar 48000 -ac 2 \
            -movflags +faststart \
            work/first-production/Violin-Prince-First-Production.mp4

      - name: Verify final video contains 600 frames at 25 FPS
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          root = Path("work/first-production")
          video = root / "Violin-Prince-First-Production.mp4"
          assert video.is_file() and video.stat().st_size > 1_000_000
          probe = json.loads(subprocess.check_output([
              "ffprobe", "-v", "error", "-count_frames",
              "-show_streams", "-show_format", "-of", "json", str(video)
          ], text=True))
          picture = next(stream for stream in probe["streams"] if stream.get("codec_type") == "video")
          audio = next(stream for stream in probe["streams"] if stream.get("codec_type") == "audio")
          duration = float(probe["format"]["duration"])
          frames = int(picture.get("nb_read_frames", picture.get("nb_frames", 0)))
          assert picture["codec_name"] == "h264"
          assert (picture["width"], picture["height"]) == (720, 1280)
          assert picture.get("r_frame_rate") == "25/1"
          assert frames == 600, f"Expected 600 output frames, found {frames}"
          assert audio["codec_name"] == "aac" and audio["channels"] == 2
          assert 23.5 <= duration <= 24.5, duration

          audio_report = json.loads((root / "audio-report.json").read_text(encoding="utf-8"))
          asset = json.loads((root / "assets" / "asset-provenance.json").read_text(encoding="utf-8"))
          report = {
              "status": "complete",
              "source_run_id": "${{ env.SOURCE_RUN_ID }}",
              "source_artifacts_reused": True,
              "blender_rerender_performed": False,
              "blender_render_samples": 600,
              "parallel_blender_workers": 20,
              "native_blender_fps": 25,
              "final_video_frame_count": frames,
              "frame_interpolation": "none — every timeline frame was rendered in Blender",
              "duration_seconds": duration,
              "resolution": [picture["width"], picture["height"]],
              "frame_rate": picture["r_frame_rate"],
              "video_codec": picture["codec_name"],
              "audio_codec": audio["codec_name"],
              "model_provider": asset.get("provider"),
              "model_license": asset.get("license"),
              "model_sha256": asset.get("sha256"),
              "narration_engine": audio_report.get("narration", {}).get("engine"),
              "music_license": audio_report.get("music", {}).get("license"),
              "publishing": "NOT PUBLISHED — review copy only",
          }
          (root / "final-production-report.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Create the editable production project bundle
        run: |
          cd work/first-production
          zip -r ../../Violin-Prince-First-Production-Project.zip \
            assets asset-resolution.json blender-visual.blend blender-visual.mp4 \
            production-script.txt narration.wav cc0-violin-music.wav \
            cinematic-sound-effects.wav final-audio-mix.wav captions.srt \
            audio-report.json final-production-report.json
          cd ../..

      - name: Create a five-shot contact sheet
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          from PIL import Image, ImageDraw

          video = "work/first-production/Violin-Prince-First-Production.mp4"
          samples = []
          for index, seconds in enumerate((1.0, 5.5, 11.0, 17.0, 22.5)):
              target = Path(f"work/first-production/contact-{index + 1}.png")
              subprocess.run([
                  "ffmpeg", "-y", "-hide_banner", "-loglevel", "error",
                  "-ss", str(seconds), "-i", video, "-frames:v", "1", str(target)
              ], check=True)
              with Image.open(target) as image:
                  samples.append(image.convert("RGB").resize((216, 384)))

          canvas = Image.new("RGB", (5 * 216 + 6 * 16, 448), (8, 14, 25))
          draw = ImageDraw.Draw(canvas)
          for index, frame in enumerate(samples):
              x = 16 + index * (216 + 16)
              canvas.paste(frame, (x, 48))
              draw.text((x + 6, 18), f"SHOT {index + 1}", fill=(238, 211, 160))
          canvas.save("work/first-production/contact-sheet.jpg", quality=92)
          PY

      - name: Upload completed review-only production
        uses: actions/upload-artifact@v4
        with:
          name: violin-prince-first-complete-production
          path: |
            work/first-production/Violin-Prince-First-Production.mp4
            Violin-Prince-First-Production-Project.zip
            work/first-production/contact-sheet.jpg
            work/first-production/final-production-report.json
            work/first-production/production-script.txt
            work/first-production/assets/asset-provenance.json
          if-no-files-found: error
          retention-days: 30

      - name: Summarise assembly-only recovery
        if: success()
        run: |
          {
            echo "## Existing Violin Prince render assembled successfully"
            echo
            echo "- Reused source run: $SOURCE_RUN_ID"
            echo "- Blender rerender: none"
            echo "- Frames reused: 600 native Blender frames at 25 FPS"
            echo "- Rendering jobs repeated: none"
            echo "- Output: review-only MP4 and editable project bundle"
            echo "- Publishing: disabled"
          } >> "$GITHUB_STEP_SUMMARY"
