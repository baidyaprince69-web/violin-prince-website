name: Qwen3-TTS isolated voice preflight

on:
  push:
    branches:
      - feature/qwen3-private-voice-test-2026-11-18
    paths:
      - ".github/voice-tests/**"
      - ".github/workflows/qwen3-voice-preflight.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/voice-tests/**"
      - ".github/workflows/qwen3-voice-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qwen3-voice-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-preflight:
    name: Validate Qwen3-TTS package and CPU Base model (no voice data)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install SoX runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes sox libsox-fmt-all
          sox --version

      - name: Install pinned Qwen3-TTS package
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir "qwen-tts==0.1.1"

      - name: Check Qwen3-TTS Base voice-cloning API
        run: python .github/voice-tests/qwen3_api_preflight.py

      - name: Load Qwen3-TTS 0.6B Base on the standard CPU runner
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: python .github/voice-tests/qwen3_cpu_model_smoke.py
