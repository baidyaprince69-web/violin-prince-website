name: Master Director Story Depth Preview

on:
  push:
    branches:
      - feat/story-depth-integration
    paths:
      - "autopilot/engine/**"
      - ".github/workflows/master-director-story-depth-preview.yml"

permissions:
  contents: read

concurrency:
  group: master-director-story-depth-preview-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  render-story-depth-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PUBLISH_ENABLED: "false"
      AUTOPILOT_ENABLED: "false"
      MASTER_DIRECTOR_VISUAL_REVIEW_APPROVED: "false"
      HYPERFRAMES_NO_UPDATE_CHECK: "1"
      CI: "true"
    steps:
      - name: Check out story-depth integration
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: autopilot/engine/requirements-character.txt

      - name: Install isolated CPU-only rig dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -r autopilot/engine/requirements-character.txt
          pip install "Pillow>=10.4,<12" "numpy>=1.24,<3" "cryptography>=42,<47" "soundfile>=0.12,<1" "requests>=2.31,<3"

      - name: Run story, rig and camera-parallax contracts
        env:
          PYTHONPATH: autopilot/engine
        run: |
          python -m unittest discover -s autopilot/engine/tests -p "test_master_creative_director.py" -v
          python -m unittest discover -s autopilot/engine/tests -p "test_create_master_director_video_project.py" -v
          python -m unittest discover -s autopilot/engine/tests -p "test_bow_stroke_axis.py" -v

      - name: Rebuild the existing source-aligned Violin Prince rig
        env:
          PYTHONPATH: autopilot/engine
        run: |
          python autopilot/engine/character_autorig.py \
            --source autopilot/engine/assets/characters/violin-prince-performance/master-character-performance.webp \
            --reference-dir autopilot/engine/assets/characters/violin-prince-reference \
            --output work/full-body-rig/bundle \
            --id violin-prince \
            --allow-expression-fallback

      - name: Apply the already-approved lower-body joint patches
        env:
          PYTHONPATH: autopilot/engine
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          approved_path = Path("autopilot/engine/assets/characters/violin-prince-performance/joint-artwork-template-reviewed.json")
          config_path = Path("autopilot/engine/assets/characters/violin-prince-performance/performance-regions.json")
          output_path = Path("work/full-body-rig/performance-regions-reviewed.json")
          approved = json.loads(approved_path.read_text(encoding="utf-8"))
          config = json.loads(config_path.read_text(encoding="utf-8"))
          expected = {
              "left_hip", "right_hip", "left_knee",
              "right_knee", "left_ankle", "right_ankle",
          }
          assert approved.get("schema_version") == 1
          assert approved.get("coordinate_space") == "absolute_source_pixels_top_left"
          assert approved.get("canvas") == config.get("canvas")
          assert approved.get("review_metadata", {}).get("approved_region_count") == 6
          assert approved.get("review_metadata", {}).get("status") == "explicit_user_approval"
          approved_regions = approved.get("joint_surfaces", {}).get("regions", {})
          runtime_surfaces = config.get("joint_surfaces", {})
          runtime_regions = runtime_surfaces.get("regions", {})
          assert set(approved_regions) == expected
          assert set(expected).issubset(runtime_regions)
          for name in sorted(expected):
              reviewed = approved_regions[name]
              runtime = runtime_regions[name]
              assert reviewed.get("artwork_status") == "artist_approved"
              for key in ("anchor", "parent_role", "child_role", "blend_axis_joints"):
                  assert reviewed.get(key) == runtime.get(key)
              assert len(reviewed.get("artist_source_polygon", [])) >= 3
              runtime["artist_source_polygon"] = reviewed["artist_source_polygon"]
              runtime["artwork_status"] = "artist_approved"
              runtime["anchor_px"] = reviewed["anchor_px"]
              runtime["minimum_parent_child_overlap_pixels"] = 4
              runtime["blend_axis_half_length_px"] = reviewed["blend_axis_half_length_px"]
              runtime["edge_feather_px"] = float(reviewed.get("edge_feather_px", 0.5))
              runtime["approval_provenance"] = reviewed["approval_provenance"]
              runtime["candidate_is_production_art"] = False
              runtime.pop("polygon", None)
              runtime.pop("outline", None)
          runtime_surfaces["coordinate_space"] = "absolute_source_pixels_top_left"
          config["joint_surfaces"] = runtime_surfaces
          config["source_artwork"] = approved["source_artwork"]
          config["review_metadata"] = approved["review_metadata"]
          output_path.parent.mkdir(parents=True, exist_ok=True)
          output_path.write_text(json.dumps(config, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("Applied existing approved lower-body joint geometry; no hand or upper-body artwork was edited.")
          PY

      - name: Reuse the same character and instrument rig without edits
        env:
          PYTHONPATH: autopilot/engine
        run: |
          python autopilot/engine/full_body_performance_rig.py \
            --source autopilot/engine/assets/characters/violin-prince-performance/master-character-performance.webp \
            --bundle work/full-body-rig/bundle \
            --prop-dir autopilot/engine/assets/characters/violin-prince-performance \
            --instrument-manifest autopilot/engine/assets/characters/violin-prince-performance/instrument-props.json \
            --performance-regions work/full-body-rig/performance-regions-reviewed.json \
            --finger-manifest autopilot/engine/assets/characters/violin-prince-performance/finger-regions.json \
            --rigging-sheet autopilot/engine/assets/characters/violin-prince-performance/reference-sheets/Gemini_Generated_Image_7xpc647xpc647xpc.png \
            --expression-sheet autopilot/engine/assets/characters/violin-prince-performance/reference-sheets/four-core-expressions.jpeg \
            --head-angle-sheet autopilot/engine/assets/characters/violin-prince-performance/reference-sheets/multi-angle-heads-facial-parts.jpeg

      - name: Generate the fixed CC0 violin test take and measured event map
        env:
          PYTHONPATH: autopilot/engine
        run: |
          mkdir -p work/full-body-rig/audio
          python - <<'PY'
          import json
          from pathlib import Path
          from violin_sampler import create_sampled_violin_bed

          audio_path, music_map = create_sampled_violin_bed(
              "work/full-body-rig/audio/violin-prince-cc0-solo-violin.wav",
              seed_text="violin-prince-master-director-story-depth-preview",
          )
          assert music_map.get("license") == "CC0-1.0", music_map
          assert float(music_map.get("bpm", 0)) == 80.0, music_map
          assert len(music_map.get("beat_times", [])) == 32, music_map
          assert len(music_map.get("onsets", [])) > 0, music_map
          Path("work/full-body-rig/audio/violin-prince-cc0-solo-violin.music-map.json").write_text(
              json.dumps(music_map, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps({
              "license": music_map["license"],
              "duration_seconds": music_map["duration_seconds"],
              "bpm": music_map["bpm"],
              "beats": len(music_map["beat_times"]),
              "note_events": len(music_map["onsets"])
          }, indent=2))
          PY

      - name: Build the 24-second performance timeline from the same violin take
        env:
          PYTHONPATH: autopilot/engine
        run: |
          python autopilot/engine/create_full_body_performance_preview.py \
            --bundle work/full-body-rig/bundle \
            --output work/full-body-rig/master-director-base \
            --audio work/full-body-rig/audio/violin-prince-cc0-solo-violin.wav \
            --music-map work/full-body-rig/audio/violin-prince-cc0-solo-violin.music-map.json \
            --duration-seconds 24

      - name: Compile the eight authored story shots and preserve the rig manifest
        env:
          PYTHONPATH: autopilot/engine
        run: |
          python autopilot/engine/create_master_director_video_project.py \
            --base-project work/full-body-rig/master-director-base/project.json \
            --director-plan autopilot/engine/tests/fixtures/master-director-fullbody-integration-demo.json \
            --output work/full-body-rig/master-director/project.json
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          base = json.loads(Path("work/full-body-rig/master-director-base/project.json").read_text())
          project = json.loads(Path("work/full-body-rig/master-director/project.json").read_text())
          assert project["characters"] == base["characters"], "Director compilation modified the source character rig manifest."
          assert project["diagnostics"]["character_rig_manifest_preserved"] is True
          assert project["diagnostics"]["camera_linked_environment_depth"] is True
          assert project["diagnostics"]["story_depth_plane_object_count"] == 24
          assert project["diagnostics"]["story_depth_plane_assignments_complete"] is True
          assert len(project["scenes"]) == 8
          visible = sum(scene["character_actions"]["violin-prince"]["visible"] for scene in project["scenes"])
          assert visible == 3, visible
          characters_hash = hashlib.sha256(
              json.dumps(base["characters"], sort_keys=True, separators=(",", ":")).encode()
          ).hexdigest()
          Path("work/full-body-rig/master-director/character-rig-manifest.sha256").write_text(
              characters_hash + "\n", encoding="utf-8"
          )
          assert all(
              object.get("depth_plane") in {"background", "midground", "foreground"}
              for scene in project["scenes"]
              for object in scene["stagecraft"]["objects"]
          )
          print(json.dumps({
              "shot_count": len(project["scenes"]),
              "performer_visible_shots": visible,
              "performer_hidden_shots": len(project["scenes"]) - visible,
              "story_depth_plane_objects": project["diagnostics"]["story_depth_plane_object_count"],
              "depth_plane_counts": project["diagnostics"]["story_depth_plane_counts"],
              "character_rig_manifest_sha256": characters_hash,
              "character_rig_manifest_preserved": True
          }, indent=2))
          PY

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Motion and HyperFrames
        working-directory: autopilot/engine/animation2d
        run: npm install --no-audit --no-fund

      - name: Run animation and parallax regression suite
        working-directory: autopilot/engine/animation2d
        run: npm test

      - name: Build and lint the story-specific multi-plane composition
        working-directory: autopilot/engine/animation2d
        run: |
          node build.mjs \
            --project ../../../work/full-body-rig/master-director/project.json \
            --out-dir ../../../work/full-body-rig/master-director/composition
          mkdir -p ../../../work/full-body-rig/master-director/composition/assets/characters ../../../work/full-body-rig/master-director/composition/assets/fonts
          cp -R ../../../work/full-body-rig/master-director-base/assets/characters/violin-prince \
            ../../../work/full-body-rig/master-director/composition/assets/characters/
          cp ../assets/fonts/DMSans.woff2 ../assets/fonts/DMSerifDisplay-Regular.woff2 \
            ../assets/fonts/DM-Sans-OFL.txt ../assets/fonts/DM-Serif-Display-OFL.txt \
            ../../../work/full-body-rig/master-director/composition/assets/fonts/
          test -s ../../../work/full-body-rig/master-director/composition/assets/fonts/DMSans.woff2
          test -s ../../../work/full-body-rig/master-director/composition/assets/fonts/DMSerifDisplay-Regular.woff2
          cd ../../../work/full-body-rig/master-director/composition
          $GITHUB_WORKSPACE/autopilot/engine/animation2d/node_modules/.bin/hyperframes lint
          $GITHUB_WORKSPACE/autopilot/engine/animation2d/node_modules/.bin/hyperframes render \
            --output ../full-body-master-director-video-only.mp4 --fps 25 --quality standard

      - name: Install bundled FFmpeg and FFprobe
        run: |
          TOOLS_DIR="$RUNNER_TEMP/media-tools"
          mkdir -p "$TOOLS_DIR"
          npm install --prefix "$TOOLS_DIR" --no-save --no-package-lock ffmpeg-static ffprobe-static
          FFMPEG_EXE="$(node -p "require('$TOOLS_DIR/node_modules/ffmpeg-static')")"
          FFPROBE_EXE="$(node -p "require('$TOOLS_DIR/node_modules/ffprobe-static').path")"
          ln -sf "$FFMPEG_EXE" "$TOOLS_DIR/ffmpeg"
          ln -sf "$FFPROBE_EXE" "$TOOLS_DIR/ffprobe"
          echo "$TOOLS_DIR" >> "$GITHUB_PATH"
          "$TOOLS_DIR/ffmpeg" -version | head -n 1
          "$TOOLS_DIR/ffprobe" -version | head -n 1

      - name: Mix the CC0 guide and verify the complete Director sequence
        env:
          PYTHONPATH: autopilot/engine
        run: |
          ffmpeg -hide_banner -loglevel error -y \
            -i work/full-body-rig/master-director/full-body-master-director-video-only.mp4 \
            -i work/full-body-rig/audio/violin-prince-cc0-solo-violin.wav \
            -map 0:v:0 -map 1:a:0 -t 24 \
            -c:v copy -c:a aac -b:a 192k -shortest -movflags +faststart \
            work/full-body-rig/master-director/full-body-master-director-mixed.mp4
          python autopilot/engine/verify_master_director_render.py \
            --video work/full-body-rig/master-director/full-body-master-director-mixed.mp4 \
            --project work/full-body-rig/master-director/project.json \
            --motion-report work/full-body-rig/master-director/composition/motion-report.json \
            --report-output work/full-body-rig/master-director/master-director-render-qa.json
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("work/full-body-rig/master-director")
          project = json.loads((root / "project.json").read_text())
          report = json.loads((root / "composition/motion-report.json").read_text())
          qa = json.loads((root / "master-director-render-qa.json").read_text())
          baseline = (root / "character-rig-manifest.sha256").read_text().strip()
          current = hashlib.sha256(
              json.dumps(project["characters"], sort_keys=True, separators=(",", ":")).encode()
          ).hexdigest()
          assert current == baseline, "Character rig manifest changed after Director compilation."
          assert len(project["scenes"]) == 8, project
          assert report.get("status") == "passed", report
          assert report.get("stagecraft_camera_parallax_track_count") == 24, report
          assert report.get("stagecraft_camera_parallax_scene_count") == 8, report
          assert set(report.get("stagecraft_camera_parallax_depth_planes") or []) == {
              "background", "midground", "foreground"
          }, report
          assert all(
              scene.get("stagecraft_camera_parallax_track_count") == 3
              for scene in report.get("scenes", [])
          ), report
          assert all(
              set(scene.get("stagecraft_camera_parallax_depth_planes") or []) == {
                  "background", "midground", "foreground"
              }
              for scene in report.get("scenes", [])
          ), report
          probe = json.loads(__import__("subprocess").run(
              ["ffprobe", "-v", "error", "-show_entries",
               "format=duration:stream=codec_type,codec_name,width,height,r_frame_rate",
               "-of", "json", str(root / "full-body-master-director-mixed.mp4")],
              check=True, capture_output=True, text=True
          ).stdout)
          video = next(stream for stream in probe["streams"] if stream.get("codec_type") == "video")
          audio = next(stream for stream in probe["streams"] if stream.get("codec_type") == "audio")
          assert video["codec_name"] == "h264" and audio["codec_name"] == "aac", probe
          assert (video["width"], video["height"]) == (720, 1280), probe
          assert video.get("avg_frame_rate") == "25/1", probe
          assert abs(float(probe["format"]["duration"]) - 24.0) <= .08, probe
          print(json.dumps({
              "status": "passed",
              "duration_seconds": float(probe["format"]["duration"]),
              "resolution": [video["width"], video["height"]],
              "fps": video["avg_frame_rate"],
              "codec": [video["codec_name"], audio["codec_name"]],
              "story_shots": len(project["scenes"]),
              "parallax_tracks": report["stagecraft_camera_parallax_track_count"],
              "parallax_scenes": report["stagecraft_camera_parallax_scene_count"],
              "character_rig_manifest_sha256": current,
              "publishing_enabled": False,
              "autopilot_enabled": False
          }, indent=2))
          PY
          mkdir -p work/full-body-rig/master-director/review
          ffmpeg -hide_banner -loglevel error -y \
            -i work/full-body-rig/master-director/full-body-master-director-mixed.mp4 \
            -vf "fps=1/3,scale=360:-1,tile=4x2:padding=12:margin=12" \
            -frames:v 1 work/full-body-rig/master-director/review/eight-shot-contact-sheet.jpg
          cp work/full-body-rig/master-director/project.json work/full-body-rig/master-director/review/
          cp work/full-body-rig/master-director/composition/motion-report.json work/full-body-rig/master-director/review/
          cp work/full-body-rig/master-director/master-director-render-qa.json work/full-body-rig/master-director/review/

      - name: Upload story-depth review evidence only
        uses: actions/upload-artifact@v4
        with:
          name: master-director-story-depth-preview-${{ github.run_number }}
          path: |
            work/full-body-rig/master-director/full-body-master-director-mixed.mp4
            work/full-body-rig/master-director/review/eight-shot-contact-sheet.jpg
            work/full-body-rig/master-director/review/project.json
            work/full-body-rig/master-director/review/motion-report.json
            work/full-body-rig/master-director/review/master-director-render-qa.json
            work/full-body-rig/master-director/character-rig-manifest.sha256
          if-no-files-found: error
          retention-days: 7
