name: Violin Prince Real-track Motion Validation

on:
  push:
    branches:
      - prototype/motion-hyperframes-2026-11-15
    paths:
      - ".github/workflows/motion-real-track-validation.yml"
      - "autopilot/engine/motion_real_track_validation.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: violin-prince-real-track-validation
  cancel-in-progress: false

jobs:
  real-track-render:
    name: Render private creator recording with publishing disabled
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      AUTOPILOT_API_URL: ${{ secrets.AUTOPILOT_API_URL }}
      AUTOPILOT_JOB_TOKEN: ${{ secrets.AUTOPILOT_JOB_TOKEN }}
      MOTION_HYPERFRAMES_RENDER_ENABLED: "true"
      BLENDER_RENDER_ENABLED: "false"
      PUBLISH_ENABLED: "false"
      YOUTUBE_PUBLISH_ENABLED: "false"
      HYPERFRAMES_NO_TELEMETRY: "1"
      CI: "true"

    steps:
      - name: Check out the draft integration branch
        uses: actions/checkout@v4

      - name: Enforce private real-audio and no-publishing boundaries
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$MOTION_HYPERFRAMES_RENDER_ENABLED" == "true" ]]
          [[ "$BLENDER_RENDER_ENABLED" == "false" ]]
          [[ "$PUBLISH_ENABLED" == "false" ]]
          [[ "$YOUTUBE_PUBLISH_ENABLED" == "false" ]]
          [[ -n "$AUTOPILOT_API_URL" ]] || { echo "::error::AUTOPILOT_API_URL secret is missing."; exit 1; }
          [[ -n "$AUTOPILOT_JOB_TOKEN" ]] || { echo "::error::AUTOPILOT_JOB_TOKEN secret is missing."; exit 1; }
          [[ "$AUTOPILOT_API_URL" == https://* ]] || { echo "::error::Private asset API must use HTTPS."; exit 1; }
          echo "Real creator audio is required. Generated fallback audio, storage upload and publishing are disabled."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Autopilot Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r autopilot/engine/requirements.txt

      - name: Install pinned Motion + HyperFrames dependencies
        working-directory: prototypes/hyperframes-motion
        run: npm install --no-audit --no-fund

      - name: Retrieve real creator recording and render full track
        run: python autopilot/engine/motion_real_track_validation.py

      - name: Upload finished MP4 and QA reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: violin-prince-real-track-validation-${{ github.run_id }}
          path: |
            work/output/violin-prince-full-track.mp4
            work/output/motion-contact-sheet.jpg
            work/output/motion-hyperframes-check.json
            work/output/motion-seeking-report.json
            work/output/real-track-validation-report.json
          if-no-files-found: warn
          retention-days: 3

      - name: Write validation summary
        if: always()
        shell: bash
        run: |
          if [[ -f work/output/real-track-validation-report.json ]]; then
            python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("work/output/real-track-validation-report.json").read_text(encoding="utf-8"))
          source = report.get("source_audio") or {}
          render = report.get("render") or {}
          print("## Violin Prince real-track validation")
          print()
          print("- Status: " + str(report.get("status", "unknown")))
          if source:
              print("- Source: " + str(source.get("filename", "creator recording")))
              print("- Source duration: " + str(source.get("source_duration_seconds", "unknown")) + " seconds")
              print("- Source codec: " + str(source.get("source_codec", "unknown")))
          if render:
              print("- Render duration: " + str(render.get("duration_seconds", "unknown")) + " seconds")
              print("- Output: " + str(render.get("width", "?")) + "x" + str(render.get("height", "?")) + " at " + str(render.get("fps", "?")) + " fps")
              print("- Audio included: " + str(render.get("audio_included", False)))
          print("- Publishing: disabled")
          print("- Storage upload: not called")
          PY
          else
            echo "## Violin Prince real-track validation"
            echo
            echo "Validation did not produce a report. Inspect the retrieve/render step logs."
          fi

      - name: Remove private audio and temporary renderer files
        if: always()
        shell: bash
        run: |
          rm -rf work/real-track-render-work
          find prototypes/hyperframes-motion -maxdepth 2 -type d -name output -prune -exec rm -rf {} +
          rm -f prototypes/hyperframes-motion/index.html
