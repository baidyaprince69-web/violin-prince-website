name: Violin Prince Blender proof shot

on:
  push:
    branches:
      - feature/blender-3d-overlays
    paths:
      - ".github/workflows/blender-proof-shot.yml"
      - ".autopilot/first-production-story.json"
      - "autopilot/engine/asset_resolver.py"
      - "autopilot/engine/story_asset_resolver.py"
      - "autopilot/engine/first_production_blender.py"
      - "autopilot/engine/tests/test_asset_resolver.py"
      - "autopilot/engine/tests/test_story_asset_resolver.py"
  workflow_dispatch:
    inputs:
      render_proof:
        description: Render the 4.6-second 115-frame violin proof. Leave disabled for code checks.
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: violin-prince-blender-proof-shot-segmented
  cancel-in-progress: false

jobs:
  resolve-story-model:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.render_proof == true) || (github.event_name == 'push' && github.event.head_commit.message == 'VIOLIN_PRINCE_REVIEW_PROOF_PARALLEL_ONCE') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SKETCHFAB_ACCESS_TOKEN: ${{ secrets.SKETCHFAB_ACCESS_TOKEN }}
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v4

      - name: Require the official Sketchfab download credential
        shell: bash
        run: |
          if [ -z "$SKETCHFAB_ACCESS_TOKEN" ]; then
            echo "::error::SKETCHFAB_ACCESS_TOKEN is not configured. Add the official Sketchfab API access token as a repository Actions secret. No reference image or placeholder model will be used."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Search, rank, download and validate the story-specific model
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          python -m pip install "requests>=2.32,<3"
          mkdir -p work/first-production/assets
          python autopilot/engine/story_asset_resolver.py             --plan .autopilot/first-production-story.json             --output-dir work/first-production/assets/story-selected             | tee work/first-production/asset-resolution.json
          python - <<'PY'
          import hashlib
          import json
          import shutil
          from pathlib import Path

          root = Path("work/first-production")
          asset = json.loads((root / "asset-resolution.json").read_text(encoding="utf-8"))
          original = Path(asset["local_model_path"])
          assert original.is_file(), "The authenticated download returned no real violin model file."
          assert original.suffix.lower() in {".glb", ".gltf"}
          assert asset.get("commercial_use_allowed") is True
          parts = asset.get("model_parts") or {}
          assert parts.get("strings") or asset.get("strings_in_combined_mesh"), (
              "No verified violin string geometry was identified."
          )

          bow = asset.get("bow_model")
          assert bow, "The actual separate bow model was not downloaded."
          bow_original = Path(bow["local_model_path"])
          assert bow_original.is_file(), "The authenticated download returned no real bow model file."
          assert bow_original.suffix.lower() in {".glb", ".gltf"}
          assert bow.get("commercial_use_allowed") is True
          assert bow.get("is_downloadable") is True

          selected_dir = root / "assets" / "selected-model"
          shutil.copytree(original.parent, selected_dir, dirs_exist_ok=True)
          selected = selected_dir / original.name
          assert selected.is_file() and int(asset.get("package_size_bytes", 0)) >= 4096
          if selected.suffix.lower() == ".glb":
              assert selected.read_bytes()[:4] == b"glTF"

          bow_selected_dir = selected_dir / "bow"
          shutil.copytree(bow_original.parent, bow_selected_dir, dirs_exist_ok=True)
          bow_selected = bow_selected_dir / bow_original.name
          assert bow_selected.is_file() and int(bow.get("package_size_bytes", 0)) >= 4096
          if bow_selected.suffix.lower() == ".glb":
              assert bow_selected.read_bytes()[:4] == b"glTF"

          relative = "assets/selected-model/" + selected.name
          bow_relative = "assets/selected-model/bow/" + bow_selected.name
          asset["local_model_path"] = relative
          asset["model_relative_path"] = relative
          asset["sha256"] = hashlib.sha256(selected.read_bytes()).hexdigest()
          bow["local_model_path"] = bow_relative
          bow["model_relative_path"] = bow_relative
          bow["sha256"] = hashlib.sha256(bow_selected.read_bytes()).hexdigest()
          asset["bow_model_relative_path"] = bow_relative
          asset["asset_selection_policy"] = (
              "story-aware selection; CC0/CC-BY licensing; genuine downloaded violin plus "
              "genuine separately downloaded bow meshes; one Blender bow rig; no placeholder model"
          )
          asset["manifest_path"] = "assets/asset-provenance.json"
          (root / "assets" / "model-path.txt").write_text(relative + "\n", encoding="utf-8")
          (root / "assets" / "bow-model-path.txt").write_text(bow_relative + "\n", encoding="utf-8")
          (root / "assets" / "asset-provenance.json").write_text(
              json.dumps(asset, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          (root / "asset-resolution.json").write_text(
              json.dumps(asset, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps({
              "provider": asset.get("provider"),
              "model": asset.get("model_name"),
              "creator": asset.get("creator"),
              "license": asset.get("license_label"),
              "bow_model": bow.get("model_name"),
              "bow_creator": bow.get("creator"),
              "bow_license": bow.get("license_label"),
              "bow_mesh_nodes": len((bow.get("model_parts") or {}).get("mesh_nodes", [])),
              "string_mesh_nodes": len(parts.get("strings", [])),
              "strings_integrated_into_violin_geometry": asset.get("strings_in_combined_mesh") is True,
              "model_file": relative,
              "bow_model_file": bow_relative,
              "sha256": asset["sha256"],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Upload the actual model and its licence manifest
        uses: actions/upload-artifact@v4
        with:
          name: violin-prince-proof-model
          path: |
            work/first-production/assets/**
            work/first-production/asset-resolution.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload model-resolution diagnostics even when selection fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: violin-prince-model-resolution-diagnostics
          path: work/first-production/assets/story-selected/asset-resolution-diagnostic.json
          if-no-files-found: ignore
          retention-days: 7

  produce-audio:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.render_proof == true) || (github.event_name == 'push' && github.event.head_commit.message == 'VIOLIN_PRINCE_REVIEW_PROOF_PARALLEL_ONCE') }}
    needs: [resolve-story-model]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26,<3" "soundfile>=0.12,<1" "requests>=2.32,<3"

      - name: Install the free CPU Kokoro speech runtime
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install "kokoro>=0.9.4,<1"

      - name: Create full-timeline voice, violin music, word timings and captions
        run: |
          mkdir -p work/first-production
          python autopilot/engine/first_production_audio.py work/first-production
          test -s work/first-production/narration.wav
          test -s work/first-production/cc0-violin-music.wav
          test -s work/first-production/final-audio-mix.wav
          test -s work/first-production/captions.ass
          test -s work/first-production/word-timing.json
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("work/first-production")
          report = json.loads((root / "audio-report.json").read_text(encoding="utf-8"))
          assert 21.5 <= report["narration"]["duration_seconds"] <= 22.4
          assert report["music"]["duration_seconds"] >= 23.95
          assert report["final_mix"]["duration_seconds"] >= 23.90
          ass = (root / "captions.ass").read_text(encoding="utf-8")
          assert "\\k" in ass, "ASS file does not contain karaoke word-highlighting tags."
          print(json.dumps({
              "narration_seconds": report["narration"]["duration_seconds"],
              "narration_words": report["narration"]["word_count"],
              "native_word_timings": report["narration"]["word_timing_count"],
              "music_seconds": report["music"]["duration_seconds"],
              "mix_seconds": report["final_mix"]["duration_seconds"],
              "captions": "word-synchronised ASS karaoke",
          }, indent=2))
          PY

      - name: Upload audio proof stems
        uses: actions/upload-artifact@v4
        with:
          name: violin-prince-proof-audio
          path: work/first-production/*
          if-no-files-found: error
          retention-days: 7

  render-proof-frames:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.render_proof == true) || (github.event_name == 'push' && github.event.head_commit.message == 'VIOLIN_PRINCE_REVIEW_PROOF_PARALLEL_ONCE') }}
    needs: [resolve-story-model, produce-audio]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        segment: [0, 1, 2, 3, 4]
    env:
      EGL_PLATFORM: surfaceless
      LIBGL_ALWAYS_SOFTWARE: "1"
      MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
      PYTHONUNBUFFERED: "1"
      SEGMENT: ${{ matrix.segment }}
    steps:
      - name: Check out the proof renderer
        uses: actions/checkout@v4

      - name: Download the story-selected violin and bow
        uses: actions/download-artifact@v4
        with:
          name: violin-prince-proof-model
          path: work/first-production

      - name: Download narration, violin music and captions
        uses: actions/download-artifact@v4
        with:
          name: violin-prince-proof-audio
          path: work/first-production

      - name: Set up Python for cinematic background generation
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned Blender 5.2.4 LTS and Frame By Plane 8.0.1
        uses: ./.github/actions/setup-blender-frame-by-plane

      - name: Install the background plate generator
        run: python -m pip install "Pillow>=10,<13"

      - name: Generate the same story background on this worker
        run: |
          set -Eeuo pipefail
          python autopilot/engine/cinematic_background.py \
            --plan .autopilot/first-production-story.json \
            --output-dir work/first-production/cinematic-background

      - name: Render this worker's 23-frame Blender segment
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m py_compile autopilot/engine/first_production_blender.py
          mkdir -p work/proof-frames work/proof-reports
          MODEL_RELATIVE="$(cat work/first-production/assets/model-path.txt)"
          MODEL_PATH="work/first-production/$MODEL_RELATIVE"
          BOW_MODEL_RELATIVE="$(cat work/first-production/assets/bow-model-path.txt)"
          BOW_MODEL_PATH="work/first-production/$BOW_MODEL_RELATIVE"
          BACKGROUND_MANIFEST="work/first-production/cinematic-background/background-manifest.json"
          test -s "$MODEL_PATH"
          test -s "$BOW_MODEL_PATH"
          test -s "$BACKGROUND_MANIFEST"
          blender --background \
            --python autopilot/engine/first_production_blender.py \
            -- \
            --model "$MODEL_PATH" \
            --bow-model "$BOW_MODEL_PATH" \
            --strings-in-instrument \
            --background-manifest "$BACKGROUND_MANIFEST" \
            --report "work/proof-reports/segment-${SEGMENT}.json" \
            --width 1080 --height 1920 --fps 25 --duration 4.6 \
            --render-samples 64 \
            --sample-index "$SEGMENT" --sample-count 23 --total-samples 115 \
            --frames-dir work/proof-frames \
            --project-path work/Violin-Prince-Proof.blend \
            --proof-shot
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          segment = int(os.environ["SEGMENT"])
          report = json.loads(
              Path(f"work/proof-reports/segment-{segment}.json").read_text(encoding="utf-8")
          )
          assert report["proof_shot_only"] is True
          assert report["duration_seconds"] == 4.6
          assert report["sample_count"] == 23
          assert report["total_samples"] == 115
          assert report["sample_index"] == segment
          assert report["sample_start"] == segment * 23
          assert report["sample_end_exclusive"] == (segment + 1) * 23
          assert report["resolution"] == [1080, 1920]
          assert report["actual_imported_mesh_count"] >= 3
          assert report["bow_rig_count"] == 1
          assert report["source_bow_meshes_rigged"] >= 1
          assert report["visible_bow_mesh_count"] == report["source_bow_meshes_rigged"]
          assert report["source_string_meshes"] >= 1 or report["strings_embedded_in_instrument"] is True
          assert report["bow_geometry_source"] == "separate licensed imported bow GLB/glTF"
          assert report["render_architecture"] == "hybrid_2.5D_plus_real_3D"
          assert report["frame_by_plane"]["enabled"] is True
          assert report["frame_by_plane"]["extension_version"] == "8.0.1"
          assert report["frame_by_plane"]["layer_count"] == 3
          assert report["motion_graphics"]["progress_bar"] is True
          assert len(report["samples"]) == 23
          for item in report["samples"]:
              frame = Path(item["file"])
              assert frame.is_file() and frame.stat().st_size > 1024
          print(json.dumps({
              "worker": segment,
              "rendered_frames": len(report["samples"]),
              "global_frame_range": [report["sample_start"], report["sample_end_exclusive"] - 1],
              "resolution": report["resolution"],
              "blender_workers": 5,
              "full_600_frame_render": "NOT RUN",
          }, indent=2))
          PY

      - name: Upload this worker's frames and segment report
        uses: actions/upload-artifact@v4
        with:
          name: violin-prince-proof-frames-${{ matrix.segment }}
          path: |
            work/proof-frames/
            work/proof-reports/segment-${{ matrix.segment }}.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload the editable Blender project from worker zero
        if: matrix.segment == 0
        uses: actions/upload-artifact@v4
        with:
          name: violin-prince-proof-project
          path: work/Violin-Prince-Proof.blend
          if-no-files-found: error
          retention-days: 30

  assemble-proof:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.render_proof == true) || (github.event_name == 'push' && github.event.head_commit.message == 'VIOLIN_PRINCE_REVIEW_PROOF_PARALLEL_ONCE') }}
    needs: [resolve-story-model, produce-audio, render-proof-frames]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out proof assembly code
        uses: actions/checkout@v4

      - name: Download the story-selected violin and bow
        uses: actions/download-artifact@v4
        with:
          name: violin-prince-proof-model
          path: work/first-production

      - name: Download narration, violin music and captions
        uses: actions/download-artifact@v4
        with:
          name: violin-prince-proof-audio
          path: work/first-production

      - name: Download all five parallel Blender frame segments
        uses: actions/download-artifact@v4
        with:
          pattern: violin-prince-proof-frames-*
          path: work
          merge-multiple: true

      - name: Download the editable Blender project
        uses: actions/download-artifact@v4
        with:
          name: violin-prince-proof-project
          path: work

      - name: Set up Python for proof report assembly
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the cinematic background generator
        run: python -m pip install "Pillow>=10,<13"

      - name: Recreate the story background plates for the final deliverable
        run: |
          python autopilot/engine/cinematic_background.py \
            --plan .autopilot/first-production-story.json \
            --output-dir work/first-production/cinematic-background

      - name: Verify and assemble all 115 rendered frames
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path

          root = Path("work")
          frames_dir = root / "proof-frames"
          reports_dir = root / "proof-reports"
          reports_dir.mkdir(parents=True, exist_ok=True)
          all_samples = []
          segment_summaries = []
          reports = []

          for segment in range(5):
              report_path = reports_dir / f"segment-{segment}.json"
              assert report_path.is_file(), f"Missing worker report {segment}"
              report = json.loads(report_path.read_text(encoding="utf-8"))
              assert report["sample_index"] == segment
              assert report["sample_count"] == 23
              assert report["total_samples"] == 115
              assert report["sample_start"] == segment * 23
              assert report["sample_end_exclusive"] == (segment + 1) * 23
              assert report["frame_by_plane"]["enabled"] is True
              assert report["frame_by_plane"]["layer_count"] == 3
              assert report["render_architecture"] == "hybrid_2.5D_plus_real_3D"
              assert report["bow_rig_count"] == 1
              assert report["source_bow_meshes_rigged"] >= 1
              assert report["bow_geometry_source"] == "separate licensed imported bow GLB/glTF"
              assert len(report["samples"]) == 23
              reports.append(report)
              all_samples.extend(report["samples"])
              segment_summaries.append({
                  "worker": segment,
                  "sample_start": report["sample_start"],
                  "sample_end_exclusive": report["sample_end_exclusive"],
                  "frames": report["sample_count"],
              })

          all_samples.sort(key=lambda item: int(item["sample_index"]))
          indexes = [int(item["sample_index"]) for item in all_samples]
          assert indexes == list(range(115)), f"Frame index gap or duplicate: {indexes}"
          expected_files = [frames_dir / f"frame_{index:04d}.png" for index in range(115)]
          missing = [str(path) for path in expected_files if not path.is_file()]
          assert not missing, f"Missing rendered frame files: {missing[:10]}"
          assert all(path.stat().st_size > 1024 for path in expected_files)

          merged = dict(reports[0])
          merged.update({
              "sample_index": 0,
              "sample_start": 0,
              "sample_end_exclusive": 115,
              "sample_count": 115,
              "total_samples": 115,
              "samples": all_samples,
              "render_worker_count": 5,
              "render_segments": segment_summaries,
              "blend_project": "work/Violin-Prince-Proof.blend",
          })
          (reports_dir / "proof-shot.json").write_text(
              json.dumps(merged, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          project = root / "Violin-Prince-Proof.blend"
          assert project.is_file() and project.stat().st_size > 1024
          shutil.copy2(project, root / "first-production" / "Violin-Prince-Proof.blend")
          print(json.dumps({
              "status": "all_parallel_segments_verified",
              "render_workers": 5,
              "frames": len(all_samples),
              "resolution": merged["resolution"],
              "worker_segments": segment_summaries,
              "frame_by_plane_layers": merged["frame_by_plane"]["layer_count"],
              "full_600_frame_render": "NOT RUN",
          }, indent=2))
          PY

      - name: Install FFmpeg for proof assembly
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Encode parallel Blender frames with narration, violin music and karaoke captions
        shell: bash
        run: |
          set -Eeuo pipefail
          ffmpeg -y -hide_banner -loglevel error \
            -framerate 25 -start_number 0 \
            -i work/proof-frames/frame_%04d.png \
            -frames:v 115 -vf "format=yuv420p" \
            -an -c:v libx264 -preset fast -crf 17 \
            -r 25 -fps_mode cfr -movflags +faststart \
            work/first-production/blender-proof-picture.mp4
          ffmpeg -y -hide_banner -loglevel error \
            -i work/first-production/blender-proof-picture.mp4 \
            -i work/first-production/final-audio-mix.wav \
            -vf "subtitles=work/first-production/captions.ass" \
            -map 0:v:0 -map 1:a:0 \
            -frames:v 115 -t 4.6 \
            -c:v libx264 -preset fast -crf 17 -pix_fmt yuv420p \
            -r 25 -fps_mode cfr \
            -c:a aac -b:a 192k -ar 48000 -ac 2 \
            -movflags +faststart \
            work/first-production/Violin-Prince-4.6s-Proof.mp4
          test -s work/first-production/Violin-Prince-4.6s-Proof.mp4

      - name: Verify final proof duration, all 115 frames, sound and caption timing
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          root = Path("work/first-production")
          video = root / "Violin-Prince-4.6s-Proof.mp4"
          probe = json.loads(subprocess.check_output([
              "ffprobe", "-v", "error", "-count_frames",
              "-show_streams", "-show_format", "-of", "json", str(video)
          ], text=True))
          picture = next(item for item in probe["streams"] if item.get("codec_type") == "video")
          sound = next(item for item in probe["streams"] if item.get("codec_type") == "audio")
          duration = float(probe["format"]["duration"])
          frames = int(picture.get("nb_read_frames", picture.get("nb_frames", 0)))
          assert (picture["width"], picture["height"]) == (1080, 1920)
          assert picture.get("r_frame_rate") == "25/1"
          assert frames == 115
          assert sound["codec_name"] == "aac" and sound["channels"] == 2
          assert 4.5 <= duration <= 4.7
          audio = json.loads((root / "audio-report.json").read_text(encoding="utf-8"))
          asset = json.loads((root / "assets" / "asset-provenance.json").read_text(encoding="utf-8"))
          render = json.loads((Path("work/proof-reports/proof-shot.json")).read_text(encoding="utf-8"))
          report = {
              "status": "proof_render_complete",
              "duration_seconds": duration,
              "resolution": [picture["width"], picture["height"]],
              "fps": picture["r_frame_rate"],
              "frames": frames,
              "render_worker_count": render["render_worker_count"],
              "render_segments": render["render_segments"],
              "bow_rig_count": render["bow_rig_count"],
              "render_architecture": render["render_architecture"],
              "frame_by_plane": render["frame_by_plane"],
              "model_name": asset.get("model_name"),
              "model_creator": asset.get("creator"),
              "model_license": asset.get("license_label"),
              "strings_integrated_into_violin_geometry": asset.get("strings_in_combined_mesh") is True,
              "bow_model_name": (asset.get("bow_model") or {}).get("model_name"),
              "bow_creator": (asset.get("bow_model") or {}).get("creator"),
              "bow_license": (asset.get("bow_model") or {}).get("license_label"),
              "narration_seconds": audio["narration"]["duration_seconds"],
              "music_seconds": audio["music"]["duration_seconds"],
              "music_and_voice_included_from_video_start": True,
              "captions": "burned-in word-synchronised ASS karaoke",
              "full_600_frame_render": "NOT RUN",
              "publishing": "NOT PUBLISHED",
          }
          (root / "proof-report.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
          ffmpeg -y -hide_banner -loglevel error \
            -ss 1.6 -i work/first-production/Violin-Prince-4.6s-Proof.mp4 \
            -frames:v 1 work/first-production/proof-frame.jpg

      - name: Upload the 4.6-second proof and editable Blender project for visual review
        uses: actions/upload-artifact@v4
        with:
          name: violin-prince-4.6s-blender-proof
          path: |
            work/first-production/Violin-Prince-4.6s-Proof.mp4
            work/first-production/proof-frame.jpg
            work/first-production/proof-report.json
            work/first-production/Violin-Prince-Proof.blend
            work/first-production/cinematic-background/**
            work/first-production/assets/**
            work/first-production/audio-report.json
            work/first-production/storyboard.json
          if-no-files-found: error
          retention-days: 30

      - name: Confirm that only the segmented short proof was rendered
        if: success()
        run: |
          {
            echo "## Parallel Blender proof shot complete — full production still locked"
            echo
            echo "- Proof: 4.6 seconds, 115 Blender frames at native 1080×1920 / 25 FPS"
            echo "- Rendering: five parallel Blender workers, 23 frames per worker"
            echo "- Model: downloaded violin geometry with visible integrated strings, plus a separate licensed bow mesh"
            echo "- Background: Frame By Plane 8.0.1 multiplane layers behind the real 3D instrument"
            echo "- Rig: one animated control rig over the imported bow mesh components"
            echo "- Layout: Violin Prince brand, story title, progress motion graphic and lower karaoke caption band"
            echo "- Audio: narration and violin music begin with the picture; the proof contains the opening 4.6 seconds"
            echo "- Full 600-frame render: NOT RUN"
            echo "- Publishing: disabled"
          } >> "$GITHUB_STEP_SUMMARY"
