name: Validate Violin Prince Autopilot

on:
  push:
    branches: [main]
    paths:
      - "autopilot/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "autopilot/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python engine
        run: python -m compileall -q autopilot/engine

      - name: Validate D1 schema and synthetic audio
        run: |
          python - <<'PY'
          import sqlite3
          import sys
          import tempfile
          import wave
          from pathlib import Path

          root = Path(".")
          connection = sqlite3.connect(":memory:")
          connection.executescript((root / "autopilot/cloudflare/schema.sql").read_text())
          sys.path.insert(0, str(root / "autopilot/engine"))
          from synth_audio import create_original_soundtrack

          with tempfile.TemporaryDirectory() as temp:
              output = Path(temp) / "original.wav"
              create_original_soundtrack(output, "validation-run")
              with wave.open(str(output), "rb") as audio:
                  assert audio.getnchannels() == 2
                  assert audio.getframerate() == 22050
                  assert audio.getnframes() == 22050 * 24
          print("D1 schema and 24-second synthetic soundtrack passed.")
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Cloudflare provisioning script
        run: node --check autopilot/scripts/provision-cloudflare.mjs

      - name: Check Worker JavaScript
        run: |
          cp autopilot/cloudflare/src/worker.js /tmp/worker.mjs
          node --check /tmp/worker.mjs

      - name: Check dashboard JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("autopilot/index.html").read_text()
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
          if not scripts:
              raise SystemExit("No inline dashboard script found")
          Path("/tmp/dashboard.js").write_text("\n".join(scripts))
          PY
          node --check /tmp/dashboard.js

      - name: Validate GitHub Actions workflow YAML
        run: ruby -e 'require "yaml"; ARGV.each { |file| YAML.parse_file(file); puts "#{file}: YAML syntax OK" }' .github/workflows/violin-prince-autopilot.yml .github/workflows/deploy-autopilot-cloudflare.yml .github/workflows/autopilot-validation.yml

      - name: Check key workflow files exist
        run: |
          test -f .github/workflows/violin-prince-autopilot.yml
          test -f .github/workflows/deploy-autopilot-cloudflare.yml
          test -f autopilot/cloudflare/wrangler.toml
          test -f autopilot/cloudflare/schema.sql
