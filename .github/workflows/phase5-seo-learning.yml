name: Phase 5 scheduled YouTube SEO learning

on:
  schedule:
    # Weekly, not continuous polling. Monday 03:00 UTC = 08:30 India time.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase5-youtube-seo-learning
  cancel-in-progress: false

jobs:
  collect-and-learn:
    name: Collect one bounded channel report and update SEO signals
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_STATE_ENCRYPTION_KEY: ${{ secrets.YOUTUBE_STATE_ENCRYPTION_KEY }}
      SEO_LEARNING_OUTPUT_PATH: work/seo-learning/latest.enc.json
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the report collector dependency
        run: |
          python -m pip install --upgrade pip
          pip install "requests>=2.32,<3" "cryptography>=43,<48"

      - name: Compile SEO engine and report collector
        run: |
          python -m py_compile autopilot/engine/analytics.py autopilot/engine/seo_intelligence/*.py

      - name: Collect bounded reports and write encrypted SEO-only learning
        run: python autopilot/engine/analytics.py

      - name: Check out the encrypted learning-data branch
        uses: actions/checkout@v4
        with:
          ref: seo-learning-data
          path: seo-learning-data
          persist-credentials: true
          token: ${{ github.token }}

      - name: Publish the encrypted SEO snapshot
        shell: bash
        run: |
          set -euo pipefail
          test -s "$SEO_LEARNING_OUTPUT_PATH"
          mkdir -p seo-learning-data/seo-learning
          install -m 600 "$SEO_LEARNING_OUTPUT_PATH" seo-learning-data/seo-learning/latest.enc.json
          cd seo-learning-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seo-learning/latest.enc.json
          if git diff --cached --quiet; then
            echo "Encrypted SEO snapshot is unchanged; no commit is needed."
          else
            git commit -m "Update encrypted YouTube SEO learning snapshot"
            git push origin HEAD:refs/heads/seo-learning-data
            echo "Encrypted SEO snapshot committed to seo-learning-data."
          fi
          {
            echo "## SEO learning storage"
            echo '- Storage: GitHub branch `seo-learning-data`'
            echo "- Encryption: AES-256-GCM"
            echo "- Plaintext channel analytics persisted: no"
            echo "- Cloudflare dependency: none for this workflow"
          } >> "$GITHUB_STEP_SUMMARY"
