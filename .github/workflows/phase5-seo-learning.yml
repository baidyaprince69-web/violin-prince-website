name: Phase 5 scheduled YouTube SEO learning

on:
  schedule:
    # Weekly, not continuous polling. Monday 03:00 UTC = 08:30 India time.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase5-youtube-seo-learning
  cancel-in-progress: false

jobs:
  collect-and-learn:
    name: Collect one bounded channel report and update SEO signals
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AUTOPILOT_API_URL: ${{ secrets.AUTOPILOT_API_URL }}
      AUTOPILOT_JOB_TOKEN: ${{ secrets.AUTOPILOT_JOB_TOKEN }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the report collector dependency
        run: |
          python -m pip install --upgrade pip
          pip install "requests>=2.32,<3"

      - name: Compile SEO engine and report collector
        run: |
          python -m py_compile autopilot/engine/analytics.py autopilot/engine/seo_intelligence/*.py

      - name: Collect reports and calculate SEO-only learning
        run: python autopilot/engine/analytics.py
