name: Violin Prince Narrated Explainer Prototype

on:
  push:
    branches:
      - prototype/motion-hyperframes-2026-11-15
    paths:
      - ".github/workflows/hyperframes-motion-prototype.yml"
      - ".github/workflows/violin-prince-autopilot.yml"
      - ".github/workflows/autopilot-checks.yml"
      - "autopilot/engine/run.py"
      - "autopilot/engine/motion_hyperframes_renderer.py"
      - "autopilot/engine/tests/test_motion_hyperframes_renderer.py"
      - "autopilot/engine/run_daily_plan.py"
      - "prototypes/hyperframes-motion/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: violin-prince-motion-prototype-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render Kokoro-narrated Motion + HyperFrames explainer
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PUBLISH_ENABLED: "false"
      YOUTUBE_PUBLISH_ENABLED: "false"
      CI: "true"
      HYPERFRAMES_NO_TELEMETRY: "1"
    defaults:
      run:
        working-directory: prototypes/hyperframes-motion
    steps:
      - name: Check out isolated prototype branch
        uses: actions/checkout@v4

      - name: Enforce the no-publishing boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$PUBLISH_ENABLED" == "false" ]]
          [[ "$YOUTUBE_PUBLISH_ENABLED" == "false" ]]
          echo "Publishing is disabled. No YouTube upload step or publishing credentials are configured."

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Set up Python for the existing violin sampler
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache Kokoro model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-v1-cache

      - name: Install sampler and Kokoro CPU dependencies
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r autopilot/engine/requirements.txt

      - name: Cache the existing CC0 violin sample bank
        uses: actions/cache@v4
        with:
          path: ~/.cache/violin-prince/cc0-solo-violin-v1
          key: violin-prince-cc0-solo-violin-v1

      - name: Install prototype dependencies
        run: npm install --no-audit --no-fund

      - name: Validate the native 2D illustration modules
        run: |
          node --check src/main.js
          node --check src/illustrations.js
          node --check src/motion-timeline.js
          ! grep -Fq 'from "motion"' src/main.js
          ! grep -Fq 'window.__timelines' src/main.js
          grep -Fq 'from "motion"' src/motion-timeline.js
          grep -Fq 'window.__timelines = window.__timelines || {}' index.template.html.in

      - name: Validate the saved five-scene production storyboard
        working-directory: .
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          plan = json.loads(Path(".autopilot/daily-production-plan.json").read_text(encoding="utf-8"))
          scenes = plan.get("scenes", [])
          expected = ["room_acoustics", "audio_interface", "roomtune_process", "dsp_stages", "violin_performance_2d"]
          actual = [scene.get("graphic_data", {}).get("type") for scene in scenes]
          indices = [scene.get("sentence_index") for scene in scenes]
          if actual != expected or indices != [0, 1, 2, 3, 4]:
              raise SystemExit("The saved daily plan must contain all five portrait scene types in narration order.")
          if len(plan.get("narration_script", "").split(". ")) < 5:
              raise SystemExit("The saved daily plan must carry the five-beat narration script.")
          print("Saved RoomTune storyboard: five portrait scenes in sentence order.")
          PY

      - name: Generate a 37.5-second violin track with the repository's existing sampler
        working-directory: .
        run: |
          mkdir -p prototypes/hyperframes-motion/output
          python - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, "autopilot/engine")
          from violin_sampler import create_sampled_violin_bed

          target = Path("prototypes/hyperframes-motion/output/duration-test.wav")
          path, report = create_sampled_violin_bed(
              target,
              seed_text="violin-prince-motion-ci:existing-sampled-instrument",
              duration_seconds=37.5,
          )
          print("Generated the CI source using the repository's existing CC0 violin sampler.")
          print(report)
          if report.get("audio_source") != "sampled_violin_cc0":
              raise SystemExit("The test audio was not created by the sampled violin instrument.")
          if abs(float(report.get("duration_seconds", 0)) - 37.5) > 0.01:
              raise SystemExit("The generated violin track does not cover 37.5 seconds.")
          PY
          ffprobe -v error -select_streams a:0 -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 prototypes/hyperframes-motion/output/duration-test.wav

      - name: Generate actual Kokoro af_heart narration for the explainer fixture
        working-directory: .
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, "autopilot/engine")
          from voiceover import synthesize_voiceover

          script = (
              "Your room can quietly mislead your mix. "
              "The audio interface combines console-style preamps with onboard digital processing. "
              "RoomTune sends a measurement signal through the room, analyses the response, and corrects monitor playback. "
              "The onboard DSP handles equalisation, compression, and reverb before the sound reaches your monitors. "
              "With the room corrected and processing under control, you can focus on the violin and trust what you hear."
          )
          output = Path("prototypes/hyperframes-motion/output")
          output.mkdir(parents=True, exist_ok=True)
          narration_path, narration_info = synthesize_voiceover(script, output / "narration.wav")
          if narration_info.get("engine") != "Kokoro-82M" or narration_info.get("voice") != "af_heart":
              raise SystemExit("Narration was not generated by Kokoro-82M af_heart.")
          if narration_info.get("word_sync_status") != "passed" or not narration_info.get("word_cues"):
              raise SystemExit("Kokoro native word-level timings did not pass validation.")
          (output / "narration-info.json").write_text(
              json.dumps(narration_info, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps({
              "engine": narration_info["engine"],
              "voice": narration_info["voice"],
              "duration_seconds": narration_info["duration_seconds"],
              "word_count": narration_info["word_count"],
              "word_timing_count": narration_info["word_timing_count"],
              "word_sync_status": narration_info["word_sync_status"],
          }, indent=2))
          PY

      - name: Render narrated explainer through the Autopilot Motion bridge
        working-directory: .
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, "autopilot/engine")
          from motion_hyperframes_renderer import render_full_track

          bed = Path("prototypes/hyperframes-motion/output/duration-test.wav")
          narration = Path("prototypes/hyperframes-motion/output/narration.wav")
          narration_info = json.loads(
              Path("prototypes/hyperframes-motion/output/narration-info.json").read_text(encoding="utf-8")
          )
          if not bed.is_file() or not narration.is_file():
              raise SystemExit("The CC0 violin bed or Kokoro narration fixture is missing.")
          plan = {
              "title": "Can Your Room Trick Your Violin Mix?",
              "topic": "Room correction and monitor DSP",
              "hook": "Your room can quietly mislead your mix.",
              "narration_script": (
                  "Your room can quietly mislead your mix. "
                  "The audio interface combines console-style preamps with onboard digital processing. "
                  "RoomTune sends a measurement signal through the room, analyses the response, and corrects monitor playback. "
                  "The onboard DSP handles equalisation, compression, and reverb before the sound reaches your monitors. "
                  "With the room corrected and processing under control, you can focus on the violin and trust what you hear."
              ),
              "scenes": [
                  {
                      "sentence_index": 0,
                      "caption": "YOUR ROOM CAN MISLEAD YOUR MIX",
                      "graphic_label": "SCENE 01 · THE LISTENING ROOM",
                      "graphic_detail": "Direct and reflected sound change what reaches the listening position",
                      "graphic_data": {"type": "room_acoustics", "items": []},
                  },
                  {
                      "sentence_index": 1,
                      "caption": "THE INTERFACE: PREAMPS + DSP",
                      "graphic_label": "SCENE 02 · THE AUDIO INTERFACE",
                      "graphic_detail": "Console-style preamps and onboard processing share one interface",
                      "graphic_data": {"type": "audio_interface", "items": []},
                  },
                  {
                      "sentence_index": 2,
                      "caption": "ROOMTUNE: MEASURE → CORRECT",
                      "graphic_label": "SCENE 03 · ROOMTUNE",
                      "graphic_detail": "Measure the room, analyse its response, and correct monitor playback",
                      "graphic_data": {"type": "roomtune_process", "items": []},
                  },
                  {
                      "sentence_index": 3,
                      "caption": "EQ · COMPRESSION · REVERB",
                      "graphic_label": "SCENE 04 · ONBOARD DSP",
                      "graphic_detail": "Three processing stages shape tone, dynamics, and space",
                      "graphic_data": {"type": "dsp_stages", "items": []},
                  },
                  {
                      "sentence_index": 4,
                      "caption": "HEAR THE VIOLIN. TRUST THE MIX.",
                      "graphic_label": "SCENE 05 · THE MUSICAL PAYOFF",
                      "graphic_detail": "A close-up illustrated violin performance brings the explanation back to music",
                      "visual_mode": "cover_performance",
                      "graphic_data": {"type": "violin_performance_2d", "items": []},
                  },
              ],
          }
          report = render_full_track(
              audio_bytes=bed.read_bytes(),
              audio_filename=bed.name,
              narration_bytes=narration.read_bytes(),
              narration_info=narration_info,
              output_path="work/output/violin-prince-explainer.mp4",
              work_dir="work/motion-hyperframes-bridge",
              plan=plan,
          )
          output = Path("work/output")
          output.mkdir(parents=True, exist_ok=True)
          if report.get("production_type") != "narrated_explainer":
              raise SystemExit("The renderer did not identify its output as narrated_explainer.")
          if report.get("primary_audio_source") != "Kokoro-82M" or report.get("narration_voice") != "af_heart":
              raise SystemExit("Kokoro af_heart is not recorded as primary narration.")
          if report.get("narration_word_sync_status") != "passed":
              raise SystemExit("Kokoro native word-synchronisation QA did not pass.")
          if int(report.get("narration_word_timing_count", 0)) < 30:
              raise SystemExit("The renderer did not retain the native Kokoro word timings.")
          if abs(float(report["duration_seconds"]) - float(narration_info["duration_seconds"])) > 0.30:
              raise SystemExit("The final MP4 duration does not match the Kokoro narration.")
          (output / "motion-render-report.json").write_text(
              json.dumps(report, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(report, indent=2))
          PY

      - name: Confirm the narrated-explainer bridge outputs
        if: always()
        run: |
          test -s ../../work/output/violin-prince-explainer.mp4
          test -s ../../work/output/motion-contact-sheet.jpg
          test -s ../../work/output/motion-phone-preview.jpg
          test -s ../../work/output/motion-seeking-report.json
          test -s ../../work/output/motion-render-report.json
          test -s ../../work/output/motion-hyperframes-check.json
          python - <<'PY'
          import json
          from pathlib import Path

          check = json.loads(Path("../../work/output/motion-hyperframes-check.json").read_text(encoding="utf-8"))
          report = json.loads(Path("../../work/output/motion-render-report.json").read_text(encoding="utf-8"))
          if int(report.get("storyboard_scene_count", 0)) != 5:
              raise SystemExit("The portrait storyboard must render all five narration-driven scenes.")
          if report.get("phone_preview_size") != "360x640":
              raise SystemExit("The phone preview must be generated at exactly 360x640.")
          for section_name in ("layout", "craft"):
              section = check.get(section_name, {})
              errors = int(section.get("errorCount", 0))
              warnings = int(section.get("warningCount", 0))
              if errors or warnings:
                  raise SystemExit(
                      f"{section_name} QA must be warning-free; "
                      f"found {errors} errors and {warnings} warnings."
                  )
          print("Safe-area layout and text-craft QA: passed with zero warnings.")
          PY

      - name: Upload narrated explainer MP4, contact sheet and QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: violin-prince-motion-explainer
          path: |
            work/output/violin-prince-explainer.mp4
            work/output/motion-contact-sheet.jpg
            work/output/motion-phone-preview.jpg
            work/output/motion-seeking-report.json
            work/output/motion-render-report.json
            work/output/motion-hyperframes-check.json
          if-no-files-found: warn
          retention-days: 7

      - name: Write render report
        if: always()
        shell: bash
        run: |
          {
            echo "## Violin Prince Kokoro Narrated Explainer Prototype"
            echo
            echo "- Branch: $GITHUB_REF_NAME"
            echo "- Publishing: disabled"
            echo "- Blender: not installed or invoked"
            if [[ -f ../../work/output/motion-render-report.json ]]; then
              python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("../../work/output/motion-render-report.json").read_text(encoding="utf-8"))
          print("- Source audio duration: " + str(report["source_duration_seconds"]) + " seconds")
          print("- Exported MP4 duration: " + str(report["duration_seconds"]) + " seconds")
          print("- Format: " + str(report["width"]) + "x" + str(report["height"]) + " at " + str(report["fps"]) + " fps")
          print("- Portrait storyboard scenes: " + str(report.get("storyboard_scene_count", 0)))
          print("- Phone review: 360x640 contact sheet and frame generated")
          print("- Audio included: " + str(report["audio_included"]))
          PY
            else
              echo "- Full-track render report: missing; inspect the bridge step above"
            fi
            if [[ -f ../../work/output/motion-seeking-report.json ]]; then
              echo "- Random-access seeking: verified"
            else
              echo "- Random-access seeking: not verified"
            fi
            if [[ -f ../../work/output/violin-prince-explainer.mp4 ]]; then
              echo "- MP4: narrated explainer generated by the Autopilot renderer bridge"
              echo "- Primary narration: Kokoro-82M af_heart"
            else
              echo "- MP4: not generated; inspect the narration and renderer steps above"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
