name: Violin Prince Motion Graphics Prototype

on:
  push:
    branches:
      - prototype/motion-hyperframes-2026-11-15
    paths:
      - ".github/workflows/hyperframes-motion-prototype.yml"
      - "prototypes/hyperframes-motion/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: violin-prince-motion-prototype-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render variable-duration Motion + HyperFrames sample
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PUBLISH_ENABLED: "false"
      YOUTUBE_PUBLISH_ENABLED: "false"
      CI: "true"
      HYPERFRAMES_NO_TELEMETRY: "1"
    defaults:
      run:
        working-directory: prototypes/hyperframes-motion
    steps:
      - name: Check out isolated prototype branch
        uses: actions/checkout@v4

      - name: Enforce the no-publishing boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$PUBLISH_ENABLED" == "false" ]]
          [[ "$YOUTUBE_PUBLISH_ENABLED" == "false" ]]
          echo "Publishing is disabled. No YouTube upload step or publishing credentials are configured."

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install prototype dependencies
        run: npm install --no-audit --no-fund

      - name: Create longer-than-10-second audio fixture
        run: |
          mkdir -p output
          ffmpeg -hide_banner -loglevel error \
            -f lavfi -i "sine=frequency=440:sample_rate=48000:duration=37.5" \
            -af "volume=0.12,afade=t=in:st=0:d=0.25,afade=t=out:st=35.5:d=2" \
            -c:a pcm_s16le output/duration-test.wav
          ffprobe -v error -select_streams a:0 -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 output/duration-test.wav

      - name: Build composition from the full audio duration
        run: npm run prepare:composition -- --audio output/duration-test.wav

      - name: Load Motion as a local external ES module
        run: npm run prepare:motion

      - name: Validate HyperFrames composition
        run: |
          npm run lint
          npm run check

      - name: Verify deterministic random-access seeking across the full track
        run: npm run verify:seeking

      - name: Render the complete audio track
        run: npm run render

      - name: Verify full-track MP4, audio, dimensions and codec
        run: npm run verify

      - name: Create contact sheet
        if: always()
        run: |
          if [[ -f output/violin-prince-motion-full-track.mp4 ]]; then
            ffmpeg -hide_banner -loglevel error \
              -i output/violin-prince-motion-full-track.mp4 \
              -vf "fps=1/6,scale=270:480,tile=3x2" \
              -frames:v 1 output/contact-sheet.jpg
          fi

      - name: Upload full-track MP4, contact sheet and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: violin-prince-motion-full-track
          path: |
            prototypes/hyperframes-motion/output/violin-prince-motion-full-track.mp4
            prototypes/hyperframes-motion/output/contact-sheet.jpg
            prototypes/hyperframes-motion/output/audio-manifest.json
            prototypes/hyperframes-motion/output/seeking-check/
          if-no-files-found: warn
          retention-days: 7

      - name: Write render report
        if: always()
        shell: bash
        run: |
          {
            echo "## Violin Prince Full-track Motion Prototype"
            echo
            echo "- Branch: $GITHUB_REF_NAME"
            echo "- Publishing: disabled"
            echo "- Blender: not installed or invoked"
            if [[ -f output/audio-manifest.json ]]; then
              python - <<'PY'
          import json
          with open("output/audio-manifest.json", encoding="utf-8") as f:
              m = json.load(f)
          print("- Source audio duration: " + str(m["source_duration_seconds"]) + " seconds")
          print("- Composition duration: " + str(m["composition_duration_seconds"]) + " seconds")
          PY
            fi
            if [[ -f output/seeking-check/seeking-report.json ]]; then
              echo "- Random-access seeking: verified"
            else
              echo "- Random-access seeking: not verified"
            fi
            if [[ -f output/violin-prince-motion-full-track.mp4 ]]; then
              echo "- MP4: generated"
              ffprobe -v error -show_entries format=duration \
                -of default=noprint_wrappers=1:nokey=1 \
                output/violin-prince-motion-full-track.mp4 | \
                awk '{ print "- MP4 duration: " $1 " seconds" }'
            else
              echo "- MP4: not generated; inspect the render steps above"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
