name: Violin Prince Motion Graphics Prototype

on:
  push:
    branches:
      - prototype/motion-hyperframes-2026-11-15
    paths:
      - ".github/workflows/hyperframes-motion-prototype.yml"
      - ".github/workflows/violin-prince-autopilot.yml"
      - ".github/workflows/autopilot-checks.yml"
      - "autopilot/engine/run.py"
      - "autopilot/engine/motion_hyperframes_renderer.py"
      - "autopilot/engine/tests/test_motion_hyperframes_renderer.py"
      - "prototypes/hyperframes-motion/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: violin-prince-motion-prototype-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render variable-duration Motion + HyperFrames sample
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PUBLISH_ENABLED: "false"
      YOUTUBE_PUBLISH_ENABLED: "false"
      CI: "true"
      HYPERFRAMES_NO_TELEMETRY: "1"
    defaults:
      run:
        working-directory: prototypes/hyperframes-motion
    steps:
      - name: Check out isolated prototype branch
        uses: actions/checkout@v4

      - name: Enforce the no-publishing boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$PUBLISH_ENABLED" == "false" ]]
          [[ "$YOUTUBE_PUBLISH_ENABLED" == "false" ]]
          echo "Publishing is disabled. No YouTube upload step or publishing credentials are configured."

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install prototype dependencies
        run: npm install --no-audit --no-fund

      - name: Create longer-than-10-second audio fixture
        run: |
          mkdir -p output
          ffmpeg -hide_banner -loglevel error \
            -f lavfi -i "sine=frequency=440:sample_rate=48000:duration=37.5" \
            -af "volume=0.12,afade=t=in:st=0:d=0.25,afade=t=out:st=35.5:d=2" \
            -c:a pcm_s16le output/duration-test.wav
          ffprobe -v error -select_streams a:0 -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 output/duration-test.wav

      - name: Exercise the Autopilot renderer bridge with the 37.5-second fixture
        working-directory: .
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, "autopilot/engine")
          from motion_hyperframes_renderer import render_full_track

          fixture = Path("prototypes/hyperframes-motion/output/duration-test.wav")
          if not fixture.is_file():
              raise SystemExit("The longer-than-10-second audio fixture is missing.")
          report = render_full_track(
              audio_bytes=fixture.read_bytes(),
              audio_filename=fixture.name,
              output_path="work/output/violin-prince-motion-full-track.mp4",
              work_dir="work/motion-hyperframes-bridge",
              plan={
                  "title": "Autopilot Integration Fixture",
                  "topic": "Motion + HyperFrames bridge test",
                  "hook": "A fixture verifies duration and rendering through Autopilot.",
                  "scenes": [
                      {"caption": "The opening scene"},
                      {"caption": "The middle scene"},
                      {"caption": "The final scene"},
                  ],
              },
          )
          output = Path("work/output")
          output.mkdir(parents=True, exist_ok=True)
          (output / "motion-render-report.json").write_text(
              json.dumps(report, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(report, indent=2))
          PY

      - name: Confirm the Autopilot bridge outputs
        if: always()
        run: |
          test -f ../../work/output/violin-prince-motion-full-track.mp4 || echo "Full-track MP4 was not generated."
          test -f ../../work/output/motion-contact-sheet.jpg || echo "Contact sheet was not generated."

      - name: Upload full-track MP4, contact sheet and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: violin-prince-motion-full-track
          path: |
            work/output/violin-prince-motion-full-track.mp4
            work/output/motion-contact-sheet.jpg
            work/output/motion-seeking-report.json
            work/output/motion-render-report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Write render report
        if: always()
        shell: bash
        run: |
          {
            echo "## Violin Prince Full-track Motion Prototype"
            echo
            echo "- Branch: $GITHUB_REF_NAME"
            echo "- Publishing: disabled"
            echo "- Blender: not installed or invoked"
            if [[ -f ../../work/output/motion-render-report.json ]]; then
              python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("../../work/output/motion-render-report.json").read_text(encoding="utf-8"))
          print("- Source audio duration: " + str(report["source_duration_seconds"]) + " seconds")
          print("- Exported MP4 duration: " + str(report["duration_seconds"]) + " seconds")
          print("- Format: " + str(report["width"]) + "x" + str(report["height"]) + " at " + str(report["fps"]) + " fps")
          print("- Audio included: " + str(report["audio_included"]))
          PY
            else
              echo "- Full-track render report: missing; inspect the bridge step above"
            fi
            if [[ -f ../../work/output/motion-seeking-report.json ]]; then
              echo "- Random-access seeking: verified"
            else
              echo "- Random-access seeking: not verified"
            fi
            if [[ -f ../../work/output/violin-prince-motion-full-track.mp4 ]]; then
              echo "- MP4: generated by the Autopilot renderer bridge"
            else
              echo "- MP4: not generated; inspect the render steps above"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
