name: Publish approved private Violin Prince preview

on:
  push:
    branches:
      - main
    paths:
      - ".autopilot/approved-preview-publication.json"

permissions:
  contents: write
  actions: read

concurrency:
  group: violin-prince-approved-preview-publication-v2
  cancel-in-progress: false

jobs:
  publish_approved_preview:
    name: Verify exact private preview and publish once
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PRIVATE_VOICE_REPO_TOKEN: ${{ secrets.PRIVATE_VOICE_REPO_TOKEN }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      EXPECTED_YOUTUBE_CHANNEL_ID: "UCGCfZij4Fn3Ga2j2HiCT45w"
      YOUTUBE_PRIVACY_STATUS: "public"
    steps:
      - name: Check out approved main-branch request
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the existing publisher dependency
        run: python -m pip install --disable-pip-version-check "requests>=2.32,<3" "av>=18,<19"

      - name: Verify provenance, check the actual channel for duplicates, and upload the exact preview
        run: python autopilot/engine/publish_approved_private_preview.py

      - name: Confirm publication is receipt-backed
        if: always()
        shell: bash
        run: |
          receipt=".autopilot/publication-receipts/44785872417.json"
          if [[ -s "$receipt" ]]; then
            python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path(".autopilot/publication-receipts/44785872417.json").read_text(encoding="utf-8"))
          print("Receipt status:", data.get("status"))
          print("YouTube video:", data.get("youtube_video_url"))
          PY
          else
            echo "No completed publication receipt exists. Do not retry automatically."
          fi
