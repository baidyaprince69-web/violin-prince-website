name: Violin Prince Private Preview Upload via Upload-Post

on:
  push:
    branches:
      - main
    paths:
      - ".autopilot/upload-request.json"

permissions:
  contents: read
  actions: read

concurrency:
  group: violin-prince-private-upload-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out upload request and approved plan
        uses: actions/checkout@v4

      - name: Validate private-upload request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          request = json.loads(Path(".autopilot/upload-request.json").read_text(encoding="utf-8"))
          plan = json.loads(Path(".autopilot/daily-production-plan.json").read_text(encoding="utf-8"))
          if request.get("mode") != "upload_existing_private_preview":
              raise SystemExit("Unsupported upload request mode.")
          if request.get("privacy_status") != "private" or request.get("publish_to_youtube") is not False:
              raise SystemExit("This workflow accepts PRIVATE previews only.")
          source_run_id = str(request.get("source_run_id") or "")
          artifact_name = str(request.get("artifact_name") or "")
          slot_id = str(request.get("slot_id") or "")
          production_date = str(request.get("production_date") or "")
          if not source_run_id.isdigit():
              raise SystemExit("A numeric source workflow run ID is required.")
          if not re.fullmatch(r"violin-prince-private-preview-\d+", artifact_name):
              raise SystemExit("The private-preview artifact name is invalid.")
          if slot_id not in {"music-secrets", "production-tech", "melody-stories", "real-performance"}:
              raise SystemExit("A canonical production slot is required.")
          today = datetime.now(ZoneInfo("Asia/Kolkata")).date().isoformat()
          if production_date != today or plan.get("production_date") != today:
              raise SystemExit("The plan and upload request must be current for Asia/Kolkata.")
          if plan.get("slot_id") != slot_id:
              raise SystemExit("The upload request does not match the approved plan slot.")
          metadata = plan.get("publish_metadata") or {}
          if metadata.get("privacy_status") != "private":
              raise SystemExit("The creative plan does not explicitly request private visibility.")
          if not str(metadata.get("title") or "").strip():
              raise SystemExit("The creative plan is missing its YouTube title.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("source_run_id=" + source_run_id + "\n")
              output.write("artifact_name=" + artifact_name + "\n")
              output.write("slot_id=" + slot_id + "\n")
              output.write("production_date=" + production_date + "\n")
          print("Validated one private-preview upload request.")
          PY

      - name: Download the exact rendered MP4 artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.request.outputs.artifact_name }}
          path: work/output
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.request.outputs.source_run_id }}

      - name: Install upload validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check "requests>=2.32,<3"

      - name: Upload the validated artifact as a PRIVATE YouTube preview via the shared uploader
        env:
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
          UPLOAD_POST_USER: "default"
          YOUTUBE_EXPECTED_CHANNEL_ID: ${{ vars.YOUTUBE_EXPECTED_CHANNEL_ID }}
          YOUTUBE_PRIVACY_STATUS: "private"
          PUBLISH_ENABLED: "false"
          GITHUB_REF_NAME: ${{ github.ref_name }}
          SOURCE_RUN_ID: ${{ steps.request.outputs.source_run_id }}
          SLOT_ID: ${{ steps.request.outputs.slot_id }}
          PRODUCTION_DATE: ${{ steps.request.outputs.production_date }}
        shell: bash
        run: |
          set -euo pipefail
          python autopilot/engine/upload_private_preview_uploadpost.py \
            --output-dir work/output \
            --plan .autopilot/daily-production-plan.json \
            --run-id "$SOURCE_RUN_ID" \
            --slot-id "$SLOT_ID" \
            --production-date "$PRODUCTION_DATE"
