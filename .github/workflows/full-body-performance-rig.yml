name: Full-Body Violin Performance Rig Preview

on:
  push:
    branches:
      - feat/fullbody-violin-performance-rig
    paths:
      - "autopilot/engine/**"
      - ".github/workflows/full-body-performance-rig.yml"
  pull_request:
    branches:
      - feat/procedural-2d-animation-engine
    paths:
      - "autopilot/engine/**"
      - ".github/workflows/full-body-performance-rig.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-body-performance-preview-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  render-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PUBLISH_ENABLED: "false"
      AUTOPILOT_ENABLED: "false"
      HYPERFRAMES_NO_UPDATE_CHECK: "1"
      CI: "true"
    steps:
      - name: Check out the isolated full-body rig branch
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            autopilot/engine/requirements-character.txt

      - name: Install CPU-only semantic parsing dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -r autopilot/engine/requirements-character.txt
          pip install "Pillow>=10.4,<12" "numpy>=1.24,<3" "cryptography>=42,<47" "soundfile>=0.12,<1" "requests>=2.31,<3"

      - name: Install eSpeak NG for synthetic voice-only preview fixture
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak-ng

      - name: Run full-body leg and instrument rig unit tests
        env:
          PYTHONPATH: autopilot/engine
        run: |
          python -m unittest discover -s autopilot/engine/tests -p "test_pose_range_visual_qa.py" -v
          python -m unittest discover -s autopilot/engine/tests -p "test_create_full_body_performance_preview.py" -v
          python -m unittest discover -s autopilot/engine/tests -p "test_violin_note_analysis.py" -v
          python -m unittest discover -s autopilot/engine/tests -p "test_joint_artwork_authoring.py" -v
          python -m unittest discover -s autopilot/engine/tests -p "test_reference_sheet_rig.py" -v
          python -m unittest discover -s autopilot/engine/tests -p "test_full_body_performance_rig.py" -v
          python -m unittest discover -s autopilot/engine/tests -p "test_character_rig.py" -v
          python -m unittest discover -s autopilot/engine/tests -p "test_character_autorig.py" -v
          python -m unittest discover -s autopilot/engine/tests -p "test_cinematic_video_pipeline.py" -v

      - name: Run Auto-Rig and create base articulated body layers
        env:
          PYTHONPATH: autopilot/engine
        run: |
          python autopilot/engine/character_autorig.py \
            --source autopilot/engine/assets/characters/violin-prince-performance/master-character-performance.webp \
            --reference-dir autopilot/engine/assets/characters/violin-prince-reference \
            --output work/full-body-rig/bundle \
            --id violin-prince \
            --allow-expression-fallback

      - name: Snapshot current preserved source for joint artwork comparison
        uses: actions/upload-artifact@v4
        with:
          name: current-autorig-preserved-source
          path: work/full-body-rig/bundle/preserved-full-body-source.png
          if-no-files-found: error
          retention-days: 1

      - name: Apply explicitly user-approved lower-body joint artwork
        env:
          PYTHONPATH: autopilot/engine
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          approved_path = Path("autopilot/engine/assets/characters/violin-prince-performance/joint-artwork-template-reviewed.json")
          config_path = Path("autopilot/engine/assets/characters/violin-prince-performance/performance-regions.json")
          output_path = Path("work/full-body-rig/performance-regions-reviewed.json")
          approved = json.loads(approved_path.read_text(encoding="utf-8"))
          config = json.loads(config_path.read_text(encoding="utf-8"))
          expected = {
              "left_hip", "right_hip", "left_knee",
              "right_knee", "left_ankle", "right_ankle",
          }
          assert approved.get("schema_version") == 1, approved
          assert approved.get("coordinate_space") == "absolute_source_pixels_top_left", approved
          assert approved.get("canvas") == config.get("canvas"), approved
          assert approved.get("review_metadata", {}).get("approved_region_count") == 6, approved
          assert approved.get("review_metadata", {}).get("status") == "explicit_user_approval", approved
          approved_regions = approved.get("joint_surfaces", {}).get("regions", {})
          assert set(approved_regions) == expected, approved_regions
          runtime_surfaces = config.get("joint_surfaces", {})
          runtime_regions = runtime_surfaces.get("regions", {})
          assert set(expected).issubset(runtime_regions), runtime_regions

          for name in sorted(expected):
              reviewed = approved_regions[name]
              runtime = runtime_regions[name]
              assert reviewed.get("artwork_status") == "artist_approved", (name, reviewed)
              for key in ("anchor", "parent_role", "child_role", "blend_axis_joints"):
                  assert reviewed.get(key) == runtime.get(key), (name, key, reviewed, runtime)
              assert len(reviewed.get("artist_source_polygon", [])) >= 3, (name, reviewed)
              runtime["artist_source_polygon"] = reviewed["artist_source_polygon"]
              runtime["artwork_status"] = "artist_approved"
              runtime["anchor_px"] = reviewed["anchor_px"]
              runtime["minimum_parent_child_overlap_pixels"] = 4
              runtime["blend_axis_half_length_px"] = reviewed["blend_axis_half_length_px"]
              runtime["edge_feather_px"] = float(reviewed.get("edge_feather_px", 0.5))
              runtime["approval_provenance"] = reviewed["approval_provenance"]
              runtime["candidate_is_production_art"] = False
              runtime.pop("polygon", None)
              runtime.pop("outline", None)

          runtime_surfaces["coordinate_space"] = "absolute_source_pixels_top_left"
          config["joint_surfaces"] = runtime_surfaces
          config["source_artwork"] = approved["source_artwork"]
          config["review_metadata"] = approved["review_metadata"]
          output_path.parent.mkdir(parents=True, exist_ok=True)
          output_path.write_text(json.dumps(config, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("Applied six explicitly user-approved source-coordinate joint polygons to the isolated preview manifest.")
          PY

      - name: Preserve complete body and add separate bow and fingering controls
        env:
          PYTHONPATH: autopilot/engine
        run: |
          python autopilot/engine/full_body_performance_rig.py \
            --source autopilot/engine/assets/characters/violin-prince-performance/master-character-performance.webp \
            --bundle work/full-body-rig/bundle \
            --prop-dir autopilot/engine/assets/characters/violin-prince-performance \
            --instrument-manifest autopilot/engine/assets/characters/violin-prince-performance/instrument-props.json \
            --performance-regions work/full-body-rig/performance-regions-reviewed.json \
            --finger-manifest autopilot/engine/assets/characters/violin-prince-performance/finger-regions.json \
            --rigging-sheet autopilot/engine/assets/characters/violin-prince-performance/reference-sheets/Gemini_Generated_Image_7xpc647xpc647xpc.png \
            --expression-sheet autopilot/engine/assets/characters/violin-prince-performance/reference-sheets/four-core-expressions.jpeg \
            --head-angle-sheet autopilot/engine/assets/characters/violin-prince-performance/reference-sheets/multi-angle-heads-facial-parts.jpeg

      - name: Prepare source-aligned lower-body joint artwork review pack
        env:
          PYTHONPATH: autopilot/engine
        run: |
          python autopilot/engine/joint_artwork_authoring.py \
            --source work/full-body-rig/bundle/preserved-full-body-source.png \
            --bundle work/full-body-rig/bundle \
            --regions autopilot/engine/assets/characters/violin-prince-performance/performance-regions.json \
            --out-dir work/full-body-rig/joint-artwork-review
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("work/full-body-rig/joint-artwork-review")
          report = json.loads((root / "joint-artwork-review-report.json").read_text())
          template = json.loads((root / "joint-artwork-template.json").read_text())
          assert report["joint_count"] == 6, report
          assert report["production_art_assets_created"] == 0, report
          assert report["rig_layers_modified"] == 0, report
          assert report["upper_body_and_hand_assets_touched"] is False, report
          assert len(template["joint_surfaces"]["regions"]) == 6, template
          joint_items = list(template["joint_surfaces"]["regions"].values())
          candidate_count = sum(bool(item.get("candidate_source_polygon")) for item in joint_items)
          manual_trace_count = sum(not bool(item.get("candidate_source_polygon")) for item in joint_items)
          assert all(
              item["artwork_status"] == "awaiting_artist_alignment"
              and item["artist_source_polygon"] == []
              and item["candidate_is_production_art"] is False
              for item in joint_items
          ), template
          assert report.get("candidate_joint_polygons") == candidate_count, report
          assert report.get("manual_seam_trace_required") == manual_trace_count, report
          assert report.get("candidate_polygons_artist_approved") == 0, report
          assert report.get("annotator") == "joint-artwork-annotator.html", report
          assert (root / report["annotator"]).is_file(), report
          assert report.get("production_art_assets_created") == 0, report
          assert candidate_count >= 1, report
          assert manual_trace_count >= 1, report
          assert all(
              item.get("candidate_geometry_kind") == "shared_alpha_overlap_evidence_only_not_full_joint_surface"
              and item["candidate_is_production_art"] is False
              for item in joint_items
          ), template
          assert all(
              item.get("candidate_status") in {
                  "source_alpha_overlap_evidence_only_not_full_joint_surface",
                  "manual_seam_trace_required_no_shared_parent_child_pixels",
              }
              for item in joint_items
          ), template
          assert all(
              0 < item.get("anchor_measure_radius_px", 0) <= 24
              for item in joint_items
          ), template
          assert all(
              item.get("closest_parent_source_pixel") is not None
              and item.get("closest_child_source_pixel") is not None
              and item.get("candidate_parent_child_gap_px") is not None
              and item.get("candidate_parent_child_gap_px", -1) >= 0
              for item in joint_items
              if item.get("manual_trace_reason") == "source_layers_separated_near_anchor"
          ), template
          assert all(
              item.get("parent_pixels_near_anchor", 0) == 0
              for item in joint_items
              if item.get("manual_trace_reason") == "parent_source_pixels_absent_near_anchor"
          ), template
          print(
              f"Prepared six source-aligned joint reviews: {candidate_count} shared-pixel draft contours, "
              f"{manual_trace_count} manual seam traces; zero approved production patches."
          )
          PY

      - name: Verify six approved lower-body joint patches
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          bundle = Path("work/full-body-rig/bundle")
          report = json.loads((bundle / "full-body-performance-report.json").read_text())
          character = json.loads((bundle / "character.json").read_text())
          import numpy as np
          from PIL import Image
          backplate_layers = [
              layer for layer in character.get("layers", [])
              if layer.get("role") == "source_motion_backplate"
          ]
          assert len(backplate_layers) == 1, backplate_layers
          backplate_report = report.get("source_motion_backplate", {})
          assert backplate_report.get("status") == "created", backplate_report
          assert backplate_report.get("method") == (
              "source_faithful_arm_leg_corridors_and_joint_overlaps"
          ), backplate_report
          assert backplate_report.get("source_alpha_respected") is True, backplate_report
          assert backplate_report.get("source_rgb_preserved") is True, backplate_report
          assert backplate_report.get("torso_underlay_added") is True, backplate_report
          assert backplate_report.get("torso_source_pixels_covered", 0) > 5000, backplate_report
          assert backplate_layers[0].get("z_index") == 2, backplate_layers[0]
          with Image.open(bundle / backplate_layers[0]["src"]) as opened:
              backplate_pixels = np.asarray(opened.convert("RGBA"), dtype=np.uint8)
          with Image.open(bundle / "preserved-full-body-source.png") as opened:
              source_pixels = np.asarray(opened.convert("RGBA"), dtype=np.uint8)
          assert backplate_pixels.shape == source_pixels.shape, backplate_pixels.shape
          underlay_visible = backplate_pixels[:, :, 3] > 0
          assert int(underlay_visible.sum()) == backplate_report.get("source_pixels_preserved"), backplate_report
          assert int(underlay_visible.sum()) > 3000, backplate_report
          assert np.all(backplate_pixels[:, :, 3] <= source_pixels[:, :, 3]), backplate_report
          assert np.array_equal(
              backplate_pixels[underlay_visible, :3],
              source_pixels[underlay_visible, :3],
          ), "The joint/limb backplate must use unchanged pixels from the preserved source artwork."
          expected = {
              "left_hip", "right_hip", "left_knee",
              "right_knee", "left_ankle", "right_ankle",
          }
          approval = report.get("joint_artwork_approval", {})
          joint_art = report.get("source_aligned_joint_surface_art", {})
          regions = joint_art.get("regions", {})
          created = {
              name for name, item in regions.items()
              if item.get("status") == "artist_source_polygon_patch_created"
          }
          assert approval.get("status") == "six_user_approved_source_polygons_activated", report
          assert approval.get("approved_joint_count") == 6, report
          assert approval.get("joint_region_hashes_verified") is True, report
          assert approval.get("source_validation_mode") == "joint_region_pixel_sha256", report
          assert created == expected, joint_art
          assert joint_art.get("joint_surface_layer_count") == 6, joint_art
          assert joint_art.get("joint_surface_articulated_layer_count") == 6, joint_art
          assert joint_art.get("source_pixels_transferred") == 5114, joint_art
          assert joint_art.get("hand_assets_modified") == 0, joint_art
          assert joint_art.get("hand_animation_data_modified") is False, joint_art
          assert joint_art.get("protected_upper_body_assets_modified") == 0, joint_art
          for name in sorted(expected):
              item = regions[name]
              assert item.get("source_pixels", 0) >= 80, (name, item)
              assert item.get("parent_overlap_pixels", 0) >= 4, (name, item)
              assert item.get("child_overlap_pixels", 0) >= 4, (name, item)
              # The feather band intentionally retains parent/child underlap.
              assert (
                  item.get("parent_alpha_pixels_removed", 0)
                  + item.get("child_alpha_pixels_removed", 0)
              ) > 0, (name, item)
              assert item.get("feathered_boundary_source_pixels", 0) > 0, (name, item)
              assert item.get("edge_feather_px") == 0.5, (name, item)
              assert (
                  item.get("opaque_core_source_pixels", 0)
                  / max(1, item.get("source_pixels", 0))
              ) >= 0.70, (name, item)
              # Keep a narrow soft boundary while most approved source pixels remain opaque.
          assert joint_art.get("edge_feathering", {}).get("method") == (
              "inward_source_alpha_gaussian_ramp_with_parent_child_underlap"
          ), joint_art
          assert joint_art.get("edge_feathering", {}).get("source_rgb_modified") is False, joint_art
          assert joint_art.get("edge_feathering", {}).get(
              "parent_child_underlap_retained_in_feather_band"
          ) is True, joint_art
          surface_roles = {
              layer["role"] for layer in character.get("layers", [])
              if layer.get("joint_surface")
          }
          expected_roles = {"joint_surface_" + name for name in expected}
          assert surface_roles == expected_roles, surface_roles
          patch_files = {path.stem for path in bundle.glob("joint_surface_*.png")}
          assert patch_files == expected_roles, patch_files
          print("Verified six approved lower-body joint patches: 5,114 original pixels transferred; protected hands, fingers, arms and props unchanged.")
          PY

      - name: Verify mapped character reference catalogue
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("work/full-body-rig/bundle")
          report = json.loads((root / "reference-sheets-report.json").read_text())
          mapping = json.loads((root / "reference-part-map.json").read_text())
          assert report.get("reference_parts_mapping") == "curated_role_catalogue_review_only", report
          parts = mapping.get("parts", [])
          assert len(parts) == 33, mapping
          assert mapping.get("automatic_body_part_replacement") is False, mapping
          assert all(part.get("reference_role") != "unclassified_reference_part" for part in parts), mapping
          assert all(part.get("use_policy") == "reference_only_until_manual_alignment_review" for part in parts), mapping
          assert any(part.get("reference_role") == "hair_shape" for part in parts), mapping
          assert any(part.get("reference_role") == "hand_pose" for part in parts), mapping
          assert any(part.get("reference_role") == "violin_prop" for part in parts), mapping
          assert any(part.get("reference_role") == "bow_prop" for part in parts), mapping
          print(f"Validated {len(parts)} reference assets with explicit roles; no unaligned asset is auto-applied.")
          PY

      - name: Verify source-aligned limb segmentation and preserve the violin
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          bundle = Path("work/full-body-rig/bundle")
          report = json.loads((bundle / "full-body-performance-report.json").read_text())
          character = json.loads((bundle / "character.json").read_text())
          # The build verifies the exact Auto-Rig source bytes before edge-matte
          # cleanup. The preserved PNG is intentionally rewritten after extraction,
          # so its post-build file hash is not the approved input hash.
          approval = report.get("joint_artwork_approval", {})
          assert approval.get("status") == "six_user_approved_source_polygons_activated", report
          assert approval.get("approved_joint_count") == 6, report
          assert approval.get("joint_region_hashes_verified") is True, report
          assert approval.get("source_validation_mode") == "joint_region_pixel_sha256", report
          separation = json.loads((bundle / "separation-report.json").read_text())
          hidden = separation.get("hidden_area_reconstruction", {})
          assert hidden.get("mask_saved") is True, separation
          assert hidden.get("mask_asset") == "torso-hidden-overlap-mask.png", separation
          torso_overlap = separation.get("torso_backplate_arm_overlap", {})
          assert torso_overlap.get("method") == "remove_source_arm_pixels_from_static_torso_keep_hidden_underlay", separation
          assert torso_overlap.get("source_arm_pixels_removed", 0) >= 0, separation
          assert torso_overlap.get("hidden_underlay_pixels_retained") == hidden.get("pixels_reconstructed"), separation
          assert torso_overlap.get("independent_limb_assets_modified") == 0, separation
          assert torso_overlap.get("hand_animation_data_modified") is False, separation
          from PIL import Image
          hidden_mask = Image.open(bundle / hidden["mask_asset"]).convert("L")
          assert sum(value > 0 for value in hidden_mask.getdata()) == hidden.get("pixels_reconstructed"), separation
          moving_report = report.get("full_body_moving_mask", {})
          assert moving_report.get("asset") == "full-body-moving-mask.png", report
          assert moving_report.get("pixels", 0) > 10000, report
          assert moving_report.get("source") == "authored_performance_polygons_and_finger_manifest", report
          moving_mask = Image.open(bundle / moving_report["asset"]).convert("L")
          assert sum(value > 0 for value in moving_mask.getdata()) == moving_report.get("pixels"), report
          restoration = report.get("torso_reference_restoration", {})
          assert restoration.get("method") == "aligned_supplied_jacket_reference_on_authored_moving_and_hidden_torso_masks", report
          assert restoration.get("reference_asset") == "reference-part-003.png", report
          assert restoration.get("pixels_restored", 0) >= 100, report
          assert restoration.get("layer_alpha_preserved") is True, report
          assert restoration.get("torso_crop_geometry_preserved") is True, report
          assert restoration.get("hand_forearm_assets_modified") == 0, report
          assert restoration.get("hand_animation_data_modified") is False, report
          assert restoration.get("source_pixels_outside_restoration_mask_preserved") is True, report
          restoration_mask = Image.open(bundle / restoration["restoration_mask_asset"]).convert("L")
          assert sum(value > 0 for value in restoration_mask.getdata()) == restoration.get("pixels_restored"), report
          performance = character.get("performance", {})
          base = report.get("composite_base", {})
          limbs = report.get("limb_report", {})
          joint_art = report.get("source_aligned_joint_surface_art", {})
          assert joint_art.get("method") == "artist_approved_absolute_source_polygon_joint_surfaces_only", report
          assert joint_art.get("coordinate_space") == "absolute_source_pixels_top_left", report
          assert joint_art.get("joint_surface_mode") == "approved_artist_polygons_only_no_generated_caps", report
          assert joint_art.get("hand_assets_modified") == 0, report
          assert joint_art.get("hand_animation_data_modified") is False, report
          assert joint_art.get("protected_upper_body_assets_modified") == 0, report
          lower_body_joints = {
              "left_hip", "right_hip", "left_knee",
              "right_knee", "left_ankle", "right_ankle",
          }
          protected_joints = {
              "left_shoulder", "right_shoulder", "left_elbow", "right_elbow",
          }
          joint_regions = joint_art.get("regions", {})
          assert set(joint_regions) == lower_body_joints | protected_joints, joint_art
          created_regions = {
              name for name, region in joint_regions.items()
              if region.get("status") == "artist_source_polygon_patch_created"
          }
          assert created_regions == lower_body_joints, joint_regions
          for name in protected_joints:
              region = joint_regions[name]
              assert region.get("status") == "skipped"
              assert region.get("reason") == "protected_upper_body_joint_asset_out_of_scope", joint_regions
          for name in lower_body_joints - created_regions:
              region = joint_regions[name]
              assert region.get("status") == "skipped"
              assert region.get("reason") in {
                  "artist_aligned_joint_surface_art_required",
                  "artist_polygon_does_not_bridge_both_source_surfaces",
              }, joint_regions
          for name in created_regions:
              region = joint_regions[name]
              assert region.get("source_pixels", 0) >= 80, region
              assert region.get("parent_overlap_pixels", 0) >= 4, region
              assert region.get("child_overlap_pixels", 0) >= 4, region
              assert region.get("parent_overlap_pixels", 0) >= 4, region
              assert region.get("child_overlap_pixels", 0) >= 4, region
              assert (
                  region.get("parent_alpha_pixels_removed", 0)
                  + region.get("child_alpha_pixels_removed", 0)
              ) > 0, region
              # Feather-band parent/child source pixels remain under the joint patch by design.
              assert region.get("feathered_boundary_source_pixels", 0) > 0, region
              assert region.get("opaque_core_source_pixels", 0) >= 24, region
          assert joint_art.get("edge_feathering", {}).get("method") == "inward_source_alpha_gaussian_ramp_with_parent_child_underlap", joint_art
          assert joint_art.get("edge_feathering", {}).get("source_rgb_modified") is False, joint_art
          assert joint_art.get("edge_feathering", {}).get("parent_child_underlap_retained_in_feather_band") is True, joint_art
          expected_surface_roles = {"joint_surface_" + name for name in created_regions}
          surface_roles = {
              layer["role"] for layer in character.get("layers", [])
              if layer.get("joint_surface")
          }
          assert surface_roles == expected_surface_roles, surface_roles
          patch_files = {path.stem for path in bundle.glob("joint_surface_*.png")}
          assert patch_files == expected_surface_roles, patch_files
          assert joint_art.get("joint_surface_layer_count") == len(created_regions), joint_art
          assert joint_art.get("joint_surface_mesh_layer_count") == len(created_regions), joint_art
          assert joint_art.get("joint_surface_articulated_layer_count") == len(created_regions), joint_art
          transferred_pixels = sum(
              joint_regions[name].get("source_pixels", 0) for name in created_regions
          )
          removed_pixels = sum(
              joint_regions[name].get("parent_alpha_pixels_removed", 0)
              + joint_regions[name].get("child_alpha_pixels_removed", 0)
              for name in created_regions
          )
          assert joint_art.get("source_pixels_transferred", 0) == transferred_pixels, joint_art
          assert joint_art.get("moving_mask_pixels", 0) == transferred_pixels, joint_art
          assert joint_art.get("parent_child_alpha_pixels_removed", 0) == removed_pixels, joint_art
          mesh_report = report.get("continuous_body_deformation", {})
          expected_mesh_roles = {
