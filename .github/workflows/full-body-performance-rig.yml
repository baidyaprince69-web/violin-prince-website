      - name: Generate the CC0 sampled solo-violin phrase and note event map
        env:
          PYTHONPATH: autopilot/engine
        run: |
          mkdir -p work/full-body-rig/audio
          python - <<'PY'
          import json
          from pathlib import Path
          from violin_sampler import create_sampled_violin_bed

          audio_path, music_map = create_sampled_violin_bed(
              "work/full-body-rig/audio/violin-prince-cc0-solo-violin.wav",
              seed_text="violin-prince-full-body-performance-preview",
          )
          if music_map.get("license") != "CC0-1.0":
              raise SystemExit("The generated violin audio did not pass its CC0 licence check.")
          if float(music_map.get("bpm", 0)) != 80.0:
              raise SystemExit("The sampled-violin arrangement tempo does not match its event map.")
          if len(music_map.get("beat_times", [])) != 32 or not music_map.get("onsets"):
              raise SystemExit("The sampled-violin arrangement did not provide a complete beat/onset map.")
          map_path = Path("work/full-body-rig/audio/violin-prince-cc0-solo-violin.music-map.json")
          map_path.write_text(json.dumps(music_map, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({
              "audio_file": str(audio_path),
              "audio_source": music_map["audio_source"],
              "license": music_map["license"],
              "source_library": music_map["source_library"],
              "duration_seconds": music_map["duration_seconds"],
              "bpm": music_map["bpm"],
              "beats": len(music_map["beat_times"]),
              "note_onsets": len(music_map["onsets"]),
          }, indent=2))
          PY

