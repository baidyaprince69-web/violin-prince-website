name: Full-Body Violin Performance Rig Preview

on:
  push:
    branches:
      - feat/fullbody-violin-performance-rig
    paths:
      - "autopilot/engine/**"
      - ".github/workflows/full-body-performance-rig.yml"
  pull_request:
    branches:
      - feat/procedural-2d-animation-engine
    paths:
      - "autopilot/engine/**"
      - ".github/workflows/full-body-performance-rig.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-body-performance-preview-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  render-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PUBLISH_ENABLED: "false"
      AUTOPILOT_ENABLED: "false"
      HYPERFRAMES_NO_UPDATE_CHECK: "1"
      CI: "true"
    steps:
      - name: Check out the isolated full-body rig branch
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            autopilot/engine/requirements-character.txt

      - name: Install CPU-only semantic parsing dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -r autopilot/engine/requirements-character.txt
          pip install "Pillow>=10.4,<12" "numpy>=1.24,<3" "cryptography>=42,<47" "soundfile>=0.12,<1" "requests>=2.31,<3"

      - name: Run full-body leg and instrument rig unit tests
        env:
          PYTHONPATH: autopilot/engine
        run: |
          python -m unittest discover -s autopilot/engine/tests -p "test_reference_sheet_rig.py" -v
          python -m unittest discover -s autopilot/engine/tests -p "test_full_body_performance_rig.py" -v
          python -m unittest discover -s autopilot/engine/tests -p "test_character_rig.py" -v
          python -m unittest discover -s autopilot/engine/tests -p "test_character_autorig.py" -v

      - name: Run Auto-Rig and create base articulated body layers
        env:
          PYTHONPATH: autopilot/engine
        run: |
          python autopilot/engine/character_autorig.py \
            --source autopilot/engine/assets/characters/violin-prince-performance/master-character-performance.webp \
            --reference-dir autopilot/engine/assets/characters/violin-prince-reference \
            --output work/full-body-rig/bundle \
            --id violin-prince \
            --allow-expression-fallback

      - name: Preserve complete body and add separate bow and fingering controls
        env:
          PYTHONPATH: autopilot/engine
        run: |
          python autopilot/engine/full_body_performance_rig.py \
            --source autopilot/engine/assets/characters/violin-prince-performance/master-character-performance.webp \
            --bundle work/full-body-rig/bundle \
            --prop-dir autopilot/engine/assets/characters/violin-prince-performance \
            --instrument-manifest autopilot/engine/assets/characters/violin-prince-performance/instrument-props.json \
            --performance-regions autopilot/engine/assets/characters/violin-prince-performance/performance-regions.json \
            --finger-manifest autopilot/engine/assets/characters/violin-prince-performance/finger-regions.json \
            --rigging-sheet autopilot/engine/assets/characters/violin-prince-performance/reference-sheets/Gemini_Generated_Image_7xpc647xpc647xpc.png \
            --expression-sheet autopilot/engine/assets/characters/violin-prince-performance/reference-sheets/four-core-expressions.jpeg \
            --head-angle-sheet autopilot/engine/assets/characters/violin-prince-performance/reference-sheets/multi-angle-heads-facial-parts.jpeg

      - name: Verify mapped character reference catalogue
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("work/full-body-rig/bundle")
          report = json.loads((root / "reference-sheets-report.json").read_text())
          mapping = json.loads((root / "reference-part-map.json").read_text())
          assert report.get("reference_parts_mapping") == "curated_role_catalogue_review_only", report
          parts = mapping.get("parts", [])
          assert len(parts) == 33, mapping
          assert mapping.get("automatic_body_part_replacement") is False, mapping
          assert all(part.get("reference_role") != "unclassified_reference_part" for part in parts), mapping
          assert all(part.get("use_policy") == "reference_only_until_manual_alignment_review" for part in parts), mapping
          assert any(part.get("reference_role") == "hair_shape" for part in parts), mapping
          assert any(part.get("reference_role") == "hand_pose" for part in parts), mapping
          assert any(part.get("reference_role") == "violin_prop" for part in parts), mapping
          assert any(part.get("reference_role") == "bow_prop" for part in parts), mapping
          print(f"Validated {len(parts)} reference assets with explicit roles; no unaligned asset is auto-applied.")
          PY

      - name: Verify source-aligned limb segmentation and preserve the violin
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("work/full-body-rig/bundle/full-body-performance-report.json").read_text())
          character = json.loads(Path("work/full-body-rig/bundle/character.json").read_text())
          performance = character.get("performance", {})
          base = report.get("composite_base", {})
          limbs = report.get("limb_report", {})
          assert base.get("mode") == "segmented_source_body", report
          assert base.get("source_alpha_preserved") is True, report
          assert base.get("source_pixels_outside_cut_mask_preserved") is True, report
          assert base.get("inpaint") == "opencv_telea_radius_5_alpha_aware", report
          assert base.get("cutout_mask_dilation_px") == 0, report
          assert base.get("cutout_boundary_method") == "exact_source_aligned_alpha_union", report
          assert base.get("expanded_halo_pixels_excluded", 0) > 0, report
          assert base.get("underpaint_quality") == "source_aligned_static_violin_preserved_no_violin_inpaint", report
          assert base.get("transparent_rgb_excluded_from_reconstruction") is True, report
          assert base.get("transparent_source_pixels_excluded_from_inpaint", 0) > 100000, report
          assert base.get("pixels_cut_from_source", 0) > 25000, report
          assert base.get("bow_pixels_reconstructed", 0) > 0, report
          assert base.get("violin_pixels_reconstructed", 0) == 0, report
          assert base.get("violin_source_underlay_preserved") is True, report
          assert base.get("violin_source_pixels_preserved", 0) > 5000, report
          assert base.get("head_plate_replacement_enabled") is True, report
          assert base.get("head_cutout_method") == "source_aligned_head_backplate_preserved", report
          assert base.get("head_pixels_reconstructed", 0) == 0, report
          assert base.get("head_source_backplate_preserved") is True, report
          assert base.get("head_backplate_pixels_preserved", 0) > 500, report
          bow_hair = report.get("bow_hair_restoration", {})
          assert bow_hair.get("method") == "largest_neutral_source_component_recovered_into_animated_bow", report
          assert bow_hair.get("pixels_added", 0) > 250, report
          assert bow_hair.get("source_mask_extended") is True, report
          assert bow_hair.get("shared_bow_transform") is True, report
          assert report.get("prop_report", {}).get("bow", {}).get("src") == bow_hair.get("src"), report
          static_props = report.get("static_layer_prop_cleanup", {})
          assert static_props.get("method") == "mobile_bow_removed_static_violin_retained_as_torso_underlay", report
          assert static_props.get("violin_backplate_policy") == "source_aligned_torso_underlay_behind_attached_violin_prop", report
          torso_extension = static_props.get("torso_backplate_extension", {})
          assert torso_extension.get("method") == "source_aligned_full_violin_underlay_in_extended_torso_plate", report
          assert torso_extension.get("violin_backplate_pixels", 0) > 5000, report
          assert torso_extension.get("pixels_added", 0) > 4000, report
          assert torso_extension.get("bow_pixels_excluded", 0) > 0, report
          assert torso_extension.get("moving_part_pixels_excluded", 0) > 0, report
          assert torso_extension.get("torso_pivot_preserved") is True, report
          assert static_props.get("total_pixels_removed", 0) > 500, report
          assert static_props.get("layers", {}).get("torso", {}).get("violin_pixels_removed", 999) == 0, report
          assert static_props.get("layers", {}).get("torso", {}).get("violin_backplate_pixels_preserved", 0) > 1000, report
          assert static_props.get("layers", {}).get("torso", {}).get("bow_pixels_removed", 0) > 300, report
          assert limbs.get("method") == "authored_source_aligned_polygon_regions_v1", report
          assert limbs.get("independent_layer_count") == 12, report
          assert len(limbs.get("parts", {})) == 12, report
          assert all(part["pixel_area"] > part["minimum_pixels"] for part in limbs["parts"].values()), report
          overlaps = limbs.get("joint_overlap_pixels", {})
          assert max(overlaps.values()) <= 500, report
          assert overlaps.get("left_ankle", 999) <= 200, report
          assert overlaps.get("right_ankle", 999) <= 200, report
          assert report.get("finger_layer_count") == 12, report
          assert report.get("finger_segment_count") == 12, report
          assert report.get("finger_digit_count") == 4, report
          assert report.get("finger_joint_count") == 12, report
          finger_quality = report.get("finger_segment_quality", {})
          assert finger_quality.get("method") == "one_pixel_source_mask_expansion_metric_joint_seams_connected_palm_cleanup", report
          assert finger_quality.get("chain_count") == 4, report
          assert set(finger_quality.get("segments_per_chain", {}).values()) == {3}, report
          assert finger_quality.get("minimum_segment_pixels", 0) >= 12, report
          assert finger_quality.get("minimum_joint_overlap_pixels", 0) >= 12, report
          assert finger_quality.get("little_fingertip_pixels", 0) >= 12, report
          assert finger_quality.get("palm_components_after_cleanup") == 1, report
          assert finger_quality.get("palm_speckle_components_removed", 0) > 0, report
          assert len(performance.get("fingering_segment_roles", [])) == 12, performance
          assert len(performance.get("fingering_parts", [])) == 4, performance
          hand_cleanup = report.get("violin_hand_overlap_cleanup", {})
          assert hand_cleanup.get("backplate_pixels_added", 0) > 100, report
          assert hand_cleanup.get("hand_hole_pixels_filled", 0) > 20, report
          assert hand_cleanup.get("source_hand_pixels_reconstructed", 0) > 20, report
          assert hand_cleanup.get("method") == "source_aligned_fingerboard_backplate_rgb_reconstruction", report
          assert hand_cleanup.get("prop_alpha_extended") is True, report
          assert hand_cleanup.get("parent_prop_mask_updated") is True, report
          edge_cleanup = report.get("source_edge_color_decontamination", {})
          assert edge_cleanup.get("method") == "distance_aware_neutral_matte_decontamination", report
          assert edge_cleanup.get("edge_band_radius", 0) >= 4.0, report
          assert edge_cleanup.get("pixels_recoloured", 0) > 400, report
          assert edge_cleanup.get("source_alpha_preserved") is True, report
          assert edge_cleanup.get("source_silhouette_geometry_preserved") is True, report
          print("All twelve limb segments and twelve fretting phalanx sprites extracted; duplicate fretting-hand pixels removed from the violin prop.")
          PY

      - name: Generate the CC0 sampled solo-violin phrase and note event map
        env:
          PYTHONPATH: autopilot/engine
        run: |
          mkdir -p work/full-body-rig/audio
          python - <<'PY'
          import json
          from pathlib import Path
          from violin_sampler import create_sampled_violin_bed

          audio_path, music_map = create_sampled_violin_bed(
              "work/full-body-rig/audio/violin-prince-cc0-solo-violin.wav",
              seed_text="violin-prince-full-body-performance-preview",
          )
          if music_map.get("license") != "CC0-1.0":
              raise SystemExit("The generated violin audio did not pass its CC0 licence check.")
          if float(music_map.get("bpm", 0)) != 80.0:
              raise SystemExit("The sampled-violin arrangement tempo does not match its event map.")
          if len(music_map.get("beat_times", [])) != 32 or not music_map.get("onsets"):
              raise SystemExit("The sampled-violin arrangement did not provide a complete beat/onset map.")
          map_path = Path("work/full-body-rig/audio/violin-prince-cc0-solo-violin.music-map.json")
          map_path.write_text(json.dumps(music_map, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({
              "audio_file": str(audio_path),
              "audio_source": music_map["audio_source"],
              "license": music_map["license"],
              "source_library": music_map["source_library"],
              "duration_seconds": music_map["duration_seconds"],
              "bpm": music_map["bpm"],
              "beats": len(music_map["beat_times"]),
              "note_onsets": len(music_map["onsets"]),
          }, indent=2))
          PY

      - name: Build the isolated 8-second performance project using sampled-violin timing
        env:
          PYTHONPATH: autopilot/engine
        run: |
          python autopilot/engine/create_full_body_performance_preview.py \
            --bundle work/full-body-rig/bundle \
            --output work/full-body-rig \
            --audio work/full-body-rig/audio/violin-prince-cc0-solo-violin.wav \
            --music-map work/full-body-rig/audio/violin-prince-cc0-solo-violin.music-map.json

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Motion and HyperFrames
        working-directory: autopilot/engine/animation2d
        run: npm install --no-audit --no-fund

      - name: Run all animation contract and full-body motion tests
        working-directory: autopilot/engine/animation2d
        run: npm test

      - name: Build the full-body composition
        working-directory: autopilot/engine/animation2d
        run: |
          node build.mjs \
            --project ../../../work/full-body-rig/project.json \
            --out-dir ../../../work/full-body-rig/composition
          mkdir -p ../../../work/full-body-rig/composition/assets/characters
          cp -R ../../../work/full-body-rig/assets/characters/violin-prince \
            ../../../work/full-body-rig/composition/assets/characters/
          cp ../../../work/full-body-rig/bundle/full-body-performance-report.json \
            ../../../work/full-body-rig/

      - name: Verify full-body motion QA gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("work/full-body-rig/composition/motion-report.json").read_text())
          project = json.loads(Path("work/full-body-rig/project.json").read_text())
          action = project["scenes"][0]["character_actions"]["violin-prince"]
          sync = action.get("music_sync", {})
          scene = report["scenes"][0]
          assert sync.get("source") == "sampled_violin_cc0", sync
          assert sync.get("audio_attached") is True, sync
          assert sync.get("audio_license") == "CC0-1.0", sync
          assert sync.get("event_map_source") == "sampled_violin_arrangement_note_events", sync
          assert sync.get("analysis_status") == "metadata_verified", sync
          assert sync.get("decode_backend") in {"soundfile", "ffmpeg"}, sync
          assert sync.get("bpm") == 80, sync
          assert len(sync.get("beat_times", [])) >= 10, sync
          assert len(sync.get("onsets", [])) > 0, sync
          assert len(sync.get("note_events", [])) >= 4, sync
          assert action.get("head_angle") == "front", action
          assert action.get("head_expression") == "focused", action
          assert not action.get("head_angle_sequence"), action
          assert not action.get("head_expression_sequence"), action
          character = json.loads(Path("work/full-body-rig/bundle/character.json").read_text())
          props = character.get("props", {})
          assert props.get("bow", {}).get("attach_to") == "left_hand", props
          assert props.get("violin", {}).get("attach_to") == "torso", props
          assert not action.get("prop_keyframes"), action
          joints = character.get("joints", {})
          width, height = character["canvas"]["width"], character["canvas"]["height"]
          left_wrist = joints["left_wrist"]
          right_wrist = joints["right_wrist"]
          assert abs(left_wrist["x"] * width - 116) <= 1.5, left_wrist
          assert abs(left_wrist["y"] * height - 231) <= 1.5, left_wrist
          assert abs(right_wrist["x"] * width - 350) <= 1.5, right_wrist
          assert abs(right_wrist["y"] * height - 239) <= 1.5, right_wrist
          bow = props["bow"]
          grip_x = bow["x"] + bow["pivot_x"] * bow["width"]
          grip_y = bow["y"] + bow["pivot_y"] * bow["height"]
          assert abs(grip_x - 178) <= 1.5 and abs(grip_y - 242) <= 1.5, (grip_x, grip_y)
          assert len(character.get("head_variants", {})) == 4, character
          assert len(character.get("head_angles", {})) == 4, character
          assert scene.get("stagecraft_environment") == "concert_stage", scene
          assert report.get("animated_stagecraft_scene_count") == 1, report
          assert report.get("animated_stagecraft_node_count", 0) > 0, report
          assert report.get("full_body_performance_scene_count") == 1, report
          assert report.get("preserved_composite_base_count") == 1, report
          assert report.get("animated_full_body_part_count") == 6, report
          assert report.get("animated_limb_segment_count") == 12, report
          assert report.get("animated_fingering_control_count") == 4, report
          assert report.get("animated_finger_segment_count") == 12, report
          assert scene.get("animated_finger_segments") == 12, scene
          assert report.get("animated_instrument_prop_count") == 2, report
          assert scene.get("full_body_visual_mode") == "segmented_source_body", scene
          print(json.dumps({
              "full_body_scenes": report["full_body_performance_scene_count"],
              "independent_leg_parts": report["animated_full_body_part_count"],
              "independent_limb_segments": report["animated_limb_segment_count"],
              "preserved_composite_bases": report["preserved_composite_base_count"],
              "finger_controls": report["animated_fingering_control_count"],
              "finger_phalanx_segments": report["animated_finger_segment_count"],
              "instrument_props": report["animated_instrument_prop_count"],
              "motion_tracks": report["total_motion_tracks"],
          }, indent=2))
          PY

      - name: Lint the built HyperFrames composition
        working-directory: work/full-body-rig/composition
        run: $GITHUB_WORKSPACE/autopilot/engine/animation2d/node_modules/.bin/hyperframes lint

      - name: Install bundled FFmpeg for preview rendering and contact sheet
        run: |
          python -m pip install --disable-pip-version-check "imageio-ffmpeg>=0.4.9,<1"
          FFMPEG_EXE="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          echo "$(dirname "$FFMPEG_EXE")" >> "$GITHUB_PATH"
          "$FFMPEG_EXE" -version | head -n 1

      - name: Render the non-publishing full-body performance preview
        working-directory: work/full-body-rig/composition
        run: |
          $GITHUB_WORKSPACE/autopilot/engine/animation2d/node_modules/.bin/hyperframes render \
            --output ../full-body-violin-performance-video-only.mp4 \
            --fps 25 \
            --quality standard

      - name: Mix the synchronized sampled violin audio into the review MP4
        run: |
          ffmpeg -hide_banner -loglevel error -y \
            -i work/full-body-rig/full-body-violin-performance-video-only.mp4 \
            -i work/full-body-rig/audio/violin-prince-cc0-solo-violin.wav \
            -map 0:v:0 -map 1:a:0 -t 8 \
            -c:v copy -c:a aac -b:a 192k -shortest -movflags +faststart \
            work/full-body-rig/full-body-violin-performance.mp4

      - name: Create a visual review contact sheet
        run: |
          mkdir -p work/full-body-rig/frames
          for t in 0.5 2.0 3.5 5.0 6.5 7.5; do
            ffmpeg -hide_banner -loglevel error \
              -ss "$t" -i work/full-body-rig/full-body-violin-performance.mp4 \
              -frames:v 1 -q:v 2 "work/full-body-rig/frames/frame-$t.jpg"
          done
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          files = sorted(Path("work/full-body-rig/frames").glob("*.jpg"))
          if len(files) != 6:
              raise SystemExit(f"Expected six sampled frames, got {len(files)}")
          thumbs = []
          for path in files:
              image = Image.open(path).convert("RGB")
              image.thumbnail((240, 426))
              thumbs.append((path.stem, image.copy()))
          canvas = Image.new("RGB", (240 * 3, 452 * 2), (12, 18, 28))
          draw = ImageDraw.Draw(canvas)
          for index, (label, image) in enumerate(thumbs):
              x = (index % 3) * 240
              y = (index // 3) * 452
              canvas.paste(image, (x, y + 24))
              draw.text((x + 8, y + 6), label, fill=(240, 230, 210))
          canvas.save("work/full-body-rig/full-body-performance-contact-sheet.jpg", quality=94)
          PY

      - name: Upload preview and QA evidence only
        uses: actions/upload-artifact@v4
        with:
          name: full-body-violin-performance-preview-${{ github.run_number }}
          path: |
            work/full-body-rig/full-body-violin-performance.mp4
            work/full-body-rig/full-body-performance-contact-sheet.jpg
            work/full-body-rig/bundle/full-body-performance-report.json
            work/full-body-rig/bundle/reference-sheets-report.json
            work/full-body-rig/bundle/reference-part-map.json
            work/full-body-rig/bundle/reference-parts-contact-sheet.png
            work/full-body-rig/bundle/separation-report.json
            work/full-body-rig/composition/motion-report.json
            work/full-body-rig/bundle/separation-preview.png
            work/full-body-rig/bundle/character.json
            work/full-body-rig/bundle/*.png
            work/full-body-rig/bundle/*.webp
            work/full-body-rig/project.json
            work/full-body-rig/audio/violin-prince-cc0-solo-violin.wav
            work/full-body-rig/audio/violin-prince-cc0-solo-violin.music-map.json
          if-no-files-found: error
          retention-days: 7
