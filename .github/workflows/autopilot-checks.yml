name: Autopilot code checks

on:
  push:
    branches:
      - main
      - feature/character-articulated-rig-validation
      - feat/four-slot-production-foundation-20261121
    paths:
      - "autopilot/**"
      - "voice-vault/voice-package.mjs"
      - ".github/voice-tests/**"
      - ".github/workflows/qwen3-voice-preflight.yml"
      - ".github/workflows/violin-prince-autopilot.yml"
      - ".github/workflows/publisher-fallback.yml"
      - ".github/workflows/youtube-connection-check.yml"
      - ".github/workflows/autopilot-checks.yml"
  pull_request:
    paths:
      - "autopilot/**"
      - "voice-vault/voice-package.mjs"
      - ".github/voice-tests/**"
      - ".github/workflows/qwen3-voice-preflight.yml"
      - ".github/workflows/violin-prince-autopilot.yml"
      - ".github/workflows/publisher-fallback.yml"
      - ".github/workflows/youtube-connection-check.yml"
      - ".github/workflows/autopilot-checks.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Run the cheapest source-level checks before installing rendering dependencies.
      - name: Install fast Python static checker
        run: python -m pip install --disable-pip-version-check "ruff>=0.14,<0.16"

      - name: Detect undefined and possibly unbound Python names
        run: ruff check --select F821,F822,F823 autopilot/engine

      - name: Run focused HyperFrames production-path regression tests
        env:
          PYTHONPATH: autopilot/engine
        run: python -m unittest discover -s autopilot/engine/tests -p "test_hyperframes_pipeline.py" -v

      - name: Compile all Python engine modules
        run: |
          python -m py_compile autopilot/engine/*.py
          python -m py_compile autopilot/engine/seo_intelligence/*.py

      - name: Install daily-plan test dependencies
        run: python -m pip install --disable-pip-version-check "Pillow>=10.4,<12" "requests>=2.31,<3" "cryptography>=42,<47" "numpy>=1.24,<3"

      - name: Run four-slot contract and isolation tests
        env:
          PYTHONPATH: autopilot/engine
        run: |
          python -m unittest discover -s autopilot/engine/tests -p "test_slot_registry.py" -v
          python -m unittest discover -s autopilot/engine/tests -p "test_public_queue.py" -v
          python -m unittest discover -s autopilot/engine/tests -p "test_slot_batch_readiness.py" -v
          python -m unittest discover -s autopilot/engine/tests -p "test_slot_workflow_gates.py" -v
          python -m unittest discover -s autopilot/engine/tests -p "test_workflow_privacy_contract.py" -v
          python -m unittest discover -s autopilot/engine/tests -p "test_upload_public_short_uploadpost.py" -v

      - name: Run daily-plan evidence and snapshot identity regression tests
        env:
          PYTHONPATH: autopilot/engine
        run: python -m unittest discover -s autopilot/engine/tests -p "test_daily_plan.py" -v

      - name: Run Master Creative Director shot-led contract tests
        env:
          PYTHONPATH: autopilot/engine
        run: python -m unittest discover -s autopilot/engine/tests -p "test_master_creative_director.py" -v

      - name: Run GitHub Copilot Master Director provider tests
        env:
          PYTHONPATH: autopilot/engine
        run: python -m unittest discover -s autopilot/engine/tests -p "test_copilot_director_provider.py" -v

      - name: Run shot-led Master Director render project tests
        env:
          PYTHONPATH: autopilot/engine
        run: python -m unittest discover -s autopilot/engine/tests -p "test_director_shot_renderer.py" -v

      - name: Run guarded direct-publishing fallback tests
        env:
          PYTHONPATH: autopilot/engine
        run: python -m unittest discover -s autopilot/engine/tests -p "test_publisher_router.py" -v
 
      - name: Run direct daily public YouTube publisher tests
        env:
          PYTHONPATH: autopilot/engine
        run: python -m unittest discover -s autopilot/engine/tests -p "test_publish_daily_short.py" -v

      - name: Run publisher metadata and provenance handoff tests
        env:
          PYTHONPATH: autopilot/engine
        run: python -m unittest discover -s autopilot/engine/tests -p "test_publish_handoff.py" -v

      - name: Run creator-scope illustration approval tests
        env:
          PYTHONPATH: autopilot/engine
        run: python -m unittest discover -s autopilot/engine/tests -p "test_local_vector_illustrator.py" -v

      - name: Run native YouTube uploads-list duplicate-audit tests
        env:
          PYTHONPATH: autopilot/engine
        run: python -m unittest discover -s autopilot/engine/tests -p "test_youtube_channel_audit.py" -v

      - name: Run direct YouTube OAuth uploader metadata tests
        env:
          PYTHONPATH: autopilot/engine
        run: python -m unittest discover -s autopilot/engine/tests -p "test_publisher.py" -v

      - name: Install private voice bridge test dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            "numpy>=1.24,<3" "soundfile>=0.12,<1" "requests>=2.31,<3"

      - name: Run private voice bridge validation regression tests
        working-directory: autopilot/engine/tests
        run: python -m unittest -v test_private_voice_client.py

      - name: Install YAML validation dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Validate workflow YAML syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          files = [
              ".github/workflows/autopilot-checks.yml",
              ".github/workflows/violin-prince-autopilot.yml",
              ".github/workflows/publisher-fallback.yml",
              ".github/workflows/youtube-connection-check.yml",
              ".github/workflows/private-qwen3-bridge-test.yml",
              ".github/voice-tests/private-runner/private-voice-test.workflow.yml",
              ".github/workflows/youtube-seo-learning.yml",
              ".github/workflows/youtube-seo-discover-verification.yml",
              ".github/workflows/character-rig-test.yml",
          ]
          for name in files:
              parsed = yaml.safe_load(Path(name).read_text(encoding="utf-8"))
              if not isinstance(parsed, dict):
                  raise SystemExit(f"{name}: expected a YAML mapping")
              print(f"{name}: YAML syntax OK")
          PY

      - name: Check production workflow and voice test templates exist
        run: |
          test -s .github/workflows/violin-prince-autopilot.yml
          test -s autopilot/engine/animation2d/package.json
          test -s autopilot/engine/animation2d/build.mjs
          test -s autopilot/engine/hyperframes_pipeline.py
          test -s autopilot/engine/character_rig.py
          test -s autopilot/engine/character_autorig.py
          test -s autopilot/engine/character_rig_test.py


      - name: Confirm the production runners contain no Cloudflare or Worker credentials
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          pattern = re.compile(
              r"CF_ACCOUNT_ID|CF_AI_TOKEN|AUTOPILOT_API_URL|AUTOPILOT_JOB_TOKEN|"
              r"api\.cloudflare\.com|cloudflare|workers\s+ai",
              re.IGNORECASE,
          )
          paths = [
              Path(".github/workflows/violin-prince-autopilot.yml"),
              Path("autopilot/engine/run.py"),
              Path("autopilot/engine/run_daily_plan.py"),
          ]
          findings = []
          for path in paths:
              if not path.is_file():
                  raise SystemExit(f"Required scan target is missing: {path}")
              for line_number, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  if pattern.search(line):
                      findings.append(f"{path}:{line_number}: {line.strip()}")
          if findings:
              print("\n".join(findings))
              raise SystemExit("A Cloudflare or Worker dependency remains in the production runner.")
          print(f"Scanned {len(paths)} production runner files; no Cloudflare or Worker credentials were found.")
          PY

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check private voice-runner helper syntax
        run: |
          node --check .github/voice-tests/private-runner/decrypt_vprvoice.mjs
          node --check .github/voice-tests/private-runner/tests/decrypt_vprvoice.test.mjs

      - name: Test encrypted voice-package decryption using synthetic audio
        run: node --test .github/voice-tests/private-runner/tests/decrypt_vprvoice.test.mjs

      - name: Install Motion and HyperFrames
        working-directory: autopilot/engine/animation2d
        run: npm install --no-audit --no-fund

      - name: Test Motion keyframes and build the HyperFrames composition
        working-directory: autopilot/engine/animation2d
        run: |
          npm test
          node build.mjs --project project.example.json --out-dir .validation
          ./node_modules/.bin/hyperframes lint .validation
        env:
          HYPERFRAMES_NO_UPDATE_CHECK: "1"
          CI: "true"
