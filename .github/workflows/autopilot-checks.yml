name: Autopilot code checks

on:
  push:
    paths:
      - "autopilot/**"
      - ".github/workflows/violin-prince-autopilot.yml"
      - ".github/workflows/deploy-autopilot-cloudflare.yml"
      - ".github/workflows/autopilot-checks.yml"
  pull_request:
    paths:
      - "autopilot/**"
      - ".github/workflows/violin-prince-autopilot.yml"
      - ".github/workflows/autopilot-checks.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js for Cloudflare Worker tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Compile all Python engine modules
        run: |
          python -m py_compile autopilot/engine/*.py
          python -m py_compile autopilot/engine/seo_intelligence/*.py

      - name: Install offline render-test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install requests Pillow PyYAML numpy soundfile cryptography

      - name: Run offline audio and narration helper tests
        run: python -m unittest discover -s autopilot/engine/tests -v

      - name: Run narration composer regressions after the full suite
        run: python -m unittest autopilot.engine.tests.test_planner_retry -v

      - name: Validate D1 SQL schema
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(":memory:")
          db.executescript(Path("autopilot/cloudflare/schema.sql").read_text())
          print("D1 schema parses successfully.")
          PY

      - name: Check Cloudflare provisioning script syntax
        run: node --check autopilot/scripts/provision-cloudflare.mjs

      - name: Check Cloudflare Worker JavaScript syntax
        run: node --check --input-type=module < autopilot/cloudflare/src/worker.js

      - name: Run Cloudflare Worker dispatch regression tests
        run: node --test autopilot/cloudflare/tests/worker.test.mjs

      - name: Check dashboard JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("autopilot/index.html").read_text()
          match = re.search(r"<script>(.*?)</script>", html, re.S)
          if not match:
              raise SystemExit("Dashboard inline script was not found.")
          Path("/tmp/dashboard.js").write_text(match.group(1))
          PY
          node --check /tmp/dashboard.js

      - name: Validate workflow YAML syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          files = [
              ".github/workflows/autopilot-checks.yml",
              ".github/workflows/violin-prince-autopilot.yml",
              ".github/workflows/deploy-autopilot-cloudflare.yml",
              ".github/workflows/youtube-seo-learning.yml",
              ".github/workflows/youtube-seo-discover-verification.yml",
          ]
          for name in files:
              parsed = yaml.safe_load(Path(name).read_text(encoding="utf-8"))
              if not isinstance(parsed, dict):
                  raise SystemExit(f"{name}: expected a YAML mapping")
              print(f"{name}: YAML syntax OK")

          autopilot = yaml.load(
              Path(".github/workflows/violin-prince-autopilot.yml").read_text(encoding="utf-8"),
              Loader=yaml.BaseLoader,
          )
          dispatch_inputs = autopilot.get("on", {}).get("workflow_dispatch", {}).get("inputs", {})
          missing_inputs = {"stage", "run_id", "run_mode"} - set(dispatch_inputs)
          if missing_inputs:
              raise SystemExit("Autopilot workflow is missing Worker dispatch inputs: " + ", ".join(sorted(missing_inputs)))
          if dispatch_inputs["run_id"].get("required") != "false":
              raise SystemExit("run_id must remain optional for direct GitHub launches.")
          if dispatch_inputs["run_mode"].get("default") != "manual":
              raise SystemExit("run_mode must default to manual for direct GitHub launches.")
          print("Autopilot Worker dispatch input contract: OK")
          PY

      - name: Check production and deployment workflow files exist
        run: |
          test -s .github/workflows/violin-prince-autopilot.yml
          test -s .github/workflows/deploy-autopilot-cloudflare.yml
