name: Autopilot code checks

on:
  push:
    paths:
      - "autopilot/**"
      - ".github/workflows/violin-prince-autopilot.yml"
      - ".github/workflows/autopilot-checks.yml"
  pull_request:
    paths:
      - "autopilot/**"
      - ".github/workflows/violin-prince-autopilot.yml"
      - ".github/workflows/autopilot-checks.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python engine
        run: python -m py_compile autopilot/engine/run.py

      - name: Validate D1 SQL schema
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(":memory:")
          db.executescript(Path("autopilot/cloudflare/schema.sql").read_text())
          print("D1 schema parses successfully.")
          PY

      - name: Check Cloudflare Worker JavaScript syntax
        run: node --check --input-type=module < autopilot/cloudflare/src/worker.js

      - name: Check production workflow file exists
        run: test -s .github/workflows/violin-prince-autopilot.yml
