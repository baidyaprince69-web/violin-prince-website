name: Autopilot code checks

on:
  push:
    paths:
      - "autopilot/**"
      - ".github/workflows/violin-prince-autopilot.yml"
      - ".github/workflows/autopilot-checks.yml"
  pull_request:
    paths:
      - "autopilot/**"
      - ".github/workflows/violin-prince-autopilot.yml"
      - ".github/workflows/autopilot-checks.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile all Python engine modules
        run: |
          python -m py_compile autopilot/engine/*.py
          python -m py_compile autopilot/engine/seo_intelligence/*.py

      - name: Install offline render-test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install requests Pillow PyYAML numpy soundfile cryptography 'fonttools[woff]>=4.50,<5'

      - name: Run complete Python test suite
        run: python -m unittest discover -s autopilot/engine/tests -v

      - name: Run narration composer regressions
        run: python -m unittest autopilot.engine.tests.test_planner_retry -v

      - name: Verify GitHub-native production has no retired service configuration
        shell: bash
        run: |
          set -euo pipefail
          if git grep -niE 'Cloudflare|cloudflare|CF_ACCOUNT_ID|CF_AI_TOKEN|AUTOPILOT_API_URL|AUTOPILOT_JOB_TOKEN|workers\.dev|wrangler|R2 bucket|D1 database|GITHUB_DISPATCH_TOKEN|DASHBOARD_TOKEN' -- . ':(exclude).github/workflows/autopilot-checks.yml'; then
            echo "::error::A retired external-service configuration remains."
            exit 1
          fi
          test ! -e ".github/workflows/deploy-autopilot-cloudflare.yml"
          test ! -d "autopilot/cloudflare"
          test ! -e "autopilot/scripts/provision-cloudflare.mjs"
          test ! -e "autopilot/engine/analytics.py"
          echo "Cloudflare removal contract: OK"

      - name: Validate GitHub production workflow contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          workflow = yaml.load(
              Path(".github/workflows/violin-prince-autopilot.yml").read_text(encoding="utf-8"),
              Loader=yaml.BaseLoader,
          )
          events = workflow.get("on", {})
          if "schedule" in events:
              raise SystemExit("No second scheduled production trigger is allowed.")
          dispatch = events.get("workflow_dispatch", {}).get("inputs", {})
          if "plan_path" not in dispatch:
              raise SystemExit("Manual plan_path input is missing.")
          steps = workflow["jobs"]["produce"]["steps"]
          if not any(step.get("name") == "Produce the Short from the prepared plan" for step in steps):
              raise SystemExit("Prepared-plan production step is missing.")
          if not any(step.get("name") == "Create release with video and publisher handoff" for step in steps):
              raise SystemExit("GitHub release handoff step is missing.")
          if workflow["jobs"]["produce"].get("env", {}).get("PUBLISH_ENABLED") != "false":
              raise SystemExit("External publishing must remain disabled.")
          if not any(step.get("name") == "Upload finished video" for step in steps):
              raise SystemExit("Workflow video artifact is missing.")
          print("GitHub-native production workflow contract: OK")
          PY

      - name: Check required production source files exist
        run: |
          test -s .github/workflows/violin-prince-autopilot.yml
          test -s autopilot/engine/run_daily_plan.py
          test -s autopilot/engine/procedural_visuals.py
          test -s autopilot/engine/publish_handoff.py
